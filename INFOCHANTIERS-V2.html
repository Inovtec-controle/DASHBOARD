<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>Inovtec — Infos chantiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inovtec-common.css?v=20260813-6">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=20260813-6"></script>
  <style>
    .layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}.sidebar{position:sticky;top:82px;max-height:calc(100vh - 98px);overflow:auto}
    .site-item{width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:13px;padding:11px;margin-bottom:8px}.site-item.active{border-color:var(--brand);box-shadow:0 0 0 4px rgba(22,163,74,.13)}.site-item strong{display:block;font-size:13px}.site-item span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
    .days{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}.days textarea{min-height:100px}.sticky-save{position:sticky;bottom:8px;display:flex;gap:8px;justify-content:flex-end;padding-top:12px;background:linear-gradient(transparent,#f1f5f9 30%)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.days{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><h1>Connexion Inovtec</h1><p>Les informations chantier nécessitent une connexion.</p><div class="field"><label for="loginEmail">Adresse email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">Se connecter</button><div id="loginError" class="muted" role="alert" style="margin-top:10px;color:#b91c1c"></div></form></div>
  <div id="app" class="hidden">
    <header class="topbar"><div><h1>Infos chantiers</h1><p>Accès, contacts, planning et consignes</p></div><div class="topbar-actions"><a class="btn btn-secondary" href="index.html">← Accueil</a><span id="syncStatus" class="status">Connexion…</span><button id="logoutBtn" class="btn btn-secondary" type="button">Déconnexion</button></div></header>
    <main class="page"><div class="layout">
      <aside class="card sidebar"><div class="section-title"><h2>Chantiers</h2><span id="count" class="status">0</span></div><div class="actions" style="margin-bottom:10px"><button id="newBtn" class="btn btn-primary" type="button">+ Nouveau</button><button id="deleteBtn" class="btn btn-danger" type="button" disabled>Supprimer</button></div><div class="field"><label for="search">Rechercher</label><input id="search" placeholder="Nom, adresse, syndic, agent…"></div><div id="siteList" style="margin-top:12px"></div></aside>
      <section><div id="emptySelection" class="card empty">Crée ou sélectionne un chantier.</div><form id="siteForm" class="hidden">
        <section class="card"><div class="section-title"><h2>Informations générales</h2><span id="recordState" class="status">Nouveau</span></div><div class="grid grid-2"><div class="field"><label for="nom">Nom de la résidence *</label><input id="nom" required maxlength="150"></div><div class="field"><label for="adresse">Adresse complète</label><input id="adresse" maxlength="250"></div><div class="field"><label for="cles">Numéro de clé / badge</label><input id="cles" maxlength="100"></div><div class="field"><label for="code">Code d’accès</label><input id="code" maxlength="100"></div><div class="field"><label for="nbatiments">Nombre de bâtiments</label><input id="nbatiments" inputmode="numeric" maxlength="20"></div><div class="field"><label for="gps">Position GPS / lien Maps</label><textarea id="gps"></textarea></div></div><button id="gpsBtn" class="btn btn-secondary" type="button">📍 Récupérer ma position</button></section>
        <section class="card"><div class="section-title"><h2>Contacts</h2></div><div class="grid grid-2"><div class="field"><label for="syndic">Syndic</label><input id="syndic"></div><div class="field"><label for="contactsyndic">Contact syndic</label><input id="contactsyndic"></div><div class="field"><label for="telephone">Téléphone syndic</label><input id="telephone" type="tel"></div><div class="field"><label for="emailsyndic">Email syndic</label><input id="emailsyndic" type="email"></div><div class="field"><label for="presidentCS">Président du conseil syndical</label><input id="presidentCS"></div><div class="field"><label for="telephoneCS">Téléphone président CS</label><input id="telephoneCS" type="tel"></div><div class="field"><label for="emailCS">Email président CS</label><input id="emailCS" type="email"></div></div></section>
        <section class="card"><div class="section-title"><h2>Agent et planning</h2></div><div class="grid grid-2"><div class="field"><label for="agentNom">Nom et prénom de l’agent</label><input id="agentNom"></div><div class="field"><label for="agentTel">Téléphone de l’agent</label><input id="agentTel" type="tel"></div></div><div class="days" style="margin-top:12px"><div class="field"><label for="lundi">Lundi</label><textarea id="lundi"></textarea></div><div class="field"><label for="mardi">Mardi</label><textarea id="mardi"></textarea></div><div class="field"><label for="mercredi">Mercredi</label><textarea id="mercredi"></textarea></div><div class="field"><label for="jeudi">Jeudi</label><textarea id="jeudi"></textarea></div><div class="field"><label for="vendredi">Vendredi</label><textarea id="vendredi"></textarea></div><div class="field"><label for="samedi">Samedi</label><textarea id="samedi"></textarea></div><div class="field"><label for="dimanche">Dimanche</label><textarea id="dimanche"></textarea></div></div><div class="field" style="margin-top:12px"><label for="consignesAgents">Consignes spécifiques</label><textarea id="consignesAgents"></textarea></div></section>
        <section class="card"><div class="section-title"><h2>Gestion du site</h2></div><div class="grid grid-2"><div class="field"><label for="franges">Franges / matériel spécifique</label><input id="franges"></div><div class="field"><label for="ampoules">Type d’ampoules</label><input id="ampoules"></div><div class="field"><label for="consommables">Consommables</label><input id="consommables"></div><div class="field"><label for="locauxConteneurs">Local conteneurs</label><textarea id="locauxConteneurs"></textarea></div><div class="field"><label for="sortieOM">Sortie OM</label><input id="sortieOM"></div><div class="field"><label for="rentreeOM">Rentrée OM</label><input id="rentreeOM"></div><div class="field"><label for="sortieTRI">Sortie TRI</label><input id="sortieTRI"></div><div class="field"><label for="rentreeTRI">Rentrée TRI</label><input id="rentreeTRI"></div><div class="field"><label for="localnettoyage">Local nettoyage</label><input id="localnettoyage"></div><div class="field"><label for="electricite">Prises électriques</label><input id="electricite"></div><div class="field"><label for="eau">Robinet d’eau</label><input id="eau"></div><div class="field"><label for="infopropres">Informations complémentaires</label><textarea id="infopropres"></textarea></div></div></section>
        <div class="sticky-save"><button id="pdfBtn" class="btn btn-secondary" type="button">📄 Fiche agent PDF</button><button class="btn btn-primary" type="submit">Enregistrer</button></div>
      </form></section>
    </div></main>
  </div>
<script>
(()=>{
"use strict";
if(!window.INOVTEC_FIREBASE_CONFIG){document.getElementById("loginError").textContent="Configuration Firebase introuvable.";return;}
if(!firebase.apps.length)firebase.initializeApp(window.INOVTEC_FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),collection=db.collection("chantiers");
const fieldIds=["nom","adresse","gps","cles","code","nbatiments","syndic","contactsyndic","telephone","emailsyndic","presidentCS","telephoneCS","emailCS","agentNom","agentTel","lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche","consignesAgents","franges","ampoules","consommables","locauxConteneurs","sortieOM","rentreeOM","sortieTRI","rentreeTRI","localnettoyage","electricite","eau","infopropres"];
const legacyAliases={electricite:"électricité",eau:"Eau"},chantierCollator=new Intl.Collator("fr",{sensitivity:"base",numeric:true,ignorePunctuation:true});
let sites=[],currentId=null,unsubscribe=null;const $=id=>document.getElementById(id);
function setSync(text,type=""){$("syncStatus").textContent=text;$("syncStatus").className="status"+(type?" "+type:"");}
function value(id){return $(id).value.trim();}
function displayForm(show){$("emptySelection").classList.toggle("hidden",show);$("siteForm").classList.toggle("hidden",!show);$("deleteBtn").disabled=!show||!currentId;}
function clearForm(){fieldIds.forEach(id=>$(id).value="");currentId=null;$("recordState").textContent="Nouveau";$("recordState").className="status";displayForm(true);renderList();$("nom").focus();}
function loadSite(site){currentId=site.id;fieldIds.forEach(id=>{const legacy=legacyAliases[id],raw=site[id]??(legacy?site[legacy]:"")??"";$(id).value=typeof raw==="string"?raw:String(raw);});$("recordState").textContent="Enregistré";$("recordState").className="status ok";displayForm(true);renderList();window.scrollTo({top:0,behavior:"smooth"});}
function normalizedSearch(site){return fieldIds.map(id=>{const legacy=legacyAliases[id];return String(site[id]??(legacy?site[legacy]:"")??"");}).join(" ").toLowerCase();}
function renderList(){const q=$("search").value.trim().toLowerCase(),filtered=sites.filter(site=>!q||normalizedSearch(site).includes(q)).sort((a,b)=>chantierCollator.compare(String(a.nom||""),String(b.nom||""))||String(a.id||"").localeCompare(String(b.id||"")));$("count").textContent=String(filtered.length);const list=$("siteList");list.innerHTML="";if(!filtered.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=q?"Aucun chantier ne correspond à la recherche.":"Aucun chantier enregistré.";list.appendChild(empty);return;}filtered.forEach(site=>{const button=document.createElement("button");button.type="button";button.className="site-item"+(site.id===currentId?" active":"");const name=document.createElement("strong");name.textContent=site.nom||"Sans nom";const sub=document.createElement("span"),details=[site.adresse,site.agentNom].filter(Boolean).join(" • ");sub.textContent=details||"Aucune information complémentaire";button.append(name,sub);button.addEventListener("click",()=>loadSite(site));list.appendChild(button);});}
function startRealtime(){if(unsubscribe){unsubscribe();unsubscribe=null;}setSync("Synchronisation…");unsubscribe=collection.onSnapshot(snapshot=>{sites=snapshot.docs.map(doc=>({id:doc.id,...doc.data()})).filter(site=>site._type!=="disciplinePhotoChunk"&&site._hidden!==true);renderList();setSync("Synchronisé","ok");},error=>{console.error(error);setSync("Erreur de synchronisation","error");});}
async function saveSite(){const data={};fieldIds.forEach(id=>data[id]=$(id).value.trim());if(!data.nom){alert("Le nom de la résidence est obligatoire.");$("nom").focus();return;}data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();data.updatedBy=auth.currentUser?.uid||"";setSync("Enregistrement…");try{if(currentId)await collection.doc(currentId).set(data,{merge:true});else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();const doc=await collection.add(data);currentId=doc.id;}$("recordState").textContent="Enregistré";$("recordState").className="status ok";$("deleteBtn").disabled=false;setSync("Synchronisé","ok");}catch(error){console.error(error);setSync("Échec de l’enregistrement","error");alert("L’enregistrement a échoué. Vérifie la connexion et les droits Firebase.");}}
async function deleteSite(){if(!currentId)return;const site=sites.find(s=>s.id===currentId);if(!confirm(`Supprimer définitivement « ${site?.nom||"ce chantier"} » ?`))return;setSync("Suppression…");try{await collection.doc(currentId).delete();currentId=null;fieldIds.forEach(id=>$(id).value="");displayForm(false);setSync("Synchronisé","ok");}catch(error){console.error(error);setSync("Échec de la suppression","error");}}
function addPdfLine(parent,label,text){const p=document.createElement("p"),strong=document.createElement("strong"),v=document.createElement("span");strong.textContent=label+" : ";v.textContent=text||"—";p.append(strong,v);parent.appendChild(p);}
function generatePdf(){if(!value("nom")){alert("Renseigne au minimum le nom de la résidence.");return;}const root=document.createElement("div");root.style.cssText="font-family:Arial,sans-serif;padding:24px;color:#111827";const title=document.createElement("h1");title.textContent="Fiche agent — "+value("nom");title.style.color="#16a34a";root.appendChild(title);addPdfLine(root,"Adresse",value("adresse"));addPdfLine(root,"GPS",value("gps"));addPdfLine(root,"Clé / badge",value("cles"));addPdfLine(root,"Code d’accès",value("code"));const h2=document.createElement("h2");h2.textContent="Agent et planning";root.appendChild(h2);addPdfLine(root,"Agent",value("agentNom"));addPdfLine(root,"Téléphone",value("agentTel"));["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"].forEach(day=>addPdfLine(root,day.charAt(0).toUpperCase()+day.slice(1),value(day)));const h3=document.createElement("h2");h3.textContent="Consignes";root.appendChild(h3);const consignes=document.createElement("div");consignes.style.whiteSpace="pre-wrap";consignes.textContent=value("consignesAgents")||"—";root.appendChild(consignes);const safeName=value("nom").replace(/[^a-z0-9 _-]/gi,"_").replace(/\s+/g,"_");html2pdf().set({margin:8,filename:`Fiche_${safeName}.pdf`,html2canvas:{scale:2},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(root).save();}
$("siteForm").addEventListener("submit",e=>{e.preventDefault();saveSite();});$("newBtn").addEventListener("click",clearForm);$("deleteBtn").addEventListener("click",deleteSite);$("search").addEventListener("input",renderList);$("pdfBtn").addEventListener("click",generatePdf);$("gpsBtn").addEventListener("click",()=>{if(!navigator.geolocation){alert("La géolocalisation n’est pas disponible.");return;}$("gpsBtn").disabled=true;navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);$("gps").value=`Latitude : ${lat}\nLongitude : ${lon}\nLien : https://www.google.com/maps?q=${lat},${lon}`;$("gpsBtn").disabled=false;},()=>{$("gpsBtn").disabled=false;alert("Autorise la localisation dans le navigateur pour utiliser cette fonction.");},{enableHighAccuracy:true,timeout:10000});});
$("logoutBtn").addEventListener("click",()=>auth.signOut());$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value);}catch(error){$("loginError").textContent="Connexion impossible : "+(error.message||"vérifie les identifiants.");}});
auth.onAuthStateChanged(user=>{if(user){$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");displayForm(false);startRealtime();}else{if(unsubscribe){unsubscribe();unsubscribe=null;}sites=[];currentId=null;$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");}});
})();
</script>
</body>
</html>
