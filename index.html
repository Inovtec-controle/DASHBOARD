<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tableau de bord – Mes applications</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16a34a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f1f5f9;
      --panel:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(148,163,184,.4);
      --brand:#16a34a;
      --brand-soft:rgba(22,163,74,.08);
      --radius-xl:20px;
      --shadow-soft:0 14px 35px rgba(15,23,42,.25);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      height:100%;
    }

    body{
      font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#d1fae5 0,#f1f5f9 45%,#e2e8f0 100%);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding:12px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    }

    .app-shell{
      width:100%;
      max-width:520px;
      background:radial-gradient(circle at top left,#22c55e 0,#16a34a 38%,#022c22 100%);
      border-radius:26px;
      padding:10px;
      box-shadow:var(--shadow-soft);
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
      overflow:hidden;
    }

    .status-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:#e5f9ed;
      font-size:11px;
      padding:4px 6px 0;
      opacity:.9;
    }

    .screen{
      flex:1;
      background:radial-gradient(circle at top,#f9fafb 0,#f1f5f9 40%,#e2e8f0 100%);
      border-radius:20px;
      padding:16px 14px 16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow:hidden;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .title-block h1{
      margin:0;
      font-size:20px;
      letter-spacing:-0.03em;
      color:#020617;
    }

    #home-screen{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow-y:auto;
    }

    .section-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.13em;
      color:var(--muted);
      margin-bottom:4px;
    }

    .app-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:10px;
    }

    .app-card{
      background:var(--panel);
      border-radius:var(--radius-xl);
      padding:10px;
      border:1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:6px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(15,23,42,.12);
      transition:transform .12s ease, box-shadow .12s ease;
    }

    .app-card:active{
      transform:scale(.97);
    }

    .app-icon{
      width:34px;
      height:34px;
      border-radius:999px;
      background:var(--brand-soft);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app-icon img{
      width:18px;
      height:18px;
      object-fit:contain;
      filter:brightness(0); /* force noir */
    }

    .app-title{
      font-size:14px;
      font-weight:600;
    }

    .app-sub{
      font-size:11px;
      color:var(--muted);
    }

    .home-indicator{
      height:4px;
      width:82px;
      border-radius:999px;
      background:rgba(15,23,42,.85);
      margin:0 auto 2px;
    }
  </style>
</head>

<body>
<div class="app-shell">

  <div class="status-bar">
    <div>Tableau de bord</div>
  </div>

  <div class="screen">
    <header>
      <div class="title-block">
        <h1>Tableau de bord</h1>
      </div>
    </header>

    <div id="home-screen">
      <div>
        <div class="section-label">Mes applications</div>

        <div class="app-grid">

          <div class="app-card" onclick="openFeature('KONTROL.html')">
            <div class="app-icon">
              <img src="Kontrol.png">
            </div>
            <div class="app-title">KONTROL</div>
            <div class="app-sub">Contrôle qualité</div>
          </div>

          <div class="app-card" onclick="openFeature('INFOCHANTIERS.html')">
            <div class="app-icon">
              <img src="INFO CHANTIER.png">
            </div>
            <div class="app-title">Infos Chantiers</div>
          </div>

          <div class="app-card" onclick="openFeature('ORGA.html')">
            <div class="app-icon">
              <img src="ORGA.png">
            </div>
            <div class="app-title">Orga</div>
          </div>

          <div class="app-card" onclick="openFeature('TEMPS.html')">
            <div class="app-icon">
              ⏱
            </div>
            <div class="app-title">Temps</div>
          </div>

          <div class="app-card" onclick="openFeature('PLANNINGS.html')">
            <div class="app-icon">
              <img src="PLANNINGS.png">
            </div>
            <div class="app-title">Planning</div>
          </div>

          <div class="app-card" onclick="openFeature('SALAIRE.html')">
            <div class="app-icon">
              <img src="SALAIRE.png">
            </div>
            <div class="app-title">Salaire</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
function getBasePath(){
  const path = window.location.pathname;
  if (path.endsWith('index.html')) return path.slice(0, -'index.html'.length);
  if (path.endsWith('/')) return path;
  return path.substring(0, path.lastIndexOf('/') + 1);
}

function openFeature(fileName){
  const base = getBasePath();
  window.location.href = base + fileName;
}
</script>

</body>
</html>
