<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tableau de bord – Mes applications</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16a34a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f1f5f9;
      --panel:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(148,163,184,.4);
      --brand:#16a34a;
      --brand-soft:rgba(22,163,74,.08);
      --radius-xl:20px;
      --shadow-soft:0 14px 35px rgba(15,23,42,.25);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      font-family:'Inter',system-ui;
      background:radial-gradient(circle at top,#d1fae5 0,#f1f5f9 45%,#e2e8f0 100%);
      display:flex;
      justify-content:center;
      padding:12px;
    }

    .app-shell{
      width:100%;
      max-width:520px;
      background:radial-gradient(circle at top left,#22c55e 0,#16a34a 38%,#022c22 100%);
      border-radius:26px;
      padding:10px;
      box-shadow:var(--shadow-soft);
    }

    .screen{
      background:#f1f5f9;
      border-radius:20px;
      padding:16px;
    }

    .section-label{
      font-size:12px;
      letter-spacing:.13em;
      color:var(--muted);
      margin-bottom:10px;
    }

    .app-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .app-card{
      background:#ffffff;
      border-radius:18px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:6px;
      box-shadow:0 6px 15px rgba(0,0,0,0.08);
      cursor:pointer;
      transition:.15s;
    }

    .app-card:active{
      transform:scale(.96);
    }

    /* BULLE ICONE */
    .app-icon{
      width:36px;
      height:36px;
      border-radius:50%;
      background:#e2e8f0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app-icon img{
      width:20px;
      height:20px;
      object-fit:contain;
      /* IMPORTANT : on enlève le filtre */
    }

    .app-title{
      font-weight:600;
      font-size:14px;
    }

    .app-sub{
      font-size:11px;
      color:var(--muted);
    }

  </style>
</head>

<body>

<div class="app-shell">
  <div class="screen">

    <div class="section-label">MES APPLICATIONS</div>

    <div class="app-grid">

      <div class="app-card" onclick="openFeature('KONTROL.html')">
        <div class="app-icon">
          <img src="Kontrol.png">
        </div>
        <div class="app-title">KONTROL</div>
        <div class="app-sub">Contrôle qualité</div>
      </div>

      <div class="app-card" onclick="openFeature('INFOCHANTIERS.html')">
        <div class="app-icon">
          <img src="INFO CHANTIER.png">
        </div>
        <div class="app-title">Infos Chantiers</div>
      </div>

      <div class="app-card" onclick="openFeature('ORGA.html')">
        <div class="app-icon">
          <img src="ORGA.png">
        </div>
        <div class="app-title">Orga</div>
      </div>

      <div class="app-card" onclick="openFeature('TEMPS.html')">
        <div class="app-icon">⏱</div>
        <div class="app-title">Temps</div>
      </div>

      <div class="app-card" onclick="openFeature('PLANNINGS.html')">
        <div class="app-icon">
          <img src="PLANNINGS.png">
        </div>
        <div class="app-title">Planning</div>
      </div>

      <div class="app-card" onclick="openFeature('SALAIRE.html')">
        <div class="app-icon">
          <img src="SALAIRE.png">
        </div>
        <div class="app-title">Salaire</div>
      </div>

    </div>
  </div>
</div>

<script>
function openFeature(fileName){
  window.location.href = fileName;
}
</script>

</body>
</html>
