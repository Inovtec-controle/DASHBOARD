<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KONTROL – Classeur Agents</title>

<!-- iPhone friendly -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16a34a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f1f5f9;
  --panel:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:rgba(148,163,184,.35);
  --brand:#16a34a;
  --brand2:#22c55e;
  --danger:#ef4444;
  --shadow:0 12px 30px rgba(15,23,42,.10);
  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{min-height:100dvh;display:flex;flex-direction:column}

/* ===== TOPBAR ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;
  padding:14px 14px calc(14px + env(safe-area-inset-top));
  box-shadow:0 10px 24px rgba(22,163,74,.22);
}
.topbar .row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:14px;
  background:rgba(255,255,255,.18);
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.25);
}
.logo svg{width:22px;height:22px;fill:#fff}
.brand h1{font-size:15px;font-weight:800}
.brand p{font-size:12px;opacity:.9}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== BOUTONS ===== */
.btn{
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.14);
  color:#fff;
  padding:10px 12px;
  border-radius:14px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn.secondary{background:rgba(255,255,255,.10)}
.btn.dark{background:#0f172a;border-color:rgba(15,23,42,.12)}

/* ===== MINI BOUTON ICÔNE ===== */
.iconBtn{
  width:42px;
  height:42px;
  padding:0;
  border-radius:14px;
  display:inline-grid;
  place-items:center;
}
.iconBtn svg{
  width:18px;
  height:18px;
  fill:#fff;
}

/* ===== LAYOUT ===== */
.content{
  padding:14px;
  display:grid;
  gap:14px;
  grid-template-columns:360px 1fr;
}
@media(max-width:980px){.content{grid-template-columns:1fr}}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.cardHeader{
  padding:14px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center
}
.cardHeader h2{font-size:14px;font-weight:900}
.cardBody{padding:14px}

.input{
  width:100%;
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 12px;
  font-size:14px;
}
.input:focus{
  outline:none;
  border-color:rgba(22,163,74,.6);
  box-shadow:0 0 0 4px rgba(34,197,94,.18);
}

.list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-height:calc(100dvh - 240px);
  overflow:auto;
}
.listItem{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.listItem.active{
  border-color:rgba(22,163,74,.6);
  box-shadow:0 0 0 4px rgba(34,197,94,.16);
}
.avatar{
  width:42px;height:42px;border-radius:16px;
  background:rgba(22,163,74,.15);
  display:grid;place-items:center;
  font-weight:900;color:var(--brand);
}

.empty{
  padding:16px;
  border:1px dashed var(--border);
  border-radius:16px;
  color:var(--muted);
  font-weight:700;
}

.footNote{
  padding:14px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="row">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M6 20v-1a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v1zM12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/></svg>
      </div>
      <div>
        <h1>KONTROL – Agents</h1>
        <p>Classeur & suivi</p>
      </div>
    </div>

    <div class="actions">
      <!-- 🔙 MINI BOUTON RETOUR ACCUEIL -->
      <a class="btn secondary iconBtn" href="index.html" title="Retour accueil" aria-label="Retour accueil">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 5.5a1 1 0 0 1 0 1.4L11.4 11H20a1 1 0 1 1 0 2h-8.6l4.1 4.1a1 1 0 1 1-1.4 1.4l-5.8-5.8a1 1 0 0 1 0-1.4l5.8-5.8a1 1 0 0 1 1.4 0Z"/>
        </svg>
      </a>

      <button class="btn" id="btnNewAgent">+ Nouvel agent</button>
      <button class="btn secondary" id="btnExport">Exporter</button>
      <label class="btn secondary">
        Importer
        <input type="file" id="fileImport" accept="application/json" hidden>
      </label>
      <button class="btn dark" id="btnReset">Reset</button>
    </div>
  </div>
</header>

<main class="content">

<section class="card">
  <div class="cardHeader">
    <h2>Agents</h2>
    <span id="agentCount">0</span>
  </div>
  <div class="cardBody">
    <input class="input" id="search" placeholder="Rechercher un agent">
    <div class="list" id="agentList"></div>
    <div class="empty" id="emptyList" style="display:none">Aucun agent</div>
  </div>
</section>

<section class="card">
  <div class="cardHeader">
    <h2>Fiche agent</h2>
  </div>
  <div class="cardBody" id="details">
    <div class="empty">Sélectionne un agent</div>
  </div>
</section>

</main>

<div class="footNote">
  Données stockées localement (navigateur). Compatible GitHub Pages.
</div>

</div>

<script>
/* VERSION STABLE – KONTROL AGENTS */

const STORE="kontrol_agents_v1";
const $=s=>document.querySelector(s);

let state={agents:[],selected:null};

function save(){localStorage.setItem(STORE,JSON.stringify(state.agents))}
function load(){state.agents=JSON.parse(localStorage.getItem(STORE)||"[]")}

function newAgent(){
  const a={id:crypto.randomUUID(),prenom:"",nom:"",docs:[],incidents:[]};
  state.agents.push(a);
  state.selected=a.id;
  save();render();
}

function render(){
  const list=$("#agentList");
  list.innerHTML="";
  $("#agentCount").textContent=state.agents.length;
  if(!state.agents.length){$("#emptyList").style.display="block";return}
  $("#emptyList").style.display="none";

  state.agents.forEach(a=>{
    const div=document.createElement("div");
    div.className="listItem"+(a.id===state.selected?" active":"");
    div.innerHTML=`
      <div style="display:flex;gap:10px;align-items:center">
        <div class="avatar">${(a.prenom||"A")[0]}</div>
        <strong>${a.prenom||""} ${a.nom||""}</strong>
      </div>`;
    div.onclick=()=>{state.selected=a.id;render()};
    list.appendChild(div);
  });
}

$("#btnNewAgent").onclick=newAgent;
$("#btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(state.agents,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="agents.json";
  a.click();
};
$("#fileImport").onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{state.agents=JSON.parse(r.result);save();render()};
  r.readAsText(e.target.files[0]);
};
$("#btnReset").onclick=()=>{
  if(confirm("Tout effacer ?")){localStorage.removeItem(STORE);state.agents=[];render()}
};

load();render();
</script>
</body>
</html>
