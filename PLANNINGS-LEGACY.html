<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16a34a"><title>Inovtec — Plannings</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="inovtec-common.css"><style>.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700}.chip.active{background:var(--brand);color:#fff}.day{font-weight:800;color:#166534}.mobile-cards{display:none}.entry{border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}@media(max-width:760px){.desktop-table{display:none}.mobile-cards{display:block}}</style></head><body>
<header class="topbar"><div><h1>Plannings agents</h1><p>Semaine, horaires, sites et export</p></div><div class="topbar-actions"><a class="btn btn-secondary" href="index.html">← Accueil</a><button id="exportBtn" class="btn btn-secondary">Exporter</button><label for="importFile" class="btn btn-secondary">Importer</label><input id="importFile" type="file" accept="application/json" hidden><button id="printBtn" class="btn btn-secondary">Imprimer</button></div></header>
<main class="page">
<section class="card"><div class="grid grid-3"><div class="field"><label for="week">Semaine</label><input id="week" type="week"></div><div class="field"><label>Semaine calculée</label><div id="weekInfo" class="status">—</div></div><div class="field"><label>Sauvegarde</label><div class="status warning">Données locales</div></div></div></section>
<section class="card"><div class="section-title"><h2>Agents</h2><div class="actions"><button id="addAgent" class="btn btn-primary">+ Ajouter</button><button id="renameAgent" class="btn btn-secondary">Renommer</button><button id="deleteAgent" class="btn btn-danger">Supprimer</button></div></div><div id="agents" class="chips"></div></section>
<section class="card"><div class="section-title"><h2 id="formTitle">Ajouter une intervention</h2><button id="cancelEdit" class="btn btn-secondary hidden">Annuler</button></div><form id="form"><div class="grid grid-3"><div class="field"><label for="day">Jour</label><select id="day"></select></div><div class="field"><label for="start">Début *</label><input id="start" type="time" required></div><div class="field"><label for="end">Fin *</label><input id="end" type="time" required></div><div class="field"><label for="task">Prestation *</label><input id="task" required maxlength="120"></div><div class="field"><label for="site">Site</label><input id="site" maxlength="150"></div><div class="field"><label for="note">Note</label><input id="note" maxlength="250"></div></div><button class="btn btn-primary" style="margin-top:12px">Enregistrer</button></form></section>
<section class="card"><div class="section-title"><h2 id="title">Planning</h2><span id="count" class="status">0</span></div><div class="table-wrap desktop-table"><table><thead><tr><th>Jour</th><th>Horaires</th><th>Prestation</th><th>Site</th><th>Note</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="cards" class="mobile-cards"></div></section>
<div class="notice warning">Les données sont enregistrées dans ce navigateur. Utilise régulièrement le bouton Exporter.</div></main>
<script>(()=>{"use strict";const KEY="inovtec_plannings_v2",DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],$=id=>document.getElementById(id);let state={agents:[],weeks:{},selected:null},editing=null;
const uid=p=>p+"_"+Date.now()+"_"+Math.random().toString(16).slice(2);function load(){try{const r=localStorage.getItem(KEY);if(r)state=JSON.parse(r)}catch{}if(!state||!Array.isArray(state.agents)||!state.weeks)state={agents:[],weeks:{},selected:null};if(!state.agents.length){const id=uid("a");state.agents=[{id,name:"Agent 1",copies:1}];state.selected=id}if(!state.agents.some(a=>a.id===state.selected))state.selected=state.agents[0].id}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function agent(){return state.agents.find(a=>a.id===state.selected)}function wk(){return $("week").value}function entries(){if(!state.weeks[wk()])state.weeks[wk()]=[];return state.weeks[wk()]}function current(){return entries().filter(e=>e.agentId===state.selected).sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start))}function nowWeek(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4),w=1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);return d.getFullYear()+"-W"+String(w).padStart(2,"0")}function info(){const m=wk().match(/W(\d{2})$/);return m?"Semaine "+Number(m[1])+" · "+(Number(m[1])%2?"impaire":"paire"):"—"}function valid(a,b){return /^\d\d:\d\d$/.test(a)&&/^\d\d:\d\d$/.test(b)&&b>a}
function reset(){editing=null;$("form").reset();$("day").value="0";$("formTitle").textContent="Ajouter une intervention";$("cancelEdit").classList.add("hidden")}function renderAgents(){const box=$("agents");box.innerHTML="";state.agents.forEach(a=>{const b=document.createElement("button");b.className="chip"+(a.id===state.selected?" active":"");b.textContent=a.name;b.onclick=()=>{state.selected=a.id;reset();render()};box.appendChild(b)})}
function action(text,fn,danger=false){const b=document.createElement("button");b.type="button";b.textContent=text;b.className="btn "+(danger?"btn-danger":"btn-secondary");b.style.padding="6px 8px";b.style.fontSize="11px";b.onclick=fn;return b}function edit(id){const e=entries().find(x=>x.id===id);if(!e)return;editing=id;["day","start","end","task","site","note"].forEach(k=>$(k).value=e[k]??"");$("formTitle").textContent="Modifier l’intervention";$("cancelEdit").classList.remove("hidden");scrollTo({top:0,behavior:"smooth"})}function del(id){const e=entries().find(x=>x.id===id);if(!e||!confirm("Supprimer « "+e.task+" » ?"))return;state.weeks[wk()]=entries().filter(x=>x.id!==id);save();renderList()}
function renderList(){const list=current();$("title").textContent="Planning — "+(agent()?.name||"Agent");$("count").textContent=list.length+" intervention"+(list.length>1?"s":"");$("weekInfo").textContent=info();const rows=$("rows"),cards=$("cards");rows.innerHTML="";cards.innerHTML="";list.forEach(e=>{const tr=document.createElement("tr");[DAYS[e.day],e.start+" – "+e.end,e.task,e.site||"",e.note||""].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});const td=document.createElement("td"),acts=document.createElement("div");acts.className="actions";acts.append(action("Modifier",()=>edit(e.id)),action("Supprimer",()=>del(e.id),true));td.appendChild(acts);tr.appendChild(td);rows.appendChild(tr);const c=document.createElement("article");c.className="entry";const d=document.createElement("div");d.className="day";d.textContent=DAYS[e.day]+" · "+e.start+" – "+e.end;const t=document.createElement("strong");t.textContent=e.task;c.append(d,t);if(e.site){const s=document.createElement("div");s.className="muted";s.textContent=e.site;c.appendChild(s)}if(e.note){const n=document.createElement("div");n.className="muted";n.textContent=e.note;c.appendChild(n)}const ca=document.createElement("div");ca.className="actions";ca.style.marginTop="8px";ca.append(action("Modifier",()=>edit(e.id)),action("Supprimer",()=>del(e.id),true));c.appendChild(ca);cards.appendChild(c)});if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="Aucune intervention pour cette semaine.";cards.appendChild(e)}}function render(){renderAgents();renderList();save()}
DAYS.forEach((d,i)=>{const o=document.createElement("option");o.value=i;o.textContent=d;$("day").appendChild(o)});load();$("week").value=nowWeek();$("week").onchange=()=>{reset();renderList();save()};$("form").onsubmit=e=>{e.preventDefault();const start=$("start").value,end=$("end").value;if(!valid(start,end)){alert("L’heure de fin doit être après le début.");return}const data={agentId:state.selected,day:Number($("day").value),start,end,task:$("task").value.trim(),site:$("site").value.trim(),note:$("note").value.trim()};if(editing){const old=entries().find(x=>x.id===editing);if(old)Object.assign(old,data)}else entries().push({id:uid("e"),...data});save();reset();renderList()};$("cancelEdit").onclick=reset;
$("addAgent").onclick=()=>{const n=prompt("Nom de l’agent :");if(!n?.trim())return;const a={id:uid("a"),name:n.trim(),copies:1};state.agents.push(a);state.selected=a.id;render()};$("renameAgent").onclick=()=>{const a=agent(),n=prompt("Nouveau nom :",a?.name||"");if(a&&n?.trim()){a.name=n.trim();render()}};$("deleteAgent").onclick=()=>{const a=agent();if(state.agents.length===1){alert("Il faut garder un agent.");return}if(!a||!confirm("Supprimer "+a.name+" et ses interventions ?"))return;state.agents=state.agents.filter(x=>x.id!==a.id);Object.keys(state.weeks).forEach(k=>state.weeks[k]=state.weeks[k].filter(e=>e.agentId!==a.id));state.selected=state.agents[0].id;render()};
$("exportBtn").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="inovtec_plannings_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)};$("importFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.agents)||!x.weeks)throw Error("format incompatible");state=x;reset();render();alert("Import réussi.")}catch(err){alert("Import impossible : "+err.message)}};r.readAsText(f);e.target.value=""};$("printBtn").onclick=()=>{window.print()};render()})();</script></body></html>
