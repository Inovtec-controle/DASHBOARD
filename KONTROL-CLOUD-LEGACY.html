<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16a34a">
<title>KONTROL - Contrôle Qualité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kontrol-cloud.css?v=20260819-mobile1">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <h1>Connexion Inovtec</h1>
      <p>KONTROL nécessite désormais la même connexion que les autres pages synchronisées.</p>
      <div class="field"><label for="loginEmail">Adresse email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Se connecter</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>

  <div id="appShell" class="hidden">
    <iframe id="kontrolFrame" title="KONTROL – Contrôle Qualité" allow="camera; geolocation"></iframe>
    <button id="archiveBtn" class="cloud-button" type="button" title="PDF archivés" aria-label="Consulter les PDF archivés">☁️</button>
  </div>

  <div id="archiveModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
    <section class="modal">
      <div class="modal-head">
        <div>
          <h2 id="archiveTitle">PDF KONTROL archivés</h2>
          <p id="accountLabel"></p>
        </div>
        <div class="modal-actions">
          <button id="refreshArchiveBtn" class="btn" type="button">Actualiser</button>
          <button id="logoutBtn" class="btn" type="button">Déconnexion</button>
          <button id="closeArchiveBtn" class="btn" type="button">Fermer</button>
        </div>
      </div>
      <div id="archiveList" class="archive-list"><div class="archive-empty">Chargement…</div></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="kontrol-cloud.js?v=20260830-pdfphotos1"></script>
<script src="inovtec-kontrol-shared-archive.js?v=20260830-pdfphotos1"></script>
<script src="inovtec-kontrol-ref-metadata.js?v=20260830-pdfphotos1"></script>
<script src="kontrol-reading-scroll.js?v=20260819-1"></script>
</body>
</html>
