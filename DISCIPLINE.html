<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INOVTEC - Dossier disciplinaire</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7}
header{background:#0f172a;color:#fff;padding:18px 24px;font-size:24px;font-weight:bold}
.container{max-width:1100px;margin:20px auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
textarea{min-height:90px}
button{background:#16a34a;color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer}
button:hover{background:#15803d}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.badge{padding:4px 8px;border-radius:20px;color:#fff;font-size:12px}
.obs{background:#3b82f6}.av{background:#f59e0b}.md{background:#ef4444}.lic{background:#7f1d1d}
.actions button{background:#dc2626}
</style>
</head>
<body>
<header>INOVTEC - Gestion Disciplinaire</header>
<div class="container">
<div class="card">
<h2>Nouvelle fiche disciplinaire</h2>
<div class="grid">
<div><label>Agent</label><input id="agent"></div>
<div><label>Chantier</label><input id="site"></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Niveau</label>
<select id="niveau">
<option>Observation</option>
<option>Avertissement</option>
<option>Mise en demeure</option>
<option>Procédure de licenciement</option>
</select></div>
</div>
<p><label>Motif</label><input id="motif"></p>
<p><label>Description</label><textarea id="desc"></textarea></p>
<p><label>Témoins</label><input id="tem"></p>
<p><label>Responsable</label><input id="resp"></p>
<button onclick="ajouter()">Enregistrer</button>
</div>

<div class="card">
<h2>Historique</h2>
<table>
<thead><tr><th>Date</th><th>Agent</th><th>Site</th><th>Niveau</th><th>Motif</th><th>Actions</th></tr></thead>
<tbody id="liste"></tbody>
</table>
</div>
</div>
<script>
date.value=new Date().toISOString().split('T')[0];
let data=JSON.parse(localStorage.getItem('discipline')||'[]');
function badge(n){
if(n==='Observation') return '<span class="badge obs">'+n+'</span>';
if(n==='Avertissement') return '<span class="badge av">'+n+'</span>';
if(n==='Mise en demeure') return '<span class="badge md">'+n+'</span>';
return '<span class="badge lic">'+n+'</span>';
}
function save(){localStorage.setItem('discipline',JSON.stringify(data));}
function render(){
liste.innerHTML='';
data.forEach((d,i)=>{
liste.innerHTML+=`<tr>
<td>${d.date}</td>
<td>${d.agent}</td>
<td>${d.site}</td>
<td>${badge(d.niveau)}</td>
<td>${d.motif}</td>
<td class="actions">
<button onclick="imprimer(${i})">PDF</button>
<button onclick="suppr(${i})">X</button>
</td></tr>`;
});
}
function ajouter(){
data.unshift({
agent:agent.value,site:site.value,date:date.value,niveau:niveau.value,
motif:motif.value,desc:desc.value,tem:tem.value,resp:resp.value
});
save();render();
document.querySelectorAll('input:not(#date),textarea').forEach(e=>e.value='');
niveau.selectedIndex=0;
}
function suppr(i){if(confirm('Supprimer ?')){data.splice(i,1);save();render();}}
function imprimer(i){
const d=data[i];
const w=window.open('');
w.document.write(`<h1>Dossier disciplinaire</h1>
<p><b>Agent :</b> ${d.agent}</p>
<p><b>Date :</b> ${d.date}</p>
<p><b>Site :</b> ${d.site}</p>
<p><b>Niveau :</b> ${d.niveau}</p>
<p><b>Motif :</b> ${d.motif}</p>
<p><b>Description :</b><br>${d.desc}</p>
<p><b>Témoins :</b> ${d.tem}</p>
<p><b>Responsable :</b> ${d.resp}</p>`);
w.print();
}
render();
</script>
</body>
</html>
