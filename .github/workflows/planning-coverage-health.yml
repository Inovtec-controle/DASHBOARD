name: Planning coverage health

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le Planning restauré et Firebase direct
        shell: bash
        run: |
          set -euo pipefail
          test -s PLANNINGS.html
          test -s PLANNINGS-APP.html
          test -s planning-calendar.js
          test -s planning-calendar.css
          test -s planning-container-bridge.js
          test -s inovtec-container-schedule.js
          grep -q 'inovtec-page-shell.html' PLANNINGS.html
          grep -q 'PLANNINGS-APP.html' PLANNINGS.html
          grep -q 'planning-calendar.js' PLANNINGS-APP.html
          grep -q 'id="editorPopover"' PLANNINGS-APP.html
          grep -q 'id="edDone"' PLANNINGS-APP.html
          grep -q 'captureCalendarDoubleClick' planning-calendar.js
          grep -q 'draftEvent' planning-calendar.js
          grep -q 'saveEditor' planning-calendar.js
          grep -q 'inovtec-data-hub.js' PLANNINGS-APP.html
          grep -q 'planning-firebase-direct-v2.js' PLANNINGS-APP.html
          grep -q 'planning-container-bridge.js' PLANNINGS-APP.html
          grep -q 'inovtec-container-schedule.js' PLANNINGS-APP.html
          grep -q 'id="ivPlanningContainerInfo"' PLANNINGS-APP.html
          grep -q 'normalizeContainerTask' planning-calendar.js
          grep -q 'normalizeContainerTasks' planning-calendar.js
          grep -q 'editorContainerTasks' planning-calendar.js
          grep -q 'Tu peux en sélectionner plusieurs' planning-calendar.js
          grep -q 'renderContainerReminder' planning-calendar.js
          grep -q 'refreshOpenEditorContainerInfo' planning-calendar.js
          grep -q 'scheduleEditorContainerRefresh' planning-calendar.js
          grep -q 'Synchronisation avec Infos chantier' planning-calendar.js
          grep -q 'localHub=window.InovtecDataHub' planning-calendar.js
          ! grep -q 'filtres=selected.filter' planning-calendar.js
          grep -q 'actionsFromInfosForDate' inovtec-container-schedule.js
          grep -q 'sourceSystem:SOURCE' planning-container-bridge.js
          grep -q 'validContainerTasks' planning-container-bridge.js
          grep -q 'selectedAgentId' planning-calendar.js
          grep -q 'selectedAgentId' planning-container-bridge.js
          grep -q 'sameContainerTaskSet' planning-container-bridge.js
          grep -q 'sameLinkedSlot' planning-container-bridge.js
          grep -q 'markers.forEach' planning-container-bridge.js
          grep -q 'isPassiveTeamClone' planning-container-bridge.js
          ! grep -q 'inovtec-cloud-sync-v2.js' PLANNINGS-APP.html
          grep -q 'planning-replacement.js' PLANNINGS-APP.html
          grep -q 'planning-pdf.js' PLANNINGS-APP.html
          grep -q 'planning-pdf-robust-text.js' PLANNINGS-APP.html
          grep -q 'containerLabels' planning-pdf.js
          grep -q 'containerText' planning-pdf.js
          grep -q 'containerLabels' planning-pdf-robust-text.js
          grep -q 'containerLines' planning-pdf-robust-text.js
          grep -q 'Conteneurs :' planning-pdf-robust-text.js
          grep -q 'planning-legal-guard.js' PLANNINGS-APP.html
          grep -q 'planning-team-safe-ui.js' PLANNINGS-APP.html
          grep -q 'planning-copy-count.js' PLANNINGS-APP.html
          ! grep -q 'id="addTaskBtn"' PLANNINGS-APP.html
          node --check planning-calendar.js
          node --check planning-firebase-direct-v2.js
          node --check planning-team-safe-ui.js
          node --check planning-replacement.js
          node --check inovtec-container-schedule.js
          node --check planning-container-bridge.js
          node --check inovtec-container-planning-link.js
          node --check planning-pdf.js
          node --check planning-pdf-robust-text.js
          node tests/planning-pdf-containers.mjs
