name: Corrige le tri des listes sans casser les composants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-alpha-child-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corriger le tri des enfants directs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('inovtec-alphabetical-lists.js')
          s = p.read_text(encoding='utf-8')
          old = 'const arr=[...container.querySelectorAll(`:scope > ${selector}`)];if(arr.length<2)return;'
          new = 'const arr=[...container.children].filter(n=>n.matches(selector));if(arr.length<2)return;'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('Sélecteur de tri attendu introuvable')
          p.write_text(s, encoding='utf-8')

          shell = Path('inovtec-page-shell.html')
          h = shell.read_text(encoding='utf-8')
          import re
          newref = 'inovtec-alphabetical-lists.js?v=20260829-agentstable1'
          if 'inovtec-alphabetical-lists.js?v=' not in h:
              raise SystemExit('Référence cache du tri introuvable')
          shell.write_text(re.sub(r'inovtec-alphabetical-lists\.js\?v=[^"\']+', newref, h), encoding='utf-8')
          PY

      - name: Vérifier la correction
        shell: bash
        run: |
          set -euo pipefail
          node --check inovtec-alphabetical-lists.js
          grep -Fq 'container.children].filter(n=>n.matches(selector))' inovtec-alphabetical-lists.js
          ! grep -Fq 'querySelectorAll(`:scope > ${selector}`)' inovtec-alphabetical-lists.js
          grep -Fq 'inovtec-alphabetical-lists.js?v=20260829-agentstable1' inovtec-page-shell.html
          test -s inovtec-referential.js
          grep -Fq 'function renderAgents()' planning-calendar.js
          grep -Fq 'row.append(dot,name)' planning-calendar.js

      - name: Publier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          git add inovtec-alphabetical-lists.js inovtec-page-shell.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige le tri des listes sans détacher les composants'
          git push
