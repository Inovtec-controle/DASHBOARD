name: Aligne verticalement le formulaire Organisation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-orga-form-stack.yml'
      - '.github/patch-orga-form-stack.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Modifier le formulaire
        run: python3 .github/patch-orga-form-stack.py

      - name: Vérifier la mise en page
        shell: bash
        run: |
          set -euo pipefail
          block="$(sed -n '/<form id="taskForm">/,/<\/form>/p' ORGA-LEGACY.html)"
          ! grep -Fq 'grid grid-3' <<< "$block"
          ! grep -Fq 'grid grid-2' <<< "$block"
          test "$(grep -c 'class="field"' <<< "$block")" -eq 5

      - name: Publier et nettoyer le patch ponctuel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          rm .github/workflows/patch-orga-form-stack.yml .github/patch-orga-form-stack.py
          git add ORGA-LEGACY.html .github/workflows/patch-orga-form-stack.yml .github/patch-orga-form-stack.py
          git commit -m 'Améliore ergonomie du formulaire Organisation'
          git push
