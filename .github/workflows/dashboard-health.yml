name: Dashboard health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: dashboard-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Contrôler les pages et les fonctions indispensables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          must_exist=['index.html','dashboard-index.js','dashboard-concept3.css','dashboard-index-shared.js','dashboard-global-search.js','inovtec-page-shell.html','inovtec-shell.js','inovtec-data-hub.js','inovtec-cloud-sync.js','firebase-config.js','PLANNINGS.html','PLANNINGS-LEGACY.html','planning-calendar.js','planning-context-fit.js','planning-autoheight.js','VARIABLES.html','VARIABLES-DASHBOARD.html','VARIABLES-LEGACY.html','AGENTS.html','INFOCHANTIERS-V2.html','KONTROL-CLOUD.html','CONGES.html','ORGA.html','MATERIEL.html','REASSORT.html']
          issues=[]
          for p in must_exist:
              f=Path(p)
              if not f.is_file() or f.stat().st_size==0:issues.append(f'Fichier absent ou vide : {p}')
          class Refs(HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.scripts=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'):self.ids.add(a['id'])
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
                  if tag=='script' and a.get('src'):self.scripts.append(a['src'])
          pages={}
          for name in ('index.html','inovtec-page-shell.html','PLANNINGS-LEGACY.html','VARIABLES-DASHBOARD.html'):
              parser=Refs();parser.feed(Path(name).read_text(encoding='utf-8'));pages[name]=parser
          home=pages['index.html'];shell=pages['inovtec-page-shell.html'];planning=pages['PLANNINGS-LEGACY.html']
          for page in ('PLANNINGS.html','KONTROL-CLOUD.html','INFOCHANTIERS-V2.html','AGENTS.html','CONGES.html','VARIABLES.html','ORGA.html','MATERIEL.html','REASSORT.html'):
              if not any(urlsplit(h).path==page for h in home.links):issues.append(f'Navigation accueil absente : {page}')
          if any('discipline' in urlsplit(h).path.lower() for h in home.links):issues.append('Ancien module Discipline encore lié depuis l’accueil')
          for name in ('globalSearch','heroUserName','heroSyncText','kpiVariables','kpiIncidents'):
              if name not in home.ids:issues.append(f'Identifiant du tableau de bord absent : {name}')
          for name in ('legacyFrame','pageSummary','desktopNav','mobileNav'):
              if name not in shell.ids:issues.append(f'Conteneur principal absent : {name}')
          for name in ('planning-calendar.js','planning-context-fit.js','planning-autoheight.js','planning-pdf.js'):
              if not any(urlsplit(src).path==name for src in planning.scripts):issues.append(f'Script Planning non chargé : {name}')
          for path,markers in {
              'planning-calendar.js':('sanitizePlanningState','ensureParityForCurrentView','inovtec:planning-cloud-updated'),
              'planning-context-fit.js':('visibleBounds','fitContextMenu'),
              'inovtec-cloud-sync.js':('onSnapshot','moduleSyncV1'),
              'dashboard-index-shared.js':('openIncidentCount','kontrolPdfMeta'),
          }.items():
              contents=Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in contents:issues.append(f'{path} : fonction ou branchement manquant ({marker})')
          for issue in issues:print(f'::error::{issue}')
          print(f'Contrôles Dashboard : {len(must_exist)} fichiers, {len(home.links)} liens accueil, {len(issues)} erreur(s)')
          if issues:raise SystemExit(1)
          PY
      - name: Contrôler la syntaxe des composants essentiels
        shell: bash
        run: |
          set -euo pipefail
          for f in dashboard-index.js dashboard-index-shared.js dashboard-global-search.js inovtec-shell.js inovtec-data-hub.js inovtec-cloud-sync.js planning-calendar.js planning-context-fit.js planning-pdf.js variables.js variables-monthly-planning.js; do
            node --check "$f"
          done

  diagnose-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la configuration GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -o /tmp/pages.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pages.json',encoding='utf-8'))
          print('Site public :',data.get('html_url'))
          print('Statut Pages :',data.get('status'))
          print('Source :',data.get('source'))
          if not data.get('html_url'):raise SystemExit('::error::GitHub Pages n’est pas configuré')
          PY

  smoke-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que les principales pages publiques répondent et que Réassort est publié
        shell: bash
        run: |
          set -euo pipefail
          base='https://inovtec-controle.github.io/DASHBOARD'
          for page in index.html PLANNINGS.html PLANNINGS-LEGACY.html VARIABLES.html VARIABLES-DASHBOARD.html AGENTS.html INFOCHANTIERS-V2.html KONTROL-CLOUD.html CONGES.html ORGA.html MATERIEL.html REASSORT.html inovtec-page-shell.html planning-calendar.js; do
            curl -fsSL --retry 4 --retry-delay 2 --retry-all-errors "$base/$page" -o /dev/null || { echo "::error::$page inaccessible sur le site public";exit 1; }
          done
          for attempt in $(seq 1 12); do
            curl -fsSL --retry 2 --retry-delay 2 "$base/index.html?check=${GITHUB_SHA}" -o /tmp/inovtec-home.html
            if grep -q 'href="REASSORT.html"' /tmp/inovtec-home.html; then
              echo 'Page Réassort et lien d’accueil accessibles sur le site public.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Le lien Réassort n’est pas encore présent sur l’accueil public'
          exit 1
