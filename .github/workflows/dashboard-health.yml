name: Dashboard health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: dashboard-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers indispensables
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            dashboard-global-search.js
            inovtec-search-handoff.js
            INFOCHANTIERS.html
            ORGA.html
            DISCIPLINE.html
            PLANNINGS.html
            PLANNINGS-LEGACY.html
            planning-calendar.css
            planning-calendar.js
            planning-editor-stability.js
            planning-pdf.js
            planning-calendar-legal-loader.js
            planning-context-fit.js
            KONTROL.html
            KONTROL-CLOUD-LEGACY.html
            kontrol-cloud.js
            HEURE-SUP.html
            TEMPS.html
            SALAIRE.html
            AGENTS.html
            AGENTS-LEGACY.html
            firebase-config.js
            inovtec-common.css
            inovtec-shell.js
            inovtec-cloud-sync.js
            inovtec-referential.js
            inovtec-visual-runtime.js
            inovtec-agent-contract-hours.js
            inovtec-alphabetical-lists.js
            inovtec-firebase-indicator.css
            inovtec-firebase-indicator.js
            inovtec-page-shell.html
            inovtec-info-auth-bridge.js
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Fichier absent ou vide"
              exit 1
            fi
          done
          grep -qi '<!DOCTYPE html>' index.html
          grep -q 'Classeur agents' index.html
          grep -q 'inovtec-firebase-indicator.js' index.html
          grep -q 'inovtec-firebase-indicator.js' inovtec-page-shell.html
          grep -q 'inovtec-alphabetical-lists.js' inovtec-page-shell.html
          grep -q 'inovtec-shell.css?v=20260829-agentfull1' inovtec-page-shell.html
          grep -q 'inovtec-shell.js?v=20260829-agentfull1' inovtec-page-shell.html
          grep -q 'max-height:none' AGENTS-LEGACY.html
          grep -q 'overflow:visible' AGENTS-LEGACY.html
          grep -q 'fitAgentsFullPage' inovtec-shell.js
          grep -q '_deleted: true' AGENTS-LEGACY.html
          grep -q 'function agentHasName' AGENTS-LEGACY.html
          grep -q 'function cleanupAgentState' AGENTS-LEGACY.html
          grep -q 'nettoyage-fiche-sans-nom' AGENTS-LEGACY.html
          grep -q 'max-height:none' AGENTS-LEGACY.html
          grep -q 'overflow:visible' AGENTS-LEGACY.html
          if grep -q 'inovtec-agents-list-fit.js' AGENTS-LEGACY.html; then
            echo "::error::L'affichage actuel de la liste agents a été modifié."
            exit 1
          fi
          grep -q 'inovtec-cloud-sync.js?v=20260829-agentclean1' inovtec-page-shell.html
          grep -q 'inovtec-data-hub.js?v=20260829-agentclean1' inovtec-page-shell.html
          grep -q 'inovtec-referential.js?v=20260829-agentclean1' inovtec-page-shell.html
          grep -q 'inovtec-alphabetical-lists.js?v=20260828-alpha2' inovtec-page-shell.html
          grep -q 'AGENTS-LEGACY.html%3Fv%3D20260829-agentclean1' AGENTS.html
          if grep -q 'inovtec-agents-list-fit.js' AGENTS-LEGACY.html; then
            echo "::error::Le Classeur agents utilise encore l'affichage compact adaptatif."
            exit 1
          fi
          grep -q 'inovtec-info-auth-bridge.js?v=20260820-info-operational1' inovtec-page-shell.html
          grep -q 'inovtec-page-shell.html?build=20260828-infos-common2&amp;mode=infos' INFOCHANTIERS.html
          grep -q 'inovtec-page-shell.html?build=20260828-infos-common2&amp;mode=infos' INFOCHANTIERS-V2.html
          if grep -q 'inovtec-info-shell-stable.html' INFOCHANTIERS.html INFOCHANTIERS-V2.html; then
            echo "::error::Infos chantier utilise encore son ancien menu spécial."
            exit 1
          fi
          grep -q 'planning-editor-stability.js' PLANNINGS-LEGACY.html
          grep -q 'planning-pdf.js?v=20260815-3' PLANNINGS-LEGACY.html
          grep -q 'const START_HOUR=0,END_HOUR=24,HOUR_PX=56' planning-calendar.js
          grep -Fq 'height:calc(var(--pc-hour) * 24)' planning-calendar.css
          grep -q 'planning-calendar.js?v=' PLANNINGS-LEGACY.html
          grep -q 'id="globalSearch"' index.html
          grep -q 'dashboard-global-search.js?v=20260829-agentclean1' index.html
          grep -q 'inovtec-search-handoff.js?v=20260828-search1' inovtec-page-shell.html
          grep -q 'inovtec-page-shell.html?build=20260828-infos-common2&amp;mode=infos' inovtec-info-shell-stable.html
          if grep -q 'sera activée ultérieurement' index.html; then
            echo "::error file=index.html::Une fonctionnalité visible du dashboard est encore annoncée comme inactive."
            exit 1
          fi
          if grep -Eq 'id="globalSearch"[^>]*disabled' index.html; then
            echo "::error file=index.html::La recherche globale est de nouveau désactivée."
            exit 1
          fi

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check firebase-config.js
          node --check dashboard-index.js
          node --check dashboard-index-shared.js
          node --check dashboard-mark1.js
          node --check dashboard-global-search.js
          node --check inovtec-search-handoff.js
          node --check inovtec-shell.js
          node --check inovtec-cloud-sync.js
          node --check inovtec-data-hub.js
          node --check inovtec-shared-workspace.js
          node --check inovtec-referential.js
          node --check inovtec-cross-page-data.js
          node --check inovtec-historical-data-recovery.js
          node --check inovtec-referential.js
          node --check inovtec-visual-runtime.js
          node --check inovtec-agent-contract-hours.js
          node --check inovtec-alphabetical-lists.js
          node --check inovtec-agents-archive.js
          node --check inovtec-firebase-indicator.js
          node --check inovtec-info-auth-bridge.js
          node --check inovtec-empty-initial-selection.js
          node --check inovtec-planning-launch-selection.js
          node --check inovtec-info-agent-planning.js
          node --check kontrol-cloud.js
          node --check planning-calendar.js
          node --check planning-editor-stability.js
          node --check planning-pdf.js
          node --check planning-calendar-legal-loader.js
          node --check planning-context-fit.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          pages = [
              'index.html','INFOCHANTIERS.html','ORGA.html','DISCIPLINE.html',
              'PLANNINGS.html','PLANNINGS-LEGACY.html','KONTROL.html','KONTROL-CLOUD-LEGACY.html','HEURE-SUP.html','TEMPS.html',
              'SALAIRE.html','AGENTS.html','AGENTS-LEGACY.html','inovtec-page-shell.html'
          ]

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  attrs = dict(attrs)
                  if attrs.get('src'):
                      self.current = None
                      return
                  script_type = (attrs.get('type') or '').lower()
                  if script_type and script_type not in ('text/javascript', 'module'):
                      self.current = None
                      return
                  self.current = {'type': script_type, 'parts': []}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current['parts'].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          failed = False
          for page in pages:
              parser = ScriptParser()
              parser.feed(Path(page).read_text(encoding='utf-8'))
              for index, script in enumerate(parser.scripts, 1):
                  code = ''.join(script['parts']).strip()
                  if not code:
                      continue
                  suffix = '.mjs' if script['type'] == 'module' or '\nimport ' in '\n'+code or code.startswith('import ') else '.js'
                  with tempfile.NamedTemporaryFile('w', suffix=suffix, delete=False, encoding='utf-8') as tmp:
                      tmp.write(code)
                      path = tmp.name
                  result = subprocess.run(['node', '--check', path], text=True, capture_output=True)
                  if result.returncode:
                      print(f'::error file={page}::Erreur JavaScript dans le script inline #{index}')
                      print(result.stderr)
                      failed = True
          if failed:
              raise SystemExit(1)
          PY

  diagnose-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la configuration et le dernier build GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -o /tmp/pages.json
          curl -fsSL "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" -o /tmp/build.json
          python3 - <<'PY'
          import json
          pages=json.load(open('/tmp/pages.json', encoding='utf-8'))
          build=json.load(open('/tmp/build.json', encoding='utf-8'))
          print('html_url =', pages.get('html_url'))
          print('status =', pages.get('status'))
          print('build_type =', pages.get('build_type'))
          print('source =', pages.get('source'))
          print('latest_build_status =', build.get('status'))
          print('latest_build_commit =', build.get('commit'))
          print('latest_build_error =', build.get('error'))
          print('latest_build_message =', build.get('message'))
          PY

  smoke-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le site GitHub Pages public
        shell: bash
        run: |
          set -euo pipefail
          base='https://inovtec-controle.github.io/DASHBOARD'
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$base/" -o /tmp/index.html
          grep -q 'Classeur agents' /tmp/index.html || {
            echo '::error::Le site public répond mais ne contient pas encore la nouvelle version du dashboard.'
            exit 1
          }
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$base/inovtec-page-shell.html" -o /tmp/shell.html
          grep -q 'inovtec-alphabetical-lists.js' /tmp/shell.html || {
            echo '::error::Le site public ne contient pas encore le tri alphabétique global.'
            exit 1
          }
          for page in INFOCHANTIERS.html ORGA.html DISCIPLINE.html PLANNINGS.html KONTROL-CLOUD.html AGENTS.html HEURE-SUP.html TEMPS.html SALAIRE.html; do
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$base/$page" -o /dev/null
          done
          echo 'Site public accessible et version attendue détectée.'