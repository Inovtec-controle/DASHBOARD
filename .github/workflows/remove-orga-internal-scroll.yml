name: Remove Organisation internal scroll

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch styles
        run: |
          cat >> inovtec-visual-v2.css <<'EOF'

/* ORGANISATION NO INTERNAL SCROLL 20260817 */
html:has(body.iv-visual-v2.iv-mode-organisation),body.iv-visual-v2.iv-mode-organisation,body.iv-visual-v2.iv-mode-organisation #app{height:auto!important;min-height:100%!important;overflow:visible!important}
body.iv-visual-v2.iv-mode-organisation main.page{height:auto!important;max-height:none!important;overflow:visible!important;grid-template-columns:minmax(285px,350px) minmax(0,1fr)!important;grid-template-rows:auto auto!important;align-items:start!important}
body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(1){grid-column:1!important;grid-row:1/3!important;position:sticky!important;top:0!important;align-self:start!important}
body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(2){grid-column:2!important;grid-row:1!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;overscroll-behavior:auto!important}
body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(3){grid-column:2!important;grid-row:2!important;height:auto!important;max-height:none!important;overflow:visible!important}
@media(max-width:619px){body.iv-visual-v2.iv-mode-organisation main.page{grid-template-columns:1fr!important;grid-template-rows:auto auto auto!important}body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(1){grid-column:1!important;grid-row:1!important}body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(2){grid-column:1!important;grid-row:2!important;overflow:visible!important}body.iv-visual-v2.iv-mode-organisation main.page>section.card:nth-of-type(3){grid-column:1!important;grid-row:3!important;overflow:visible!important}}
EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inovtec-visual-runtime.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('inovtec-visual-v2.css?v=20260817-orga-final','inovtec-visual-v2.css?v=20260817-orga-noscroll')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'ORGANISATION NO INTERNAL SCROLL 20260817' inovtec-visual-v2.css
          grep -Fq '20260817-orga-noscroll' inovtec-visual-runtime.js
      - name: Commit
        run: |
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          rm .github/workflows/remove-orga-internal-scroll.yml
          git add inovtec-visual-v2.css inovtec-visual-runtime.js .github/workflows/remove-orga-internal-scroll.yml
          git commit -m 'Supprime le défilement interne Organisation'
          git push
