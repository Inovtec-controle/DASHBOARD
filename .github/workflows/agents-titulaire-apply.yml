name: Integrate agent titular status and replacements

on:
  push:
    paths:
      - .github/workflows/agents-titulaire-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert the role controls and refresh the agents route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AGENTS-LEGACY.html')
          text=p.read_text(encoding='utf-8')
          script='<script src="inovtec-agents-titulaire.js?v=20260919-titulaire1"></script>\n'
          if script not in text:
              assert '</body>' in text, 'AGENTS-LEGACY.html lacks body end'
              text=text.replace('</body>',script+'</body>',1)
              p.write_text(text,encoding='utf-8')
          p=Path('AGENTS.html')
          text=p.read_text(encoding='utf-8')
          assert '20260914-incidentpdf1' in text or '20260919-titulaire1' in text, 'Agents route version changed unexpectedly'
          text=text.replace('20260914-incidentpdf1','20260919-titulaire1')
          p.write_text(text,encoding='utf-8')
          print('OK: agent form and route refresh integrated')
          PY
          node --check inovtec-agents-titulaire.js
          node --check tests/agents-titulaire.mjs
      - name: Test titular checkbox and replacement in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inovtec-agent-titulaire.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/AGENTS-LEGACY.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/agents-titulaire.mjs
          node tests/agent-team-context.mjs
      - name: Publish tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec agent roles integration'
          git config user.email 'actions@users.noreply.github.com'
          git add AGENTS-LEGACY.html AGENTS.html
          if git diff --cached --quiet; then
            echo 'Already integrated'
            exit 0
          fi
          git commit -m 'feat(agents): show titular status and link replacement to canonical agent'
          git push origin HEAD:main
