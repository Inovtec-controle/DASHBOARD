name: Fix Organisation fixed pane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-organisation-fixed-pane.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Organisation layout fix
        run: python3 .github/fix-organisation-fixed-pane.py

      - name: Verify fix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ORGANISATION FIXED FORM + INDEPENDENT BOARD SCROLL' inovtec-visual-v2.css
          grep -Fq 'overflow:hidden!important;' inovtec-visual-v2.css
          grep -Fq 'main.page>section.card:nth-of-type(2)' inovtec-visual-v2.css
          grep -Fq 'overflow:auto!important;' inovtec-visual-v2.css

      - name: Publish and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          rm .github/fix-organisation-fixed-pane.py
          rm .github/workflows/fix-organisation-fixed-pane.yml
          git add inovtec-visual-v2.css .github/fix-organisation-fixed-pane.py .github/workflows/fix-organisation-fixed-pane.yml
          git commit -m 'Fixe Nouvelle tâche et sépare le défilement du tableau'
          git push
