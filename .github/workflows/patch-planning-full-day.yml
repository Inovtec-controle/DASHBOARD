name: Patch planning 24h

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-planning-full-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Étendre le planning de 00h00 à 24h00
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Motif introuvable dans {path}: {old}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text, encoding='utf-8')

          replace('planning-calendar.js',
                  'const START_HOUR=6,END_HOUR=22,HOUR_PX=56;',
                  'const START_HOUR=0,END_HOUR=24,HOUR_PX=56;')

          replace('planning-calendar.css',
                  'height:calc(var(--pc-hour) * 16)',
                  'height:calc(var(--pc-hour) * 24)')

          replace('PLANNINGS-LEGACY.html',
                  'planning-calendar.css?v=20260814-2',
                  'planning-calendar.css?v=20260815-3')
          replace('PLANNINGS-LEGACY.html',
                  'planning-calendar.js?v=20260814-6',
                  'planning-calendar.js?v=20260815-7')

          replace('PLANNINGS.html',
                  'PLANNINGS-LEGACY.html%3Fv%3D20260815-hub15',
                  'PLANNINGS-LEGACY.html%3Fv%3D20260815-hub16')
          PY

      - name: Vérifier les modifications
        shell: bash
        run: |
          set -euo pipefail
          node --check planning-calendar.js
          grep -q 'const START_HOUR=0,END_HOUR=24,HOUR_PX=56' planning-calendar.js
          grep -Fq 'height:calc(var(--pc-hour) * 24)' planning-calendar.css
          grep -q 'planning-calendar.js?v=20260815-7' PLANNINGS-LEGACY.html
          grep -q 'PLANNINGS-LEGACY.html%3Fv%3D20260815-hub16' PLANNINGS.html

      - name: Publier le correctif
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          git add planning-calendar.js planning-calendar.css PLANNINGS-LEGACY.html PLANNINGS.html
          git diff --cached --quiet && exit 0
          git commit -m 'Affiche le planning agent de minuit à minuit'
          git push origin HEAD:main
