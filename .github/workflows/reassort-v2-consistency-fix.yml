name: Reassort V2 consistency fix
on:
  push:
    paths:
      - '.github/workflows/reassort-v2-consistency-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix targeted defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inovtec-reassort-workflow.js')
          s=p.read_text()
          changes=[
            (".flatMap(p=>p.lines||[]).filter(l=>l.orderId===o.id).reduce((s,l)=>s+n(l.quantity),0)", ".flatMap(p=>(p.lines||[]).flatMap(l=>l.allocations||[])).filter(a=>a.orderId===o.id).reduce((s,a)=>s+n(a.quantity),0)"),
            (".filter(x=>x.id!==id&&x.workflow==='chantier'&&x.preparationSource==='stock')", ".filter(x=>x.id!==id&&x.workflow==='chantier'&&x.materialId===target.materialId&&x.preparationSource==='stock')"),
            ("esc(l.sites||'')", "esc((l.allocations||[]).map(a=>a.site).filter(Boolean).join(', '))"),
          ]
          for old,new in changes:
            count=s.count(old)
            if not count: raise SystemExit('Missing targeted code: '+old)
            s=s.replace(old,new)
            print('Patched',count,'occurrence(s):',old[:65])
          p.write_text(s)
          h=Path('REASSORT.html'); html=h.read_text(); old='id="singleRequest" hidden'
          if html.count(old)!=1: raise SystemExit('Classic form marker unexpected')
          h.write_text(html.replace(old,'id="singleRequest"',1))
          print('Classic single-item request form available below multi-item entry')
          PY
          node --check inovtec-reassort-workflow.js
          node --check inovtec-reassort-chantier.js
          git config user.name 'Inovtec workflow'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add REASSORT.html inovtec-reassort-workflow.js
          git commit -m 'fix(reassort): deduplicate purchases and preserve legacy request entry'
          git push origin HEAD:main