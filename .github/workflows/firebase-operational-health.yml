name: Firebase operational health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-firebase-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers et la syntaxe Firebase
        shell: bash
        run: |
          set -euo pipefail
          files=(firebase-config.js firestore.rules storage.rules inovtec-firebase-operational-guard.js inovtec-cloud-sync.js inovtec-cloud-sync-v2.js inovtec-common-header.js inovtec-data-hub.js inovtec-shared-workspace.js inovtec-cross-page-data.js conges.js variables.js ORGA-LEGACY.html INFOCHANTIERS-V2-LEGACY.html inovtec-info-persistence-stable.js inovtec-info-control-history.js inovtec-site-management-layout.js inovtec-container-schedule.js discipline-firestore-bridge.js kontrol-cloud.js inovtec-kontrol-shared-archive.js AGENTS-LEGACY.html PLANNINGS.html AGENTS.html CONGES.html VARIABLES.html ORGA.html INFOCHANTIERS-V2.html KONTROL-CLOUD.html)
          for f in "${files[@]}"; do
            test -s "$f" || { echo "::error file=$f::Fichier Firebase absent ou vide"; exit 1; }
          done
          for f in firebase-config.js inovtec-firebase-operational-guard.js inovtec-cloud-sync.js inovtec-cloud-sync-v2.js inovtec-common-header.js inovtec-data-hub.js inovtec-shared-workspace.js inovtec-cross-page-data.js inovtec-info-persistence-stable.js inovtec-info-control-history.js inovtec-info-agent-planning.js inovtec-site-management-layout.js inovtec-container-schedule.js conges.js variables.js discipline-firestore-bridge.js kontrol-cloud.js inovtec-kontrol-shared-archive.js dashboard-index.js inovtec-contract-reminders.js; do
            node --check "$f"
          done

      - name: Vérifier les chemins et les liaisons de synchronisation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'firebase-config.js':['projectId: "inovtec-chantiers"','inovtec-firebase-operational-guard.js?v='],
            'inovtec-page-shell.html':['firebase-config.js?v=','inovtec-cloud-sync.js?v=','inovtec-data-hub.js?v='],
            'inovtec-cloud-sync.js':['inovtec-cloud-sync-v2.js?v=','script.async=false'],
            'inovtec-cloud-sync-v2.js':["planning:'inovtec_plannings_v2'","agents:'kontrol_agents_classeur_v2'","heures:'HSUPP_DUR_APP_V1'",'onSnapshot','_deleted'],
            'inovtec-common-header.js':['evaluateSyncMark','frameDisplayReady','localSyncState','Firebase synchronisé · affichage de la page vérifié'],
            'inovtec-data-hub.js':['collection("kanban").doc(user.uid)','collection("chantiers").orderBy("nom").onSnapshot','_deleted:true'],
            'inovtec-firebase-operational-guard.js':['const VARIABLE_MODE="variables"','agentBinaryChunk','ivBinaryV1','__inovtec_shared_workspace_v1__'],
            'conges.js':['moduleSyncV1:{conges:'],
            'variables.js':['moduleSyncV1:{variables:'],
            'ORGA-LEGACY.html':['db.collection("kanban").doc(currentUser.uid)'],
            'inovtec-info-persistence-stable.js':['const ref=db.collection("chantiers").doc(String(site.id))','await ref.set(data,{merge:true})','await ref.get({source:"server"})','persist(d,wasNew,token,snapshot)'],
            'INFOCHANTIERS-V2-LEGACY.html':['collectSupplementalFields(data)','applySupplementalFields(site)','setSaveButtonState("saving")','setSaveButtonState("saved")','setSaveButtonState("error")','ivControlHistoryCard'],
            'inovtec-info-control-history.js':['chantierId','deleteControlRecord','readControlPhoto'],
            'inovtec-shared-workspace.js':['__inovtec_shared_discipline_v1__'],
            'kontrol-cloud.js':['kontrol/${user.uid}/pdfs','writeSharedHistory(blob','resolveChantierId(details)','kontrolHistoryRecordIds'],
            'inovtec-kontrol-shared-archive.js':['kontrolPdfMeta'],
            'firestore.rules':['match /kanban/{userId}','match /chantiers/{chantierId}'],
            'storage.rules':['match /kontrol/{userId}/pdfs/{fileName}'],
          }
          errors=[]
          for file,markers in checks.items():
            content=Path(file).read_text(encoding='utf-8')
            for marker in markers:
              if marker not in content:errors.append(f'{file} : branchement attendu absent ({marker})')
          if 'setTimeout(()=>persist(d,wasNew,token),80)' in Path('inovtec-info-persistence-stable.js').read_text():
            errors.append('Infos chantier : ancienne sauvegarde différée réintroduite')
          for issue in errors:print('::error::'+issue)
          print(f'Contrat Firebase : {len(checks)} fichiers contrôlés, {len(errors)} anomalie(s)')
          if errors:raise SystemExit(1)
          PY

      - name: Vérifier la navigation des modules synchronisés
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks={'CONGES.html':'mode=conges','VARIABLES.html':'mode=variables','PLANNINGS.html':'mode=planning','ORGA.html':'mode=organisation','AGENTS.html':'mode=agents','INFOCHANTIERS-V2.html':'mode=infos','KONTROL-CLOUD.html':'mode=kontrol'}
          errors=[]
          for page,token in checks.items():
            if token not in Path(page).read_text(encoding='utf-8'):
              errors.append(f'{page} : navigation sans {token}')
          for issue in errors:print('::error::'+issue)
          print(f'Navigation Firebase : {len(checks)} modules contrôlés')
          if errors:raise SystemExit(1)
          PY
