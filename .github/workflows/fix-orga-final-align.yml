name: Fix Organisation final alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-orga-final-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final Organisation alignment
        run: python3 .github/fix-orga-final-align.py

      - name: Verify final alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/* ORGANISATION FINAL ALIGNMENT 20260817 */' inovtec-visual-v2.css
          grep -Fq 'position:sticky!important;' inovtec-visual-v2.css
          grep -Fq 'top:0!important;' inovtec-visual-v2.css
          grep -Fq 'grid-template-columns:minmax(285px,350px) minmax(0,1fr)!important;' inovtec-visual-v2.css
          grep -Fq 'overflow-y:auto!important;' inovtec-visual-v2.css
          grep -Fq 'inovtec-visual-v2.css?v=20260817-orga-final' inovtec-visual-runtime.js
          grep -Fq 'inovtec-common.css?v=20260817-orga-final' ORGA-LEGACY.html
          ! grep -Fq 'position:sticky;top:82px;z-index:30;padding:12px;' inovtec-common.css

      - name: Publish and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec Bot'
          git config user.email 'inovtec-bot@users.noreply.github.com'
          rm .github/fix-orga-final-align.py .github/workflows/fix-orga-final-align.yml
          git add inovtec-common.css inovtec-visual-v2.css inovtec-visual-runtime.js ORGA-LEGACY.html .github/fix-orga-final-align.py .github/workflows/fix-orga-final-align.yml
          git commit -m 'Aligne et fixe Nouvelle tâche avec le tableau'
          git push
