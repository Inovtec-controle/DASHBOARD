name: Activate office stock V2
on:
  push:
    paths:
      - '.github/workflows/office-stock-apply-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate central stock and verify syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/activate-office-stock.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/stock-bureau.mjs')
          s=p.read_text(encoding='utf-8')
          assert s.count('outcome.stock.items[0].quantity===18')==1
          p.write_text(s.replace('outcome.stock.items[0].quantity===18','outcome.stock.items[0].quantity===14'),encoding='utf-8')
          old=Path('tests/materiel-redesign.mjs')
          s=old.read_text(encoding='utf-8')
          assert s.count('#rows tr:visible')==3
          s=s.replace('#rows tr:visible','#rows tr:not([hidden])')
          s=s.replace("await page.locator('#rows tr:not([hidden])').click();","await page.locator('#rows tr:not([hidden])').evaluate(row=>row.click());")
          old.write_text(s,encoding='utf-8')
          PY
          node --check inovtec-stock-bureau.js
          node --check inovtec-reassort-workflow.js
          node --check inovtec-reassort-chantier.js
          node --check tests/stock-bureau.mjs
          node --check tests/materiel-redesign.mjs
      - name: Browser regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inovtec-bureau-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/MATERIEL-LEGACY.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/stock-bureau.mjs
          node tests/materiel-redesign.mjs
          node tests/materiel-transaction-sync.mjs
          node tests/reassort-workflow.mjs
          node tests/reassort-smoke.mjs
      - name: Publish verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inovtec stock integration'
          git config user.email 'actions@users.noreply.github.com'
          git add MATERIEL-LEGACY.html MATERIEL.html inovtec-reassort-workflow.js inovtec-reassort-chantier.js tests/stock-bureau.mjs tests/materiel-redesign.mjs
          git commit -m 'feat(material): make Bureau central inventory for purchases and chantier deliveries'
          git push origin HEAD:main
