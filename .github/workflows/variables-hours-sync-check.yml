name: Variables hours cross-device sync check
on:
  push:
    branches: [main]
    paths:
      - 'variables.js'
      - 'tests/variables-hours-transaction-sync.mjs'
      - '.github/workflows/variables-hours-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-device:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Installer Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Tester conflits, ajouts, suppressions et connexion
        run: |
          set -euo pipefail
          node --check variables.js
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/variables-hours-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/VARIABLES-LEGACY.html -o /dev/null; then break; fi
            sleep 1
          done
          echo 'Contrôle des heures Variables et des absences Congés avec deux sessions Firebase simulées'
          node tests/variables-hours-transaction-sync.mjs
          node tests/variables-leave-transaction-sync.mjs
