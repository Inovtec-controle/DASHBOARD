name: Pages build history diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher les derniers builds Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds?per_page=20" \
            -o /tmp/builds.json
          python3 - <<'PY'
          import json
          builds=json.load(open('/tmp/builds.json', encoding='utf-8'))
          for b in builds:
              print('---')
              print('status =', b.get('status'))
              print('commit =', b.get('commit'))
              print('created_at =', b.get('created_at'))
              print('updated_at =', b.get('updated_at'))
              print('error =', b.get('error'))
          PY
