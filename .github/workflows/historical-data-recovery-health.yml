name: Historical data recovery health

on:
  pull_request:
    paths:
      - 'inovtec-historical-data-recovery.js'
      - 'dashboard-mark1.js'
      - '.github/workflows/historical-data-recovery-health.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie la syntaxe JavaScript
        run: |
          node --check inovtec-historical-data-recovery.js
          node --check dashboard-mark1.js
      - name: Vérifie les sources historiques protégées
        run: |
          grep -q 'inovtec_plannings_v2' inovtec-historical-data-recovery.js
          grep -q 'kontrol_agents_classeur_v2' inovtec-historical-data-recovery.js
          grep -q 'HSUPP_DUR_APP_V1' inovtec-historical-data-recovery.js
          grep -q 'inovtec_absences_v1' inovtec-historical-data-recovery.js
          grep -q 'orga_task_board_v2' inovtec-historical-data-recovery.js
          grep -q 'inovtec_discipline_cache_v9_' inovtec-historical-data-recovery.js
          grep -q '__inovtec_shared_workspace_v1__' inovtec-historical-data-recovery.js
          grep -q '__inovtec_shared_discipline_v1__' inovtec-historical-data-recovery.js
      - name: Vérifie le branchement MARK 1
        run: |
          grep -q 'inovtec-historical-data-recovery.js' dashboard-mark1.js
          grep -q 'historical-data-recovered' dashboard-mark1.js
