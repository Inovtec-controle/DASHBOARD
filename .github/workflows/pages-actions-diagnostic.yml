name: Pages Actions diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Rechercher les workflows des builds en échec
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for sha in c033103222c65061eb28eed159baf258236aea32 569acc9b23902fe74716ad0fd9d3a1026cf0d1f3; do
            echo "=== $sha ==="
            curl -fsSL "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$sha&per_page=100" -o /tmp/runs.json
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json', encoding='utf-8'))
          for r in data.get('workflow_runs', []):
              print('id =', r.get('id'))
              print('name =', r.get('name'))
              print('event =', r.get('event'))
              print('status =', r.get('status'))
              print('conclusion =', r.get('conclusion'))
              print('html_url =', r.get('html_url'))
              print('---')
          PY
          done
