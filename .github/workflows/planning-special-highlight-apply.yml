name: Publish planning travel and break selection highlight
on:
  push:
    paths:
      - '.github/workflows/planning-special-highlight-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh planner asset versions
        run: |
          set -euo pipefail
          python3 scripts/apply-planning-special-highlight.py
          node --check planning-travel-pause.js
          node --check planning-calendar.js
          node --check tests/planning-special-selection.mjs
      - name: Browser selection and existing planning tests
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inovtec-planning-highlight.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/PLANNINGS-LEGACY.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/planning-special-selection.mjs
          node tests/planning-fixture.mjs
      - name: Publish tested planner pages
        run: |
          set -euo pipefail
          git config user.name 'Inovtec planning UI integration'
          git config user.email 'actions@users.noreply.github.com'
          git add PLANNINGS-LEGACY.html PLANNINGS.html
          git commit -m 'fix(planning): show and preserve selected travel and break chips'
          git push origin HEAD:main
