<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Calcul Salaire Net</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Inter',sans-serif;
}

body{
  background:#f1f5f9;
  color:#0f172a;
  display:flex;
  justify-content:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:420px;
}

.header{
  background:#16a34a;
  color:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

.header h1{
  font-size:20px;
  font-weight:600;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.label{
  font-size:13px;
  color:#64748b;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px;
  margin-bottom:15px;
}

.result{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

.result-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.result-line span{
  font-size:15px;
}

.result-line strong{
  font-size:16px;
}

.footer{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>💰 Calcul Salaire Net</h1>
  </div>

  <div class="card">
    <div class="label">Taux horaire BRUT (€)</div>
    <input type="number" id="taux" placeholder="Ex : 11.65">

    <div class="label">Heures par semaine</div>
    <input type="number" id="heures" placeholder="Ex : 30">

    <div class="label">Taux NET (%)</div>
    <input type="number" id="ratio" value="78">
  </div>

  <div class="card result">
    <div class="result-line">
      <span>Brut mensuel</span>
      <strong id="brut">0 €</strong>
    </div>

    <div class="result-line">
      <span>Net estimé</span>
      <strong id="net">0 €</strong>
    </div>
  </div>

  <div class="footer">
    Estimation basée sur 4.33 semaines/mois
  </div>

</div>

<script>
const tauxInput = document.getElementById("taux");
const heuresInput = document.getElementById("heures");
const ratioInput = document.getElementById("ratio");

const brutEl = document.getElementById("brut");
const netEl = document.getElementById("net");

function calculer(){
  const taux = parseFloat(tauxInput.value) || 0;
  const heures = parseFloat(heuresInput.value) || 0;
  const ratio = parseFloat(ratioInput.value) || 0;

  const brut = taux * heures * 4.33;
  const net = brut * (ratio / 100);

  brutEl.textContent = brut.toFixed(2) + " €";
  netEl.textContent = net.toFixed(2) + " €";
}

tauxInput.addEventListener("input", calculer);
heuresInput.addEventListener("input", calculer);
ratioInput.addEventListener("input", calculer);
</script>

</body>
</html>
