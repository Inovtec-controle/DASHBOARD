<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB KONTROL • Encadrant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --green:#16a34a;
  --green-soft:#dcfce7;
  --danger:#ef4444;
  --bg:#eef2f7;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#eef2f7 0%,#e5e7eb 100%);
  color:var(--text);
}

.app{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h1{
  font-size:22px;
  font-weight:800;
}

.badge{
  background:var(--green-soft);
  color:var(--green);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 15px 35px rgba(0,0,0,0.08);
  margin-bottom:16px;
}

.label{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
}

.input,select{
  width:100%;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  margin-bottom:10px;
  font-size:14px;
}

button{
  padding:12px 14px;
  border:none;
  border-radius:14px;
  background:var(--green);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.delete{background:var(--danger)}

.row{display:flex;gap:10px}

.item{
  padding:12px;
  border-bottom:1px solid #f1f5f9;
  display:flex;
  justify-content:space-between;
}

.planning-block{
  background:#f9fafb;
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  border:1px solid #e5e7eb;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#e5e7eb;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

.active{background:var(--green);color:white}
.hidden{display:none}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:20px 0;
}

/* POPUP LIVE */
.livePopup{
 position:fixed;
 top:0;left:0;right:0;bottom:0;
 background:rgba(0,0,0,0.4);
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:999;
}

.liveBox{
 background:white;
 padding:20px;
 border-radius:20px;
 width:90%;
 max-width:400px;
 max-height:80vh;
 overflow:auto;
}

.liveTitle{
 font-weight:800;
 margin-bottom:10px;
}

.liveItem{
 padding:10px;
 border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <h1>HUB Encadrant</h1>
  <div class="badge" onclick="showLive()">LIVE</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('planning')">Planning</div>
  <div class="tab" onclick="showTab('agents')">Agents</div>
  <div class="tab" onclick="showTab('chantiers')">Chantiers</div>
  <div class="tab" onclick="showTab('suivi')">Suivi</div>
</div>

<!-- CONTENU IDENTIQUE (inchangé) -->
<div id="planning" class="card">
  <div class="label">Agent</div>
  <select id="selectAgent"></select>

  <div class="label">Jour</div>
  <select id="jour">
    <option>lundi</option><option>mardi</option><option>mercredi</option>
    <option>jeudi</option><option>vendredi</option><option>samedi</option><option>dimanche</option>
  </select>

  <div id="zones"></div>

  <button onclick="addZone()">➕ Ajouter passage</button>
  <br><br>
  <button onclick="saveMultiPlanning()">💾 Enregistrer</button>

  <hr>
  <div id="planningList"></div>
</div>

<div id="agents" class="card hidden">
  <input id="agentNom" class="input" placeholder="Nom agent">
  <input id="agentTel" class="input" placeholder="Téléphone">
  <button onclick="addAgent()">Ajouter</button>
  <div id="agentsList"></div>
</div>

<div id="chantiers" class="card hidden">
  <input id="chantierNom" class="input" placeholder="Nom chantier">
  <input id="chantierAdresse" class="input" placeholder="Adresse">
  <input id="chantierLat" class="input" placeholder="Latitude">
  <input id="chantierLon" class="input" placeholder="Longitude">
  <button onclick="addChantier()">Ajouter</button>
  <div id="chantiersList"></div>
</div>

<div id="suivi" class="card hidden">
  <div id="suiviList"></div>
</div>

</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
 authDomain:"inovtec-chantiers.firebaseapp.com",
 projectId:"inovtec-chantiers"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function showTab(id){
 document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 event.target.classList.add('active');
}

function val(id){return document.getElementById(id).value}

let agentsMap={}, chantiersMap={};

async function loadAgents(){
 const snap=await db.collection('agents').get();
 agentsMap={};
 let options="",html="";
 snap.forEach(d=>{
  const a=d.data();
  agentsMap[d.id]=a;
  html+=`<div class="item">${a.nom}</div>`;
  options+=`<option value="${d.id}">${a.nom}</option>`;
 });
 document.getElementById('agentsList').innerHTML=html;
 document.getElementById('selectAgent').innerHTML=options;
}

async function loadChantiers(){
 const snap=await db.collection('chantiers').get();
 chantiersMap={};
 let options="";
 snap.forEach(d=>{
  const c=d.data();
  chantiersMap[d.id]=c;
  options+=`<option value="${d.id}">${c.nom}</option>`;
 });
 document.querySelectorAll('.chantierSelect').forEach(s=>s.innerHTML=options);
}

function addZone(){
 const div=document.createElement('div');
 div.className='planning-block';
 div.innerHTML=`
  <select class="chantierSelect"></select>
  <div class="row">
   <input type="time" class="debut">
   <input type="time" class="fin">
  </div>
 `;
 document.getElementById('zones').appendChild(div);
 loadChantiers();
}

async function saveMultiPlanning(){
 const agentId=val('selectAgent');
 const jour=val('jour');
 const zones=document.querySelectorAll('.planning-block');

 for(let z of zones){
  await db.collection('planning').add({
    agentId,
    chantierId:z.querySelector('.chantierSelect').value,
    jour,
    debut:z.querySelector('.debut').value,
    fin:z.querySelector('.fin').value
  });
 }
 alert("Planning enregistré");
}

/* 🔥 FONCTION LIVE */
async function showLive(){

 const jours=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
 const now=new Date();
 const jourActuel=jours[now.getDay()];
 const heureActuelle=now.toTimeString().slice(0,5);

 const snap=await db.collection('planning').get();

 let html=`<div class="liveTitle">🟢 Agents en cours (${heureActuelle})</div>`;
 let count=0;

 snap.forEach(d=>{
  const p=d.data();

  if(p.jour===jourActuel && p.debut<=heureActuelle && p.fin>=heureActuelle){
    const agent=agentsMap[p.agentId]?.nom || "?";
    const chantier=chantiersMap[p.chantierId]?.nom || "?";

    html+=`<div class="liveItem">
      <strong>${agent}</strong><br>
      ${chantier}<br>
      ${p.debut} → ${p.fin}
    </div>`;
    count++;
  }
 });

 if(count===0){
  html+=`<div class="liveItem">Aucun agent en cours</div>`;
 }

 html+=`<br><button onclick="closeLive()">Fermer</button>`;

 const div=document.createElement('div');
 div.className='livePopup';
 div.id='livePopup';
 div.innerHTML=`<div class="liveBox">${html}</div>`;
 document.body.appendChild(div);
}

function closeLive(){
 document.getElementById('livePopup').remove();
}

async function init(){
 await loadAgents();
 await loadChantiers();
}
init();
</script>

</body>
</html>
