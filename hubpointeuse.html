<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB KONTROL • Encadrant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --green:#16a34a;
  --green-soft:#dcfce7;
  --danger:#ef4444;
  --bg:#eef2f7;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#eef2f7 0%,#e5e7eb 100%);
  color:var(--text);
}

.app{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h1{
  font-size:22px;
  font-weight:800;
}

.badge{
  background:var(--green-soft);
  color:var(--green);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 15px 35px rgba(0,0,0,0.08);
  margin-bottom:16px;
}

.label{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
}

.input,select{
  width:100%;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  margin-bottom:10px;
  font-size:14px;
}

button{
  padding:12px 14px;
  border:none;
  border-radius:14px;
  background:var(--green);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.delete{
  background:var(--danger);
}

.row{
  display:flex;
  gap:10px;
}

.item{
  padding:12px;
  border-bottom:1px solid #f1f5f9;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}

.planning-block{
  background:#f9fafb;
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  border:1px solid #e5e7eb;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#e5e7eb;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

.active{
  background:var(--green);
  color:white;
}

.hidden{display:none}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:20px 0;
}
</style>
</head>
<body>

<div class="app">

<div class="header">
  <h1>HUB Encadrant</h1>
  <div class="badge">LIVE</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('planning')">Planning</div>
  <div class="tab" onclick="showTab('agents')">Agents</div>
  <div class="tab" onclick="showTab('chantiers')">Chantiers</div>
  <div class="tab" onclick="showTab('suivi')">Suivi</div>
</div>

<!-- PLANNING -->
<div id="planning" class="card">
  <div class="label">Agent</div>
  <select id="selectAgent"></select>

  <div class="label">Jour</div>
  <select id="jour">
    <option>lundi</option><option>mardi</option><option>mercredi</option>
    <option>jeudi</option><option>vendredi</option><option>samedi</option><option>dimanche</option>
  </select>

  <div id="zones"></div>

  <button onclick="addZone()">➕ Ajouter passage</button>
  <br><br>
  <button onclick="saveMultiPlanning()">💾 Enregistrer</button>

  <hr>
  <div id="planningList"></div>
</div>

<!-- AGENTS -->
<div id="agents" class="card hidden">
  <input id="agentNom" class="input" placeholder="Nom agent">
  <input id="agentTel" class="input" placeholder="Téléphone">
  <button onclick="addAgent()">Ajouter</button>
  <div id="agentsList"></div>
</div>

<!-- CHANTIERS -->
<div id="chantiers" class="card hidden">
  <input id="chantierNom" class="input" placeholder="Nom chantier">
  <input id="chantierAdresse" class="input" placeholder="Adresse">
  <input id="chantierLat" class="input" placeholder="Latitude">
  <input id="chantierLon" class="input" placeholder="Longitude">
  <button onclick="addChantier()">Ajouter</button>
  <div id="chantiersList"></div>
</div>

<!-- SUIVI -->
<div id="suivi" class="card hidden">
  <div id="suiviList"></div>
</div>

</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
 authDomain:"inovtec-chantiers.firebaseapp.com",
 projectId:"inovtec-chantiers"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function showTab(id){
 document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 event.target.classList.add('active');
}

function val(id){return document.getElementById(id).value}

let agentsMap={}, chantiersMap={};

async function addAgent(){
 await db.collection('agents').add({nom:val('agentNom'),tel:val('agentTel')});
 loadAgents();
}

async function deleteAgent(id){await db.collection('agents').doc(id).delete();loadAgents()}

async function loadAgents(){
 const snap=await db.collection('agents').get();
 let html="",options="";
 agentsMap={};
 snap.forEach(d=>{
  const a=d.data();
  agentsMap[d.id]=a;
  html+=`<div class="item">${a.nom}<button class="delete" onclick="deleteAgent('${d.id}')">Supprimer</button></div>`;
  options+=`<option value="${d.id}">${a.nom}</option>`;
 });
 document.getElementById('agentsList').innerHTML=html;
 document.getElementById('selectAgent').innerHTML=options;
}

async function addChantier(){
 await db.collection('chantiers').add({nom:val('chantierNom'),adresse:val('chantierAdresse'),lat:parseFloat(val('chantierLat')),lon:parseFloat(val('chantierLon'))});
 loadChantiers();
}

async function deleteChantier(id){await db.collection('chantiers').doc(id).delete();loadChantiers()}

async function loadChantiers(){
 const snap=await db.collection('chantiers').get();
 let html="",options="";
 chantiersMap={};
 snap.forEach(d=>{
  const c=d.data();
  chantiersMap[d.id]=c;
  html+=`<div class="item">${c.nom}<button class="delete" onclick="deleteChantier('${d.id}')">Supprimer</button></div>`;
  options+=`<option value="${d.id}">${c.nom}</option>`;
 });
 document.getElementById('chantiersList').innerHTML=html;
 document.querySelectorAll('.chantierSelect').forEach(s=>s.innerHTML=options);
}

function addZone(){
 const div=document.createElement('div');
 div.className='planning-block';
 div.innerHTML=`
  <select class="chantierSelect"></select>
  <div class="row">
   <input type="time" class="debut">
   <input type="time" class="fin">
  </div>
  <button class="delete" onclick="this.parentElement.remove()">Supprimer passage</button>
 `;
 document.getElementById('zones').appendChild(div);
 loadChantiers();
}

async function saveMultiPlanning(){
 const agentId=val('selectAgent');
 const jour=val('jour');
 const zones=document.querySelectorAll('.planning-block');

 for(let z of zones){
  const chantierId=z.querySelector('.chantierSelect').value;
  await db.collection('planning').add({agentId,chantierId,jour,debut:z.querySelector('.debut').value,fin:z.querySelector('.fin').value});
 }
 loadPlanning();
 alert("Planning enregistré");
}

async function deletePlanning(id){
 await db.collection('planning').doc(id).delete();
 loadPlanning();
}

async function loadPlanning(){
 const snap=await db.collection('planning').get();
 let html="";
 snap.forEach(d=>{
  const p=d.data();
  const agent=agentsMap[p.agentId]?.nom || "?";
  const chantier=chantiersMap[p.chantierId]?.nom || "?";
  html+=`<div class="item">${agent} • ${chantier} (${p.jour} ${p.debut}-${p.fin})<button class="delete" onclick="deletePlanning('${d.id}')">Supprimer</button></div>`;
 });
 document.getElementById('planningList').innerHTML=html;
}

async function loadSuivi(){
 const snap=await db.collection('suiviAgents').get();
 let html="";
 snap.forEach(d=>{
  const s=d.data();
  html+=`<div class="item">${s.agent} • ${s.chantier} → ${s.statut}</div>`;
 });
 document.getElementById('suiviList').innerHTML=html;
}

async function init(){
 await loadAgents();
 await loadChantiers();
 await loadPlanning();
 await loadSuivi();
}
init();
</script>

</body>
</html>
