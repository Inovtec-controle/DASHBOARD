<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB Encadrant • Planning</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --green:#16a34a;
  --bg:#eef2f7;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#eef2f7 0%,#e5e7eb 100%);
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.title{
  font-size:22px;
  font-weight:800;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-bottom:16px;
}

.label{
  font-size:12px;
  font-weight:600;
  color:#64748b;
  margin-bottom:6px;
}

.input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #e5e7eb;
  margin-bottom:12px;
}

.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#16a34a;
  color:white;
  font-weight:700;
}

.list{
  margin-top:10px;
}

.item{
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:14px;
}
</style>
</head>
<body>

<div class="app">
  <div class="title">HUB Encadrant</div>

  <div class="card">
    <div class="label">Agent</div>
    <input id="agent" class="input" placeholder="Nom agent">

    <div class="label">Chantier</div>
    <input id="chantier" class="input" placeholder="Nom chantier">

    <div class="label">Latitude</div>
    <input id="lat" class="input" placeholder="43.6">

    <div class="label">Longitude</div>
    <input id="lon" class="input" placeholder="1.44">

    <div class="label">Jour</div>
    <input id="jour" class="input" placeholder="lundi">

    <div class="label">Heure début</div>
    <input id="debut" class="input" placeholder="12:00">

    <div class="label">Heure fin</div>
    <input id="fin" class="input" placeholder="13:00">

    <button class="btn" onclick="savePlanning()">Enregistrer planning</button>
  </div>

  <div class="card">
    <div class="label">Planning enregistré</div>
    <div id="list" class="list"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
  authDomain: "inovtec-chantiers.firebaseapp.com",
  projectId: "inovtec-chantiers",
  storageBucket: "inovtec-chantiers.firebasestorage.app",
  messagingSenderId: "313162345276",
  appId: "1:313162345276:web:1a270f797dd736a4060c39"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function savePlanning(){
  await db.collection("planning").add({
    agent: val("agent"),
    chantier: val("chantier"),
    lat: parseFloat(val("lat")),
    lon: parseFloat(val("lon")),
    jour: val("jour"),
    debut: val("debut"),
    fin: val("fin")
  });

  loadPlanning();
  alert("Planning enregistré ✅");
}

function val(id){
  return document.getElementById(id).value;
}

async function loadPlanning(){
  const snap = await db.collection("planning").get();
  const list = document.getElementById("list");
  list.innerHTML = "";

  snap.forEach(doc=>{
    const p = doc.data();
    list.innerHTML += `
      <div class="item">
        <b>${p.agent}</b> • ${p.chantier}<br>
        ${p.jour} ${p.debut} → ${p.fin}
      </div>
    `;
  });
}

loadPlanning();
</script>

</body>
</html>
