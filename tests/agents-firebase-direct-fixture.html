<!doctype html><html><head><meta charset="utf-8"></head><body>
<span id="syncMirror"></span><iframe id="legacyFrame"></iframe>
<script>
(()=>{
 const clone=v=>JSON.parse(JSON.stringify(v));
 const state={doc:{moduleSyncV1:{agents:{payload:"[]"}}},incidentDoc:{},transactions:0,refGets:0,files:new Map(),mainWrites:0,incidentWrites:0};
 window.__agentsFirebaseTest=state;
 const listeners={kanban:[],discipline:[]};
 const getDoc=name=>name==="discipline"?state.incidentDoc:state.doc;
 const snap=name=>({exists:true,data:()=>clone(getDoc(name)),metadata:{fromCache:false,hasPendingWrites:false}});
 function notify(name){listeners[name].forEach(fn=>queueMicrotask(()=>fn(snap(name))));}
 state.notifyMain=()=>notify("kanban");
 const refs={
   kanban:{
     name:"kanban",
     async get(){state.refGets++;return snap("kanban")},
     onSnapshot(opts,fn){if(typeof opts==="function")fn=opts;listeners.kanban.push(fn);queueMicrotask(()=>fn(snap("kanban")));return()=>{}}
   },
   discipline:{
     name:"discipline",
     async get(){state.refGets++;return snap("discipline")},
     onSnapshot(opts,fn){if(typeof opts==="function")fn=opts;listeners.discipline.push(fn);queueMicrotask(()=>fn(snap("discipline")));return()=>{}}
   }
 };
 const firestore=()=>({
   collection(name){return{doc(){return name==="discipline"?refs.discipline:refs.kanban}}},
   async runTransaction(fn){
     state.transactions++;
     let updates=[];
     const tx={
       get:async ref=>snap(ref.name),
       set(ref,data,options={}){
         const old=getDoc(ref.name);
         const merged=options.merge?{...old,...clone(data)}:clone(data);
         if(options.merge&&data.moduleSyncV1)merged.moduleSyncV1={...(old.moduleSyncV1||{}),...clone(data.moduleSyncV1)};
         if(new Blob([JSON.stringify(merged)]).size>1048576)throw Error('Firestore: document too large (>1MiB)');
         updates.push([ref.name,merged]);
       }
     };
     const result=await fn(tx);
     for(const [name,doc] of updates){
       if(name==="discipline"){state.incidentDoc=doc;state.incidentWrites++}
       else{state.doc=doc;state.mainWrites++}
       notify(name);
     }
     return result;
   }
 });
 const authObj={onAuthStateChanged(fn){queueMicrotask(()=>fn({uid:"test-user"}));return()=>{}},signInWithEmailAndPassword:async()=>({user:{uid:"test-user"}})};
 const auth=()=>authObj;
 const storage=()=>({ref:()=>({child:path=>({
   put:async(blob,meta)=>{state.files.set(path,{blob,meta});return{}},
   getDownloadURL:async()=>URL.createObjectURL(state.files.get(path).blob)
 })})});
 window.firebase={apps:[{}],auth,firestore,storage};
 window.INOVTEC_FIREBASE_CONFIG={projectId:"fixture"};
})();
</script>
<script src="../inovtec-agents-firebase-direct.js"></script>
</body></html>
