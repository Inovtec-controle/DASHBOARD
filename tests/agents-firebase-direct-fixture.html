<!doctype html><html><head><meta charset="utf-8"></head><body>
<span id="syncMirror"></span><iframe id="legacyFrame"></iframe>
<script>
(()=>{
 const clone=v=>JSON.parse(JSON.stringify(v));
 const state={
   doc:{moduleSyncV1:{agents:{payload:"[]"}}},
   incidentDoc:{},incidentRecords:new Map(),encryptedRecords:new Map(),
   transactions:0,refGets:0,files:new Map(),mainWrites:0,incidentWrites:0,encryptedWrites:0
 };
 window.__agentsFirebaseTest=state;
 const listeners={kanban:[],discipline:[],incidents:[]};
 const snap=name=>({
   exists:true,
   data:()=>clone(name==="kanban"?state.doc:state.incidentDoc),
   metadata:{fromCache:false,hasPendingWrites:false}
 });
 const incidentSnap=()=>({
   docs:[...state.incidentRecords.entries()].map(([id,record])=>({id,data:()=>clone(record)})),
   metadata:{fromCache:false,hasPendingWrites:false}
 });
 function notify(name){
   const result=name==="incidents"?incidentSnap():snap(name);
   listeners[name].forEach(cb=>queueMicrotask(()=>cb(result)));
 }
 state.notifyMain=()=>notify("kanban");
 const collection={
   get:async()=>incidentSnap(),
   onSnapshot(options,cb){const fn=typeof options==="function"?options:cb;listeners.incidents.push(fn);queueMicrotask(()=>fn(incidentSnap()));return()=>{}},
   doc(id){return{async set(record){state.incidentRecords.set(id,clone(record));state.incidentWrites++;notify("incidents")}}}
 };
 const refs={
   kanban:{
     name:"kanban",
     collection(name){if(name!=="agentIncidents")throw Error("Invalid collection");return collection},
     async get(){state.refGets++;return snap("kanban")},
     onSnapshot(opts,cb){const fn=typeof opts==="function"?opts:cb;listeners.kanban.push(fn);queueMicrotask(()=>fn(snap("kanban")));return()=>{}}
   },
   discipline:{
     name:"discipline",
     async get(){state.refGets++;return snap("discipline")},
     onSnapshot(opts,cb){const fn=typeof opts==="function"?opts:cb;listeners.discipline.push(fn);queueMicrotask(()=>fn(snap("discipline")));return()=>{}}
   }
 };
 const protectedCollection={
   where(field,op,owner){return{
     async get(){return{docs:[...state.encryptedRecords.entries()].filter(([,d])=>d.ownerUid===owner).map(([id,d])=>({id,data:()=>clone(d)}))}},
     onSnapshot(options,callback){return()=>{}}
   }},
   doc(id){return{
     async set(value){state.encryptedRecords.set(id,clone(value));state.encryptedWrites++},
     async get(){const d=state.encryptedRecords.get(id);return{exists:!!d,data:()=>clone(d)}}
   }}
 };
 const firestore=()=>({
   collection(name){return name==="chantiers"?protectedCollection:{doc(){return name==="discipline"?refs.discipline:refs.kanban}}},
   async runTransaction(fn){
     state.transactions++;
     const updates=[];
     const tx={
       get:async ref=>ref.get(),
       set(ref,data,options={}){
         const old=ref.name==="kanban"?state.doc:state.incidentDoc;
         const merged=options.merge?{...old,...clone(data)}:clone(data);
         if(options.merge&&data.moduleSyncV1)merged.moduleSyncV1={...(old.moduleSyncV1||{}),...clone(data.moduleSyncV1)};
         if(new Blob([JSON.stringify(merged)]).size>1048576)throw Error('Firestore document too large');
         updates.push([ref.name,merged]);
       }
     };
     const result=await fn(tx);
     for(const [name,value] of updates){
       if(name==="kanban"){state.doc=value;state.mainWrites++}
       else state.incidentDoc=value;
       notify(name);
     }
     return result;
   }
 });
 const authObj={onAuthStateChanged(fn){queueMicrotask(()=>fn({uid:"test-user"}));return()=>{}},signInWithEmailAndPassword:async()=>({user:{uid:"test-user"}})};
 const auth=()=>authObj;
 const storage=()=>({ref:()=>({child:path=>({
   put:async(blob,meta)=>{throw Object.assign(new Error('Missing or insufficient permissions'),{code:'permission-denied'})},
   getDownloadURL:async()=>URL.createObjectURL(state.files.get(path).blob)
 })})});
 window.firebase={apps:[{}],auth,firestore,storage};
 window.INOVTEC_FIREBASE_CONFIG={projectId:"fixture"};
})();
</script>
<script src="../inovtec-agents-firebase-direct.js"></script>
</body></html>
