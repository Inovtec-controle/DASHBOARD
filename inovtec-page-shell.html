<script>
(function stripRemovedDisciplineNavigation(){
  const clean=()=>{
    document.querySelectorAll('#desktopNav a,#mobileNav a,.iv-sidebar a').forEach(a=>{
      const href=String(a.getAttribute("href")||"").toLowerCase();
      const label=String(a.textContent||"").trim().toLowerCase();
      if(href.includes("discipline")||label==="discipline")a.remove();
    });
  };
  clean();
  const targets=[document.getElementById("desktopNav"),document.getElementById("mobileNav")].filter(Boolean);
  targets.forEach(target=>new MutationObserver(clean).observe(target,{childList:true,subtree:true}));
  setTimeout(clean,50);setTimeout(clean,300);setTimeout(clean,1000);
})();
</script>
