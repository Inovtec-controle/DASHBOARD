<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Agents PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  display:flex;
  height:100vh;
  background:#f3f4f6;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:15px;
}

.agent{
  padding:8px;
  border-radius:8px;
  margin-bottom:5px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.agent.active{
  background:#e0f2fe;
}

.agent span{
  width:12px;
  height:12px;
  border-radius:50%;
}

button{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:#fff;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* DAYS */
.days{
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  background:#fff;
  border-bottom:1px solid #ddd;
}

.day{
  text-align:center;
  padding:10px;
  font-weight:600;
}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  overflow:auto;
  position:relative;
}

.hour{
  border-bottom:1px solid #eee;
  font-size:12px;
  padding:4px;
}

.cell{
  border:1px solid #eee;
  height:60px;
  position:relative;
}

/* EVENT */
.event{
  position:absolute;
  left:5px;
  right:5px;
  border-radius:8px;
  color:#fff;
  padding:5px;
  font-size:12px;
  cursor:grab;
}

.resize{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:8px;
  cursor:n-resize;
  background:rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Agents</h3>
  <div id="agents"></div>

  <button onclick="generatePDF()">📄 Générer PDF</button>
</div>

<div class="main">
  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>
</div>

<script>

const agents = [
  {name:"Agent 1", color:"#16a34a"},
  {name:"Agent 2", color:"#3b82f6"}
];

let events = [];
let selectedAgent = null;

const days = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const grid = document.getElementById("grid");

/* AGENTS */
function renderAgents(){
  const el=document.getElementById("agents");
  el.innerHTML="";

  const all=document.createElement("div");
  all.className="agent"+(selectedAgent===null?" active":"");
  all.innerHTML=`<span style="background:#000"></span> Tous`;
  all.onclick=()=>{
    selectedAgent=null;
    renderAgents();
    renderGrid();
  };
  el.appendChild(all);

  agents.forEach((a,i)=>{
    const div=document.createElement("div");
    div.className="agent"+(selectedAgent===i?" active":"");
    div.innerHTML=`<span style="background:${a.color}"></span>${a.name}`;
    div.onclick=()=>{
      selectedAgent=i;
      renderAgents();
      renderGrid();
    };
    el.appendChild(div);
  });
}

/* DAYS */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML="<div></div>";
  days.forEach(d=> el.innerHTML+=`<div class="day">${d}</div>`);
}

/* GRID */
function renderGrid(){
  grid.innerHTML="";

  for(let h=0;h<24;h++){
    grid.innerHTML+=`<div class="hour">${h}:00</div>`;
    for(let d=0;d<7;d++){
      grid.innerHTML+=`<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
    }
  }

  events.forEach((e,i)=>{
    if(selectedAgent!==null && e.agent!==selectedAgent) return;
    drawEvent(e,i);
  });
}

/* DRAW EVENT */
function drawEvent(e,i){
  const top = e.hour*60;
  const height = e.duration*60;

  const div=document.createElement("div");
  div.className="event";
  div.style.top=top+"px";
  div.style.height=height+"px";
  div.style.background=e.color;
  div.style.left=`calc(${(e.day+1)*(100/8)}% + 5px)`;
  div.style.width=`calc((100/8) - 10px)`;
  div.innerHTML=e.title+`<div class="resize"></div>`;

  /* DRAG */
  let offsetY=0;

  div.onmousedown=(ev)=>{
    offsetY=ev.offsetY;

    document.onmousemove=(eMove)=>{
      const y=eMove.clientY-grid.getBoundingClientRect().top-offsetY;
      div.style.top=y+"px";
    };

    document.onmouseup=()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.hour=Math.max(0,Math.round(parseInt(div.style.top)/60));
      renderGrid();
    };
  };

  /* RESIZE */
  const resizer=div.querySelector(".resize");

  resizer.onmousedown=(ev)=>{
    ev.stopPropagation();

    document.onmousemove=(eMove)=>{
      const newHeight=eMove.clientY-div.getBoundingClientRect().top;
      div.style.height=newHeight+"px";
    };

    document.onmouseup=()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.duration=Math.max(1,Math.round(parseInt(div.style.height)/60));
      renderGrid();
    };
  };

  grid.appendChild(div);
}

/* CREATE EVENT */
grid.addEventListener("click",(e)=>{
  const cell=e.target.closest(".cell");
  if(!cell) return;

  if(selectedAgent===null){
    alert("Sélectionne un agent !");
    return;
  }

  const day=parseInt(cell.dataset.day);
  const hour=parseInt(cell.dataset.hour);

  const title=prompt("Nom tâche ?");
  if(!title) return;

  const agent=agents[selectedAgent];

  events.push({
    day,
    hour,
    duration:1,
    title,
    color:agent.color,
    agent:selectedAgent
  });

  renderGrid();
});

/* PDF */
function generatePDF(){

  const copies=parseInt(prompt("Nombre de copies ?", "2"));
  if(!copies || copies<1) return;

  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();

  let firstPage=true;

  let pages=[];
  for(let c=0;c<copies;c++){
    agents.forEach((a,i)=> pages.push(i));
  }

  pages.forEach((agentIndex)=>{
    const agent=agents[agentIndex];

    if(!firstPage) doc.addPage();
    firstPage=false;

    doc.setFontSize(18);
    doc.text(`Planning - ${agent.name}`,14,20);

    doc.setFontSize(10);
    let y=30;

    const agentEvents=events
      .filter(e=>e.agent===agentIndex)
      .sort((a,b)=>a.day-b.day||a.hour-b.hour);

    if(agentEvents.length===0){
      doc.text("Aucune tâche",14,y);
      return;
    }

    agentEvents.forEach(e=>{
      const dayName=days[e.day];
      const start=`${e.hour}h`;
      const end=`${e.hour+e.duration}h`;

      doc.text(`${dayName} | ${start}-${end} | ${e.title}`,14,y);
      y+=6;

      if(y>280){
        doc.addPage();
        y=20;
      }
    });

  });

  doc.save("planning-agents.pdf");
}

/* INIT */
renderAgents();
renderDays();
renderGrid();

</script>

</body>
</html>
