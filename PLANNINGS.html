<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{display:flex;height:100vh;background:#f3f4f6;}
.sidebar{width:260px;background:#fff;border-right:1px solid #ddd;padding:10px;}
.agent{padding:8px;border-radius:6px;cursor:pointer;margin-bottom:5px;}
.agent.active{background:#dbeafe;}
button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:6px;background:#16a34a;color:#fff;}
.main{flex:1;display:flex;flex-direction:column;}
.header{display:flex;justify-content:center;gap:20px;padding:10px;background:#fff;border-bottom:1px solid #ddd;}
.days{display:grid;grid-template-columns:60px repeat(7,1fr);background:#fff;}
.day{text-align:center;padding:10px;font-weight:600;}
.grid{flex:1;display:grid;grid-template-columns:60px repeat(7,1fr);position:relative;}
.hour{height:60px;font-size:12px;border-bottom:1px solid #eee;}
.cell{border:1px solid #eee;height:60px;}
.event{position:absolute;border-radius:6px;color:#fff;font-size:12px;padding:3px;}
.resize{height:6px;background:rgba(255,255,255,0.6);position:absolute;bottom:0;left:0;right:0;}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Agents</h3>
  <div id="agents"></div>
  <button onclick="generatePDF()">📄 PDF</button>
</div>

<div class="main">
  <div class="header">
    <div id="weekDisplay"></div>
    <select id="weekType">
      <option value="pair">Semaine paire</option>
      <option value="impair">Semaine impaire</option>
    </select>
  </div>

  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>
</div>

<script>

/* ===== CONFIG ===== */
const agents=[
  {name:"Agent 1",color:"#16a34a"},
  {name:"Agent 2",color:"#3b82f6"}
];

let selectedAgent=0;
let weekType=localStorage.getItem("weekType")||"pair";

const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

/* ===== DATE SEMAINE ===== */
function getWeekDates(){
  const now=new Date();
  const day=now.getDay()||7;
  const monday=new Date(now);
  monday.setDate(now.getDate()-day+1);

  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);

  const format=d=>d.toLocaleDateString("fr-FR");

  return format(monday)+" - "+format(sunday);
}

document.getElementById("weekDisplay").innerText=getWeekDates();

/* ===== STORAGE ===== */
function getEvents(){
  return JSON.parse(localStorage.getItem("events_"+weekType))||[];
}
function saveEvents(events){
  localStorage.setItem("events_"+weekType,JSON.stringify(events));
}

/* ===== PDF ===== */
function generatePDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF("landscape");

  const events=getEvents();

  agents.forEach((agent,i)=>{

    if(i>0) doc.addPage();

    doc.setFontSize(16);
    doc.text(`${agent.name} - ${getWeekDates()}`,10,10);

    let colWidth=40;
    let startX=10;
    let startY=20;

    let totalWeek=0;

    days.forEach((day,d)=>{

      let y=startY;

      doc.setFontSize(10);
      doc.text(day,startX + d*colWidth,y);

      y+=5;

      let dayTotal=0;

      const list=events.filter(e=>e.agent===i && e.day===d);

      list.forEach(e=>{
        const duration=e.end-e.start;
        dayTotal+=duration;
        totalWeek+=duration;

        doc.text(`${e.start}h-${e.end}h`,startX + d*colWidth,y);
        doc.text(e.title,startX + d*colWidth,y+4);
        y+=10;
      });

      doc.text(`Total: ${dayTotal.toFixed(2)}h`,startX + d*colWidth,180);

    });

    doc.setFontSize(12);
    doc.text(`Total semaine: ${totalWeek.toFixed(2)}h`,10,200);

  });

  doc.save("planning.pdf");
}

</script>

</body>
</html>
