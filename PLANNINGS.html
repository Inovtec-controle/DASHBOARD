<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INOVTEC – Planning rapide</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter;
  background:#f1f5f9;
}

header{
  background:#16a34a;
  color:white;
  padding:15px;
  font-weight:800;
}

.container{
  padding:10px;
}

input{
  padding:5px;
  border-radius:6px;
  border:1px solid #ccc;
  width:100%;
  margin-bottom:3px;
}

button{
  background:#16a34a;
  color:white;
  border:none;
  padding:6px;
  border-radius:6px;
  cursor:pointer;
  margin-top:3px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  border:1px solid #ddd;
  padding:5px;
  text-align:center;
  vertical-align:top;
}

th{
  background:#e2e8f0;
}

.cell{
  display:flex;
  flex-direction:column;
}

.slot{
  display:flex;
  gap:3px;
  margin-bottom:3px;
}

.slot input{
  font-size:12px;
}

.add-btn{
  background:#22c55e;
  font-size:12px;
}
</style>
</head>

<body>

<header>INOVTEC – Planning rapide</header>

<div class="container">

<input id="newAgent" placeholder="Nom agent">
<button onclick="addAgent()">+ Ajouter agent</button>

<button onclick="save()">💾 Sauvegarder</button>
<button onclick="generatePDF()">📄 PDF</button>

<table id="planningTable">
<thead>
<tr>
<th>Agent</th>
<th>Lundi</th>
<th>Mardi</th>
<th>Mercredi</th>
<th>Jeudi</th>
<th>Vendredi</th>
<th>Samedi</th>
<th>Dimanche</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<div id="pdfContent" style="display:none"></div>

<script>

let data = JSON.parse(localStorage.getItem("simplePlanningMulti")) || [];

const days = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function addAgent(){
  const name=document.getElementById("newAgent").value;
  if(!name) return;

  let planning={};
  days.forEach(d=>planning[d]=[]);

  data.push({name,planning});
  document.getElementById("newAgent").value="";
  render();
}

function render(){
  const tbody=document.querySelector("#planningTable tbody");
  tbody.innerHTML="";

  data.forEach((agent,i)=>{
    let row=`<tr><td><b>${agent.name}</b></td>`;

    days.forEach(day=>{
      row+=`<td><div class="cell">`;

      agent.planning[day].forEach((slot,j)=>{
        row+=`
        <div class="slot">
          <input value="${slot}" 
          onchange="update(${i},'${day}',${j},this.value)">
        </div>`;
      });

      row+=`<button class="add-btn" onclick="addSlot(${i},'${day}')">+</button>`;
      row+=`</div></td>`;
    });

    row+="</tr>";
    tbody.innerHTML+=row;
  });
}

function addSlot(i,day){
  data[i].planning[day].push("");
  render();
}

function update(i,day,j,value){
  data[i].planning[day][j]=value;
}

function save(){
  localStorage.setItem("simplePlanningMulti", JSON.stringify(data));
  alert("Sauvegardé");
}

function generatePDF(){
  const container=document.getElementById("pdfContent");
  container.innerHTML=document.getElementById("planningTable").outerHTML;
  html2pdf().from(container).save("planning.pdf");
}

render();

</script>

</body>
</html>
