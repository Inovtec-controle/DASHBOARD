<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning PRO Stable</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{display:flex;height:100vh;background:#f3f4f6;}

.sidebar{width:280px;background:#fff;border-right:1px solid #ddd;padding:10px;}
.agent{display:flex;justify-content:space-between;padding:8px;border-radius:6px;margin-bottom:5px;cursor:pointer;}
.agent.active{background:#dbeafe;}

.copy-input{
  width:45px;
  border:none;
  border-radius:20px;
  background:#16a34a;
  color:#fff;
  text-align:center;
}
.copy-input::-webkit-inner-spin-button{display:none;}

.add{background:#16a34a;color:#fff;padding:8px;text-align:center;border-radius:6px;cursor:pointer;margin-top:10px;}
button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:6px;background:#16a34a;color:#fff;}

.main{flex:1;display:flex;flex-direction:column;}
.header{display:flex;justify-content:center;gap:20px;padding:10px;background:#fff;border-bottom:1px solid #ddd;}

.days{display:grid;grid-template-columns:60px repeat(7,1fr);}
.day{text-align:center;padding:10px;font-weight:600;background:#fff;}

.grid{flex:1;display:grid;grid-template-columns:60px repeat(7,1fr);position:relative;}

.hour{height:60px;border-bottom:1px solid #eee;font-size:12px;}
.cell{border:1px solid #eee;height:60px;}

.event{
  position:absolute;
  border-radius:6px;
  color:#fff;
  font-size:12px;
  padding:3px;
  cursor:grab;
}

.resize{
  position:absolute;
  bottom:0;
  height:6px;
  left:0;
  right:0;
  background:rgba(255,255,255,0.5);
  cursor:n-resize;
}
</style>
</head>

<body>

<div class="sidebar">
<h3>Agents</h3>
<div id="agents"></div>
<div class="add" onclick="addAgent()">+ Ajouter</div>
<button onclick="generatePDF()">📄 PDF</button>
</div>

<div class="main">
<div class="header">
<div id="weekDisplay"></div>
<select id="weekType">
<option value="pair">Semaine paire</option>
<option value="impair">Semaine impaire</option>
</select>
</div>

<div class="days" id="days"></div>
<div class="grid" id="grid"></div>
</div>

<script>

let agents=JSON.parse(localStorage.getItem("agents"))||[
{name:"Agent 1",color:"#16a34a",copies:2},
{name:"Agent 2",color:"#3b82f6",copies:2}
];

let selectedAgent=0;
let weekType=localStorage.getItem("weekType")||"pair";

const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const grid=document.getElementById("grid");

function saveAgents(){localStorage.setItem("agents",JSON.stringify(agents));}
function getEvents(){return JSON.parse(localStorage.getItem("events_"+weekType))||[];}
function saveEvents(e){localStorage.setItem("events_"+weekType,JSON.stringify(e));}

/* ===== WEEK ===== */
function getWeekDates(){
const now=new Date();
const d=now.getDay()||7;
const m=new Date(now);m.setDate(now.getDate()-d+1);
const s=new Date(m);s.setDate(m.getDate()+6);
return m.toLocaleDateString()+" - "+s.toLocaleDateString();
}
document.getElementById("weekDisplay").innerText=getWeekDates();

/* ===== AGENTS ===== */
function renderAgents(){
const el=document.getElementById("agents");
el.innerHTML="";
agents.forEach((a,i)=>{
const div=document.createElement("div");
div.className="agent"+(i===selectedAgent?" active":"");

const name=document.createElement("span");
name.textContent=a.name;

const input=document.createElement("input");
input.value=a.copies;
input.className="copy-input";
input.onclick=e=>e.stopPropagation();
input.onchange=e=>{
let v=parseInt(e.target.value);
if(!v||v<2)v=2;
a.copies=v;
saveAgents();
};

div.onclick=()=>{selectedAgent=i;renderAgents();renderGrid();};

div.appendChild(name);
div.appendChild(input);
el.appendChild(div);
});
}

function addAgent(){
const name=prompt("Nom ?");
if(!name)return;
const color="#"+Math.floor(Math.random()*16777215).toString(16);
agents.push({name,color,copies:2});
saveAgents();
renderAgents();
}

/* ===== GRID ===== */
function renderDays(){
const el=document.getElementById("days");
el.innerHTML="<div></div>";
days.forEach(d=>el.innerHTML+=`<div class="day">${d}</div>`);
}

function renderGrid(){
grid.innerHTML="";

for(let h=0;h<24;h++){
grid.innerHTML+=`<div class="hour">${h}:00</div>`;
for(let d=0;d<7;d++){
grid.innerHTML+=`<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
}
}

const events=getEvents();
events.forEach((e,i)=>{
if(e.agent!==selectedAgent)return;
drawEvent(e,i,events);
});
}

/* ===== EVENT ===== */
function drawEvent(e,i,events){

const div=document.createElement("div");
div.className="event";

function updatePosition(){
const cell=document.querySelector(`.cell[data-day="${e.day}"][data-hour="0"]`);
if(!cell)return;

const rect=cell.getBoundingClientRect();
const gridRect=grid.getBoundingClientRect();

div.style.left=(rect.left-gridRect.left+5)+"px";
div.style.width=(rect.width-10)+"px";
div.style.top=(e.start*60)+"px";
div.style.height=((e.end-e.start)*60)+"px";
}

updatePosition();
div.style.background=e.color;
div.innerHTML=e.title+'<div class="resize"></div>';

/* DELETE */
div.oncontextmenu=ev=>{
ev.preventDefault();
if(confirm("Supprimer ?")){
events.splice(i,1);
saveEvents(events);
renderGrid();
}
};

/* DRAG */
div.onmousedown=ev=>{
if(ev.button===2)return;

document.onmousemove=m=>{
const gridRect=grid.getBoundingClientRect();

let x=m.clientX-gridRect.left;
let y=m.clientY-gridRect.top;

let colWidth=grid.querySelector(".cell").offsetWidth;
let day=Math.floor(x/colWidth)-1;
day=Math.max(0,Math.min(6,day));

let hour=y/60;
hour=Math.round(hour*4)/4;

let duration=e.end-e.start;

e.day=day;
e.start=hour;
e.end=hour+duration;

updatePosition();
};

document.onmouseup=()=>{
document.onmousemove=null;
document.onmouseup=null;
saveEvents(events);
renderGrid();
};
};

/* RESIZE */
const res=div.querySelector(".resize");
res.onmousedown=ev=>{
ev.stopPropagation();

document.onmousemove=m=>{
const gridRect=grid.getBoundingClientRect();
let y=m.clientY-gridRect.top;

let newEnd=y/60;
newEnd=Math.round(newEnd*4)/4;

if(newEnd>e.start){
e.end=newEnd;
updatePosition();
}
};

document.onmouseup=()=>{
document.onmousemove=null;
document.onmouseup=null;
saveEvents(events);
renderGrid();
};
};

grid.appendChild(div);
}

/* CREATE */
grid.addEventListener("click",e=>{
const cell=e.target.closest(".cell");
if(!cell)return;

const events=getEvents();

const day=parseInt(cell.dataset.day);
const hour=parseInt(cell.dataset.hour);

const title=prompt("Nom tâche ?");
if(!title)return;

events.push({
day,
start:hour,
end:hour+1,
title,
color:agents[selectedAgent].color,
agent:selectedAgent
});

saveEvents(events);
renderGrid();
});

/* WEEK */
document.getElementById("weekType").value=weekType;
document.getElementById("weekType").onchange=function(){
weekType=this.value;
localStorage.setItem("weekType",weekType);
renderGrid();
};

/* PDF */
function generatePDF(){
const {jsPDF}=window.jspdf;
const doc=new jsPDF("landscape");
const events=getEvents();

let first=true;

agents.forEach((agent,i)=>{
for(let c=0;c<agent.copies;c++){

if(!first)doc.addPage();
first=false;

doc.text(`${agent.name} - ${getWeekDates()}`,10,10);

days.forEach((day,d)=>{
let y=20;
doc.text(day,10+d*40,y);

const list=events.filter(e=>e.agent===i && e.day===d);

list.forEach(e=>{
y+=6;
doc.text(`${e.start}h-${e.end}h ${e.title}`,10+d*40,y);
});
});
}
});

doc.save("planning.pdf");
}

/* INIT */
renderAgents();
renderDays();
renderGrid();

</script>
</body>
</html>
