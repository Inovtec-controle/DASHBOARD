<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planning PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{display:flex;height:100vh;background:#f3f4f6;}

.sidebar{
  width:260px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
}

.agent{
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  margin-bottom:5px;
}
.agent.active{background:#dbeafe;}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#16a34a;
  color:#fff;
  cursor:pointer;
}

.main{flex:1;display:flex;flex-direction:column;}

.header{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:10px;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.days{
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  background:#fff;
}

.day{text-align:center;padding:10px;font-weight:600;}

.grid{
  flex:1;
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  position:relative;
}

.hour{height:60px;font-size:12px;border-bottom:1px solid #eee;}
.cell{border:1px solid #eee;height:60px;}

.event{
  position:absolute;
  border-radius:6px;
  color:#fff;
  font-size:12px;
  padding:3px;
  cursor:grab;
}

.resize{
  height:6px;
  background:rgba(255,255,255,0.6);
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  cursor:n-resize;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Agents</h3>
  <div id="agents"></div>
  <button onclick="generatePDF()">📄 Générer PDF avancé</button>
</div>

<div class="main">

  <div class="header">
    <div id="weekDisplay"></div>

    <select id="weekType">
      <option value="pair">Semaine paire</option>
      <option value="impair">Semaine impaire</option>
    </select>
  </div>

  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>

</div>

<script>

/* === IDENTIQUE A TON CODE EXISTANT POUR PLANNING === */
/* (je ne change pas ton système planning, juste PDF) */

const agents=[
  {name:"Agent 1",color:"#16a34a"},
  {name:"Agent 2",color:"#3b82f6"}
];

let selectedAgent=0;
let weekType=localStorage.getItem("weekType")||"pair";

const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const grid=document.getElementById("grid");

function getEvents(){
  return JSON.parse(localStorage.getItem("events_"+weekType))||[];
}

function getWeek(){
  const d=new Date();
  const firstJan=new Date(d.getFullYear(),0,1);
  const daysDiff=Math.floor((d-firstJan)/86400000);
  return Math.ceil((d.getDay()+1+daysDiff)/7);
}
document.getElementById("weekDisplay").innerText="Semaine "+getWeek();

/* === PDF AVANCÉ === */

function generatePDF(){

  let config = [];

  agents.forEach((a,i)=>{
    const include = confirm("Inclure "+a.name+" ?");
    if(!include) return;

    const copies = parseInt(prompt("Nombre de copies pour "+a.name+" ?", "1"));
    if(!copies || copies<1) return;

    config.push({index:i, copies});
  });

  if(config.length===0){
    alert("Aucun agent sélectionné");
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const events=getEvents();

  let pages = [];
  let maxCopies = Math.max(...config.map(c=>c.copies));

  for(let c=0;c<maxCopies;c++){
    config.forEach(cfg=>{
      if(c < cfg.copies){
        pages.push(cfg.index);
      }
    });
  }

  let first=true;

  pages.forEach(agentIndex=>{
    const agent=agents[agentIndex];

    if(!first) doc.addPage();
    first=false;

    doc.text(`Planning ${agent.name} (${weekType})`,10,15);

    let y=25;

    const list=events
      .filter(e=>e.agent===agentIndex)
      .sort((a,b)=>a.day-b.day||a.start-b.start);

    list.forEach(e=>{
      doc.text(`${days[e.day]} ${e.start}h-${e.end}h : ${e.title}`,10,y);
      y+=6;
    });
  });

  doc.save("planning.pdf");
}

</script>

</body>
</html>
