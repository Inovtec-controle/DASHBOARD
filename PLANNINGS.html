<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INOVTEC – Planning Simple</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter;
  background:#f1f5f9;
}

header{
  background:#16a34a;
  color:white;
  padding:15px;
  font-weight:800;
}

.container{
  padding:10px;
}

input{
  padding:5px;
  border-radius:6px;
  border:1px solid #ccc;
  width:100%;
}

button{
  background:#16a34a;
  color:white;
  border:none;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  margin:5px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  border:1px solid #ddd;
  padding:5px;
  text-align:center;
}

th{
  background:#e2e8f0;
}

.agent-name{
  font-weight:600;
}
</style>
</head>

<body>

<header>INOVTEC – Planning rapide</header>

<div class="container">

<input id="newAgent" placeholder="Nom agent">
<button onclick="addAgent()">+ Ajouter agent</button>

<button onclick="save()">💾 Sauvegarder</button>
<button onclick="generatePDF()">📄 PDF</button>

<table id="planningTable">
<thead>
<tr>
<th>Agent</th>
<th>Lundi</th>
<th>Mardi</th>
<th>Mercredi</th>
<th>Jeudi</th>
<th>Vendredi</th>
<th>Samedi</th>
<th>Dimanche</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<div id="pdfContent" style="display:none"></div>

<script>

let data = JSON.parse(localStorage.getItem("simplePlanning")) || [];

const days = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function addAgent(){
  const name=document.getElementById("newAgent").value;
  if(!name) return;

  data.push({
    name,
    planning:{}
  });

  document.getElementById("newAgent").value="";
  render();
}

function render(){
  const tbody=document.querySelector("#planningTable tbody");
  tbody.innerHTML="";

  data.forEach((agent,i)=>{
    let row=`<tr><td class="agent-name">${agent.name}</td>`;

    days.forEach(day=>{
      const val=agent.planning[day] || "";
      row+=`<td>
        <input value="${val}" 
        onchange="update(${i},'${day}',this.value)">
      </td>`;
    });

    row+="</tr>";
    tbody.innerHTML+=row;
  });
}

function update(i,day,value){
  data[i].planning[day]=value;
}

function save(){
  localStorage.setItem("simplePlanning", JSON.stringify(data));
  alert("Sauvegardé");
}

function generatePDF(){
  const container=document.getElementById("pdfContent");
  container.innerHTML=document.getElementById("planningTable").outerHTML;
  html2pdf().from(container).save("planning-simple.pdf");
}

render();

</script>

</body>
</html>
