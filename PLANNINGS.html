<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INOVTEC KONTROL – Planning UI V2</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --bg:#f1f5f9;
  --panel:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --brand:#16a34a;
  --border:#e2e8f0;
}

body{
  margin:0;
  font-family:Inter;
  background:var(--bg);
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0f172a;
  color:white;
  height:100vh;
  padding:15px;
}

.sidebar h1{
  font-size:16px;
  margin-bottom:20px;
}

.sidebar input{
  width:100%;
  margin-bottom:5px;
  padding:6px;
  border-radius:6px;
  border:none;
}

.sidebar button{
  width:100%;
  margin-bottom:10px;
}

.sidebar-item{
  padding:8px;
  cursor:pointer;
  border-radius:6px;
}

.sidebar-item.active{
  background:#16a34a;
}

/* MAIN */
.main{
  flex:1;
  padding:15px;
  overflow:auto;
}

.topbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

select, button{
  padding:8px;
  border-radius:8px;
  border:none;
}

button{
  background:var(--brand);
  color:white;
}

/* PLANNING GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day{
  background:var(--panel);
  padding:10px;
  border-radius:10px;
  min-height:200px;
}

.day h3{
  margin-top:0;
  font-size:14px;
}

/* SLOT */
.slot{
  background:#dcfce7;
  padding:5px;
  border-radius:8px;
  margin-bottom:5px;
  font-size:12px;
}

.slot input, .slot select{
  width:100%;
  margin-bottom:3px;
  font-size:11px;
}
</style>
</head>

<body>

<div class="sidebar">
<h1>INOVTEC</h1>

<input id="agentInput" placeholder="Agent">
<button onclick="addAgent()">+ Agent</button>

<div id="agentList"></div>

<hr>

<input id="chantierInput" placeholder="Chantier">
<button onclick="addChantier()">+ Chantier</button>

<div id="chantierList"></div>

</div>

<div class="main">

<div class="topbar">
<select id="agentSelect" onchange="selectAgent(this.value)"></select>

<select id="weekType" onchange="renderPlanning()">
<option value="pair">Semaine paire</option>
<option value="impair">Semaine impair</option>
</select>

<button onclick="copyWeek()">Copier semaine</button>
<button onclick="generatePDF()">PDF</button>
</div>

<div id="planningGrid" class="grid"></div>

</div>

<div id="pdfContent" style="display:none"></div>

<script>

let data = JSON.parse(localStorage.getItem("planningUI2")) || {
  agents:[],
  chantiers:[]
};

let currentAgentIndex = 0;

const days=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function save(){
  localStorage.setItem("planningUI2", JSON.stringify(data));
}

/* AGENTS */
function addAgent(){
  const name=document.getElementById("agentInput").value;
  if(!name) return;

  data.agents.push({name,planning:{pair:{},impair:{}}});
  document.getElementById("agentInput").value="";
  save();
  renderAgents();
}

function renderAgents(){
  const list=document.getElementById("agentList");
  const select=document.getElementById("agentSelect");

  list.innerHTML="";
  select.innerHTML="";

  data.agents.forEach((a,i)=>{
    list.innerHTML+=`<div class="sidebar-item ${i===currentAgentIndex?"active":""}" onclick="selectAgent(${i})">${a.name}</div>`;
    select.innerHTML+=`<option value="${i}">${a.name}</option>`;
  });

  select.value=currentAgentIndex;
}

function selectAgent(i){
  currentAgentIndex=parseInt(i);
  renderAgents();
  renderPlanning();
}

/* CHANTIERS */
function addChantier(){
  const name=document.getElementById("chantierInput").value;
  if(!name)return;

  data.chantiers.push(name);
  document.getElementById("chantierInput").value="";
  save();
  renderChantiers();
}

function renderChantiers(){
  document.getElementById("chantierList").innerHTML=data.chantiers.join("<br>");
}

/* PLANNING */
function renderPlanning(){
  const grid=document.getElementById("planningGrid");
  grid.innerHTML="";

  const week=document.getElementById("weekType").value;
  const agent=data.agents[currentAgentIndex];

  if(!agent) return;

  days.forEach(day=>{
    if(!agent.planning[week][day]) agent.planning[week][day]=[];

    let html=`<div class="day"><h3>${day}</h3>`;

    agent.planning[week][day].forEach((slot,i)=>{
      html+=`
      <div class="slot">
        <select onchange="updateSlot('${day}',${i},'chantier',this.value)">
          ${data.chantiers.map(c=>`<option ${c===slot.chantier?"selected":""}>${c}</option>`).join("")}
        </select>
        <input value="${slot.start}" placeholder="Début" onchange="updateSlot('${day}',${i},'start',this.value)">
        <input value="${slot.end}" placeholder="Fin" onchange="updateSlot('${day}',${i},'end',this.value)">
      </div>`;
    });

    html+=`<button onclick="addSlot('${day}')">+</button></div>`;

    grid.innerHTML+=html;
  });
}

function addSlot(day){
  const week=document.getElementById("weekType").value;
  const agent=data.agents[currentAgentIndex];

  agent.planning[week][day].push({chantier:"",start:"",end:""});
  renderPlanning();
}

function updateSlot(day,index,field,value){
  const week=document.getElementById("weekType").value;
  data.agents[currentAgentIndex].planning[week][day][index][field]=value;
  save();
}

/* COPY */
function copyWeek(){
  const agent=data.agents[currentAgentIndex];
  const week=document.getElementById("weekType").value;

  if(week==="pair"){
    agent.planning.impair=JSON.parse(JSON.stringify(agent.planning.pair));
  }else{
    agent.planning.pair=JSON.parse(JSON.stringify(agent.planning.impair));
  }

  renderPlanning();
  save();
}

/* PDF */
function generatePDF(){
  const container=document.getElementById("pdfContent");
  container.innerHTML="";

  data.agents.forEach(agent=>{
    let html=`<h2>${agent.name}</h2>`;

    ["pair","impair"].forEach(week=>{
      html+=`<h3>Semaine ${week}</h3><table border="1" width="100%">`;

      days.forEach(day=>{
        (agent.planning[week][day]||[]).forEach(slot=>{
          html+=`<tr>
            <td>${day}</td>
            <td>${slot.chantier}</td>
            <td>${slot.start}</td>
            <td>${slot.end}</td>
          </tr>`;
        });
      });

      html+=`</table>`;
    });

    container.innerHTML+=html;
  });

  html2pdf().from(container).save("planning.pdf");
}

/* INIT */
renderAgents();
renderChantiers();
renderPlanning();

</script>

</body>
</html>
