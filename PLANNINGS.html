<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  display:flex;
  height:100vh;
  background:#f3f4f6;
}

.sidebar{
  width:220px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
}

.agent{
  padding:8px;
  margin-bottom:5px;
  cursor:pointer;
  border-radius:6px;
}

.agent.active{
  background:#dbeafe;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.days{
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  background:#fff;
  border-bottom:1px solid #ddd;
}

.day{
  text-align:center;
  padding:10px;
  font-weight:600;
}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  position:relative;
}

.hour{
  font-size:12px;
  border-bottom:1px solid #eee;
  height:60px;
}

.cell{
  border:1px solid #eee;
  height:60px;
  position:relative;
}

/* EVENT */
.event{
  position:absolute;
  width:calc(100% - 10px);
  left:5px;
  border-radius:6px;
  color:#fff;
  font-size:12px;
  padding:3px;
  cursor:grab;
}

.resize{
  height:6px;
  background:rgba(255,255,255,0.5);
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  cursor:n-resize;
}
</style>
</head>

<body>

<div class="sidebar">
  <div id="agents"></div>
</div>

<div class="main">
  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>
</div>

<script>

const agents = [
  {name:"Agent 1", color:"#16a34a"},
  {name:"Agent 2", color:"#3b82f6"}
];

let selectedAgent = 0;
let events = [];

const days = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

const grid = document.getElementById("grid");

/* AGENTS */
function renderAgents(){
  const el=document.getElementById("agents");
  el.innerHTML="";
  agents.forEach((a,i)=>{
    const div=document.createElement("div");
    div.className="agent"+(selectedAgent===i?" active":"");
    div.textContent=a.name;
    div.onclick=()=>{
      selectedAgent=i;
      renderAgents();
      renderGrid();
    };
    el.appendChild(div);
  });
}

/* DAYS */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML="<div></div>";
  days.forEach(d=> el.innerHTML+=`<div class="day">${d}</div>`);
}

/* GRID */
function renderGrid(){
  grid.innerHTML="";

  for(let h=0;h<24;h++){
    grid.innerHTML+=`<div class="hour">${h}:00</div>`;
    for(let d=0;d<7;d++){
      grid.innerHTML+=`<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
    }
  }

  events.forEach((e,i)=>{
    if(e.agent!==selectedAgent) return;
    drawEvent(e,i);
  });
}

/* DRAW EVENT */
function drawEvent(e,i){

  const columnWidth = grid.offsetWidth / 8;
  const left = columnWidth * (e.day+1);

  const div=document.createElement("div");
  div.className="event";
  div.style.top = (e.start * 60) + "px";
  div.style.height = ((e.end - e.start) * 60) + "px";
  div.style.left = left + "px";
  div.style.width = columnWidth - 10 + "px";
  div.style.background = e.color;
  div.innerHTML = e.title + `<div class="resize"></div>`;

  /* DRAG */
  div.onmousedown = (ev)=>{
    const offsetY = ev.offsetY;

    document.onmousemove = (eMove)=>{
      let y = eMove.clientY - grid.getBoundingClientRect().top - offsetY;

      // SNAP 15 MIN
      let minutes = Math.round(y / 15) * 15;
      div.style.top = minutes + "px";
    };

    document.onmouseup = ()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.start = parseInt(div.style.top) / 60;
      e.end = e.start + (e.end - e.start);

      renderGrid();
    };
  };

  /* RESIZE */
  const resizer = div.querySelector(".resize");

  resizer.onmousedown = (ev)=>{
    ev.stopPropagation();

    document.onmousemove = (eMove)=>{
      let height = eMove.clientY - div.getBoundingClientRect().top;

      let snap = Math.round(height / 15) * 15;
      div.style.height = snap + "px";
    };

    document.onmouseup = ()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.end = e.start + (parseInt(div.style.height)/60);
      renderGrid();
    };
  };

  grid.appendChild(div);
}

/* CREATE EVENT */
grid.addEventListener("click",(e)=>{
  const cell = e.target.closest(".cell");
  if(!cell) return;

  const day = parseInt(cell.dataset.day);
  const hour = parseInt(cell.dataset.hour);

  const title = prompt("Nom tâche ?");
  if(!title) return;

  events.push({
    day,
    start: hour,
    end: hour + 1,
    title,
    color: agents[selectedAgent].color,
    agent: selectedAgent
  });

  renderGrid();
});

/* INIT */
renderAgents();
renderDays();
renderGrid();

</script>

</body>
</html>
