<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{display:flex;height:100vh;background:#f3f4f6;}

.sidebar{width:280px;background:#fff;border-right:1px solid #ddd;padding:10px;}

.agent{
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  margin-bottom:5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.agent.active{background:#dbeafe;}

.copy-badge{
  background:#16a34a;
  color:#fff;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}

.add{background:#16a34a;color:#fff;padding:8px;text-align:center;border-radius:6px;cursor:pointer;margin-top:10px;}
button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:6px;background:#16a34a;color:#fff;}

.main{flex:1;display:flex;flex-direction:column;}

.header{display:flex;justify-content:center;gap:20px;padding:10px;background:#fff;border-bottom:1px solid #ddd;}

.days{display:grid;grid-template-columns:60px repeat(7,1fr);}
.day{text-align:center;padding:10px;font-weight:600;background:#fff;}

.grid{flex:1;display:grid;grid-template-columns:60px repeat(7,1fr);position:relative;}

.hour{height:60px;font-size:12px;border-bottom:1px solid #eee;}
.cell{border:1px solid #eee;height:60px;}

.event{position:absolute;border-radius:6px;color:#fff;font-size:12px;padding:3px;cursor:grab;}
.resize{height:6px;background:rgba(255,255,255,0.6);position:absolute;bottom:0;left:0;right:0;}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Agents</h3>
  <div id="agents"></div>
  <div class="add" onclick="addAgent()">+ Ajouter agent</div>
  <button onclick="generatePDF()">📄 Générer PDF</button>
</div>

<div class="main">
  <div class="header">
    <div id="weekDisplay"></div>
    <select id="weekType">
      <option value="pair">Semaine paire</option>
      <option value="impair">Semaine impaire</option>
    </select>
  </div>

  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>
</div>

<script>

/* ===== AGENTS ===== */
let agents = JSON.parse(localStorage.getItem("agents")) || [
  {name:"Agent 1",color:"#16a34a",copies:2},
  {name:"Agent 2",color:"#3b82f6",copies:2}
];

let selectedAgent = 0;
let weekType = localStorage.getItem("weekType") || "pair";

const days = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const grid = document.getElementById("grid");

/* ===== SAVE ===== */
function saveAgents(){
  localStorage.setItem("agents",JSON.stringify(agents));
}

/* ===== WEEK ===== */
function getWeekDates(){
  const now=new Date();
  const day=now.getDay()||7;
  const monday=new Date(now);
  monday.setDate(now.getDate()-day+1);
  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);
  return monday.toLocaleDateString()+" - "+sunday.toLocaleDateString();
}
document.getElementById("weekDisplay").innerText=getWeekDates();

/* ===== EVENTS ===== */
function getEvents(){
  return JSON.parse(localStorage.getItem("events_"+weekType))||[];
}
function saveEvents(events){
  localStorage.setItem("events_"+weekType,JSON.stringify(events));
}

/* ===== AGENTS UI ===== */
function renderAgents(){
  const el=document.getElementById("agents");
  el.innerHTML="";

  agents.forEach((a,i)=>{

    const div=document.createElement("div");
    div.className="agent"+(selectedAgent===i?" active":"");

    const name=document.createElement("span");
    name.textContent=a.name;

    const badge=document.createElement("span");
    badge.className="copy-badge";
    badge.textContent=a.copies;

    /* AUGMENTER COPIES */
    badge.onclick=(e)=>{
      e.stopPropagation();
      a.copies++;
      saveAgents();
      renderAgents();
    };

    /* DIMINUTION BLOQUÉE */
    badge.oncontextmenu=(e)=>{
      e.preventDefault();
      alert("Impossible de diminuer les copies");
    };

    div.appendChild(name);
    div.appendChild(badge);

    div.onclick=()=>{
      selectedAgent=i;
      renderAgents();
      renderGrid();
    };

    /* RENAME */
    div.ondblclick=()=>{
      const n=prompt("Renommer :",a.name);
      if(n){
        a.name=n;
        saveAgents();
        renderAgents();
      }
    };

    /* DELETE */
    div.oncontextmenu=(e)=>{
      e.preventDefault();
      if(confirm("Supprimer agent ?")){
        agents.splice(i,1);
        saveAgents();
        selectedAgent=0;
        renderAgents();
        renderGrid();
      }
    };

    el.appendChild(div);
  });
}

/* ===== GRID ===== */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML="<div></div>";
  days.forEach(d=>el.innerHTML+=`<div class="day">${d}</div>`);
}

function renderGrid(){
  grid.innerHTML="";

  for(let h=0;h<24;h++){
    grid.innerHTML+=`<div class="hour">${h}:00</div>`;
    for(let d=0;d<7;d++){
      grid.innerHTML+=`<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
    }
  }

  const events=getEvents();

  events.forEach((e,i)=>{
    if(e.agent!==selectedAgent) return;
    drawEvent(e,i,events);
  });
}

/* ===== EVENT ===== */
function drawEvent(e,i,events){

  const col=document.querySelector(`.cell[data-day="${e.day}"][data-hour="0"]`);
  const left=col.offsetLeft;
  const width=col.offsetWidth;

  const div=document.createElement("div");
  div.className="event";

  div.style.left=left+5+"px";
  div.style.width=(width-10)+"px";
  div.style.top=(e.start*60)+"px";
  div.style.height=((e.end-e.start)*60)+"px";
  div.style.background=e.color;

  div.innerHTML=e.title+`<div class="resize"></div>`;

  div.oncontextmenu=(ev)=>{
    ev.preventDefault();
    if(confirm("Supprimer tâche ?")){
      events.splice(i,1);
      saveEvents(events);
      renderGrid();
    }
  };

  grid.appendChild(div);
}

/* ===== CREATE ===== */
grid.addEventListener("click",(e)=>{
  const cell=e.target.closest(".cell");
  if(!cell) return;

  const events=getEvents();

  const day=parseInt(cell.dataset.day);
  const hour=parseInt(cell.dataset.hour);

  const title=prompt("Nom tâche ?");
  if(!title) return;

  events.push({
    day,
    start:hour,
    end:hour+1,
    title,
    color:agents[selectedAgent].color,
    agent:selectedAgent
  });

  saveEvents(events);
  renderGrid();
});

/* ===== PDF ===== */
function generatePDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF("landscape");
  const events=getEvents();

  let first=true;

  agents.forEach((agent,i)=>{

    for(let c=0;c<agent.copies;c++){

      if(!first) doc.addPage();
      first=false;

      doc.text(`${agent.name} - ${getWeekDates()}`,10,10);

      let totalWeek=0;

      days.forEach((day,d)=>{

        let y=20;
        let dayTotal=0;

        doc.text(day,10+d*40,y);

        const list=events.filter(e=>e.agent===i && e.day===d);

        list.forEach(e=>{
          const dur=e.end-e.start;
          dayTotal+=dur;
          totalWeek+=dur;

          y+=6;
          doc.text(`${e.start}h-${e.end}h`,10+d*40,y);
          doc.text(e.title,10+d*40,y+4);
        });

        doc.text(`Total: ${dayTotal.toFixed(2)}h`,10+d*40,180);

      });

      doc.text(`Total semaine: ${totalWeek.toFixed(2)}h`,10,200);

    }

  });

  doc.save("planning.pdf");
}

/* ===== INIT ===== */
renderAgents();
renderDays();
renderGrid();

</script>

</body>
</html>
