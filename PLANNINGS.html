<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INOVTEC – Planning simple PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter;
  background:#f1f5f9;
}

header{
  background:#16a34a;
  color:white;
  padding:15px;
  font-weight:800;
}

.container{
  padding:10px;
}

input{
  padding:5px;
  border-radius:6px;
  border:1px solid #ccc;
  width:100%;
}

button{
  background:#16a34a;
  color:white;
  border:none;
  padding:6px;
  border-radius:6px;
  cursor:pointer;
  margin-top:4px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  border:1px solid #ddd;
  padding:5px;
  vertical-align:top;
}

th{
  background:#e2e8f0;
  text-align:center;
}

.agent{
  font-weight:600;
}

/* SLOT */
.slot{
  background:#dcfce7;
  padding:4px;
  border-radius:6px;
  margin-bottom:4px;
}

.slot input{
  font-size:12px;
  margin-bottom:2px;
}

.delete{
  background:#ef4444;
}
</style>
</head>

<body>

<header>INOVTEC – Planning terrain simple</header>

<div class="container">

<input id="newAgent" placeholder="Nom agent">
<button onclick="addAgent()">+ Ajouter agent</button>

<button onclick="save()">💾 Sauvegarder</button>

<table>
<thead>
<tr>
<th>Agent</th>
<th>Lundi</th>
<th>Mardi</th>
<th>Mercredi</th>
<th>Jeudi</th>
<th>Vendredi</th>
<th>Samedi</th>
<th>Dimanche</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

</div>

<script>

let data = JSON.parse(localStorage.getItem("planningOK")) || [];

const days = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function addAgent(){
  const name=document.getElementById("newAgent").value;
  if(!name) return;

  let planning={};
  days.forEach(d=>planning[d]=[]);

  data.push({name,planning});
  document.getElementById("newAgent").value="";
  render();
}

function render(){
  const body=document.getElementById("body");
  body.innerHTML="";

  data.forEach((agent,i)=>{

    let row=`<tr><td class="agent">${agent.name}</td>`;

    days.forEach(day=>{
      row+=`<td>`;

      agent.planning[day].forEach((slot,j)=>{
        row+=`
        <div class="slot">
          <input placeholder="Début" value="${slot.start}" onchange="update(${i},'${day}',${j},'start',this.value)">
          <input placeholder="Fin" value="${slot.end}" onchange="update(${i},'${day}',${j},'end',this.value)">
          <input placeholder="Chantier" value="${slot.site}" onchange="update(${i},'${day}',${j},'site',this.value)">
          <button class="delete" onclick="removeSlot(${i},'${day}',${j})">X</button>
        </div>`;
      });

      row+=`<button onclick="addSlot(${i},'${day}')">+ Ajouter</button>`;
      row+=`</td>`;
    });

    row+="</tr>";
    body.innerHTML+=row;
  });
}

function addSlot(i,day){
  data[i].planning[day].push({
    start:"",
    end:"",
    site:""
  });
  render();
}

function removeSlot(i,day,j){
  data[i].planning[day].splice(j,1);
  render();
}

function update(i,day,j,field,value){
  data[i].planning[day][j][field]=value;
}

function save(){
  localStorage.setItem("planningOK", JSON.stringify(data));
  alert("Sauvegardé");
}

render();

</script>

</body>
</html>
