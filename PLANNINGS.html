<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{display:flex;height:100vh;background:#f3f4f6;}

.sidebar{
  width:260px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
}

.agent{
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  margin-bottom:5px;
}
.agent.active{background:#dbeafe;}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#16a34a;
  color:#fff;
  cursor:pointer;
}

.main{flex:1;display:flex;flex-direction:column;}

.header{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:10px;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.days{
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  background:#fff;
}

.day{text-align:center;padding:10px;font-weight:600;}

.grid{
  flex:1;
  display:grid;
  grid-template-columns:60px repeat(7,1fr);
  position:relative;
}

.hour{height:60px;font-size:12px;border-bottom:1px solid #eee;}
.cell{border:1px solid #eee;height:60px;}

.event{
  position:absolute;
  border-radius:6px;
  color:#fff;
  font-size:12px;
  padding:3px;
  cursor:grab;
}

.resize{
  height:6px;
  background:rgba(255,255,255,0.6);
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  cursor:n-resize;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Agents</h3>
  <div id="agents"></div>
  <button onclick="generatePDF()">📄 Générer PDF</button>
</div>

<div class="main">

  <div class="header">
    <div id="weekDisplay"></div>

    <select id="weekType">
      <option value="pair">Semaine paire</option>
      <option value="impair">Semaine impaire</option>
    </select>
  </div>

  <div class="days" id="days"></div>
  <div class="grid" id="grid"></div>

</div>

<script>

const agents=[
  {name:"Agent 1",color:"#16a34a"},
  {name:"Agent 2",color:"#3b82f6"}
];

let selectedAgent=0;
let weekType=localStorage.getItem("weekType")||"pair";

const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const grid=document.getElementById("grid");

/* SEMAINE */
function getWeek(){
  const d=new Date();
  const firstJan=new Date(d.getFullYear(),0,1);
  const daysDiff=Math.floor((d-firstJan)/86400000);
  return Math.ceil((d.getDay()+1+daysDiff)/7);
}
document.getElementById("weekDisplay").innerText="Semaine "+getWeek();

/* STORAGE */
function getEvents(){
  return JSON.parse(localStorage.getItem("events_"+weekType))||[];
}
function saveEvents(events){
  localStorage.setItem("events_"+weekType,JSON.stringify(events));
}

/* AGENTS */
function renderAgents(){
  const el=document.getElementById("agents");
  el.innerHTML="";
  agents.forEach((a,i)=>{
    const div=document.createElement("div");
    div.className="agent"+(selectedAgent===i?" active":"");
    div.textContent=a.name;
    div.onclick=()=>{
      selectedAgent=i;
      renderAgents();
      renderGrid();
    };
    el.appendChild(div);
  });
}

/* DAYS */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML="<div></div>";
  days.forEach(d=>el.innerHTML+=`<div class="day">${d}</div>`);
}

/* GRID */
function renderGrid(){
  grid.innerHTML="";

  for(let h=0;h<24;h++){
    grid.innerHTML+=`<div class="hour">${h}:00</div>`;
    for(let d=0;d<7;d++){
      grid.innerHTML+=`<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
    }
  }

  const events=getEvents();

  events.forEach((e,i)=>{
    if(e.agent!==selectedAgent) return;
    drawEvent(e,i,events);
  });
}

/* DRAW EVENT */
function drawEvent(e,i,events){

  const cell=document.querySelector(`.cell[data-day="${e.day}"][data-hour="0"]`);
  if(!cell) return;

  const left=cell.offsetLeft;
  const width=cell.offsetWidth;

  const div=document.createElement("div");
  div.className="event";

  div.style.left=left+5+"px";
  div.style.width=(width-10)+"px";
  div.style.top=(e.start*60)+"px";
  div.style.height=((e.end-e.start)*60)+"px";

  div.style.background=e.color;
  div.innerHTML=e.title+`<div class="resize"></div>`;

  /* SUPPRESSION */
  div.oncontextmenu=(ev)=>{
    ev.preventDefault();
    if(confirm("Supprimer ?")){
      events.splice(i,1);
      saveEvents(events);
      renderGrid();
    }
  };

  /* DRAG */
  div.onmousedown=(ev)=>{
    if(ev.button===2) return;

    const offsetY=ev.offsetY;

    document.onmousemove=(eMove)=>{
      let y=eMove.clientY-grid.getBoundingClientRect().top-offsetY;
      let snap=Math.round(y/15)*15;
      div.style.top=snap+"px";
    };

    document.onmouseup=()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.start=parseInt(div.style.top)/60;
      e.end=e.start+(e.end-e.start);

      saveEvents(events);
      renderGrid();
    };
  };

  /* RESIZE */
  const resizer=div.querySelector(".resize");

  resizer.onmousedown=(ev)=>{
    ev.stopPropagation();

    document.onmousemove=(eMove)=>{
      let h=eMove.clientY-div.getBoundingClientRect().top;
      let snap=Math.round(h/15)*15;
      div.style.height=snap+"px";
    };

    document.onmouseup=()=>{
      document.onmousemove=null;
      document.onmouseup=null;

      e.end=e.start+(parseInt(div.style.height)/60);

      saveEvents(events);
      renderGrid();
    };
  };

  grid.appendChild(div);
}

/* CREATE */
grid.addEventListener("click",(e)=>{
  const cell=e.target.closest(".cell");
  if(!cell) return;

  const events=getEvents();

  const day=parseInt(cell.dataset.day);
  const hour=parseInt(cell.dataset.hour);

  const title=prompt("Nom tâche ?");
  if(!title) return;

  events.push({
    day,
    start:hour,
    end:hour+1,
    title,
    color:agents[selectedAgent].color,
    agent:selectedAgent
  });

  saveEvents(events);
  renderGrid();
});

/* SELECTEUR */
document.getElementById("weekType").value=weekType;
document.getElementById("weekType").onchange=function(){
  weekType=this.value;
  localStorage.setItem("weekType",weekType);
  renderGrid();
};

/* PDF AVANCÉ */
function generatePDF(){

  let config=[];

  agents.forEach((a,i)=>{
    const include=confirm("Inclure "+a.name+" ?");
    if(!include) return;

    const copies=parseInt(prompt("Copies pour "+a.name+" ?", "1"));
    if(!copies || copies<1) return;

    config.push({index:i,copies});
  });

  if(config.length===0){
    alert("Aucun agent");
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  const events=getEvents();

  let pages=[];
  let max=Math.max(...config.map(c=>c.copies));

  for(let c=0;c<max;c++){
    config.forEach(cfg=>{
      if(c<cfg.copies){
        pages.push(cfg.index);
      }
    });
  }

  let first=true;

  pages.forEach(agentIndex=>{
    const agent=agents[agentIndex];

    if(!first) doc.addPage();
    first=false;

    doc.text(`Planning ${agent.name} (${weekType})`,10,15);

    let y=25;

    const list=events
      .filter(e=>e.agent===agentIndex)
      .sort((a,b)=>a.day-b.day||a.start-b.start);

    list.forEach(e=>{
      doc.text(`${days[e.day]} ${e.start}h-${e.end}h : ${e.title}`,10,y);
      y+=6;
    });
  });

  doc.save("planning.pdf");
}

/* INIT */
renderAgents();
renderDays();
renderGrid();

</script>

</body>
</html>
