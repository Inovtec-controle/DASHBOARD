<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVTEC KONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}
.logo span { color:#22c55e; }

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}
.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
}

.planning {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.planning textarea{
  height:90px;
  font-size:12px;
}

.save, .pdf {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.save { background:#22c55e; color:white; }
.pdf { background:#111827; color:white; }

</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Nom...">

  <div id="liste"></div>
</div>

<div class="detail">

<div class="card">
<div class="section-title">Informations</div>

<input id="nom">
<input id="cles">
<input id="adresse">
<input id="syndic">
<input id="telephone">
<input id="presidentCS">
<input id="telephoneCS">
<input id="email">
</div>

<div class="card">
<div class="section-title">Agent</div>

<input id="agentNom">
<input id="agentTel">

<div class="planning">
<textarea id="lundi"></textarea>
<textarea id="mardi"></textarea>
<textarea id="mercredi"></textarea>
<textarea id="jeudi"></textarea>
<textarea id="vendredi"></textarea>
<textarea id="samedi"></textarea>
<textarea id="dimanche"></textarea>
</div>

<input id="jours">
<input id="horaires">

<textarea id="consignesAgents"></textarea>
</div>

<div class="card">
<div class="section-title">Gestion</div>

<input id="franges">
<input id="ampoules">

<input id="sortieOM">
<input id="rentreeOM">

<input id="sortieTRI">
<input id="rentreeTRI">

<textarea id="notes"></textarea>
</div>

<button class="pdf" onclick="genererFiche()">📄 Fiche agent</button>
<button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"inovtec-chantiers.firebaseapp.com",
  projectId:"inovtec-chantiers"
});

const db = getFirestore(app);
const ref = collection(db,"chantiers");

let currentId=null;
let allChantiers=[];

onSnapshot(ref,s=>{
  allChantiers=[];
  s.forEach(d=>allChantiers.push({id:d.id,...d.data()}));
  document.getElementById("liste").innerHTML=
  allChantiers.map(c=>`
  <div class="item" onclick="charger('${c.id}')">
  <b>${c.nom||""}</b><br>🔑 ${c.cles||""}
  </div>`).join("");
});

window.charger=id=>{
  const c=allChantiers.find(x=>x.id===id);
  currentId=id;
  Object.keys(c).forEach(k=>{
    if(document.getElementById(k))document.getElementById(k).value=c[k];
  });
};

window.ajouterOuModifier=async()=>{
  const data={};
  document.querySelectorAll("input,textarea").forEach(e=>data[e.id]=e.value);
  if(currentId) await updateDoc(doc(db,"chantiers",currentId),data);
  else{
    const d=await addDoc(ref,data);
    currentId=d.id;
  }
};

window.genererFiche=()=>{

const jours=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

const planning=jours.map(j=>`
<div class="pcol">
<div class="ptitle">${j.toUpperCase()}</div>
<div class="pval">${val(j)}</div>
</div>`).join("");

const html=`
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>

body{font-family:'Inter';padding:25px;}

.header{
font-size:24px;
font-weight:800;
margin-bottom:20px;
}
.header span{color:#22c55e;}

.section{
background:rgba(243,244,246,0.3);
border-radius:12px;
padding:10px;
margin-bottom:10px;
}

.title{
font-weight:600;
margin-bottom:6px;
}

.value{
font-size:14px;
margin-bottom:10px;
}

.planning{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}

.pcol{
background:white;
border-radius:8px;
padding:6px;
height:180px;
}

.ptitle{
font-weight:600;
font-size:11px;
margin-bottom:4px;
}

.pval{
font-size:12px;
}

</style>
</head>

<body>

<div class="header">${val("nom")}<span>.</span></div>

<div class="section">
<div class="title">Identification du site</div>
<div class="title">Numéro de clé</div>
<div class="value">${val("cles")}</div>
</div>

<div class="section">
<div class="title">Adresse</div>
<div class="value">${val("adresse")}</div>
</div>

<div class="section">
<div class="title">LUNDI MARDI MERCREDI JEUDI VENDREDI SAMEDI DIMANCHE</div>
<div class="planning">${planning}</div>
</div>

<div class="section">
<div class="title">Sortie OM</div>
<div class="value">${val("sortieOM")}</div>
</div>

<div class="section">
<div class="title">Rentré OM</div>
<div class="value">${val("rentreeOM")}</div>
</div>

<div class="section">
<div class="title">Sortie TRI</div>
<div class="value">${val("sortieTRI")}</div>
</div>

<div class="section">
<div class="title">Rentré TRI</div>
<div class="value">${val("rentreeTRI")}</div>
</div>

<div class="section">
<div class="title">Note</div>
<div class="value">${val("notes")}</div>
</div>

</body>
</html>`;

const w=window.open();
w.document.write(html);
w.print();
};

window.supprimer=async()=>{
if(!currentId)return;
await deleteDoc(doc(db,"chantiers",currentId));
nouveau();
};

window.nouveau=()=>{
currentId=null;
document.querySelectorAll("input,textarea").forEach(e=>e.value="");
};

function val(id){return document.getElementById(id).value;}

</script>

</body>
</html>
