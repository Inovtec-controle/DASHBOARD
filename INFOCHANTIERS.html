<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers PRO</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f4f6;
}

/* LAYOUT */
.app {
  display: flex;
  height: 100vh;
}

/* GAUCHE */
.sidebar {
  width: 35%;
  background: white;
  border-right: 2px solid #ddd;
  overflow-y: auto;
  padding: 10px;
}

.sidebar h2 {
  margin-top: 0;
}

.item {
  padding: 10px;
  border-radius: 8px;
  background: #f9fafb;
  margin-bottom: 8px;
  cursor: pointer;
}

.item:hover {
  background: #e5e7eb;
}

/* DROITE */
.detail {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.add {
  background: #16a34a;
  color: white;
  width: 100%;
}

.delete {
  background: red;
  color: white;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="app">

  <!-- GAUCHE -->
  <div class="sidebar">
    <h2>📋 Chantiers</h2>

    <input id="search" placeholder="🔍 Rechercher..." oninput="filtrer()">

    <div id="liste"></div>
  </div>

  <!-- DROITE -->
  <div class="detail">

    <div class="card">

      <h2>📄 Fiche chantier</h2>

      <input id="nom" placeholder="Nom">
      <input id="adresse" placeholder="Adresse">
      <input id="responsable" placeholder="Responsable">
      <input id="cles" placeholder="Nombre de clés">
      <input id="ampoules" placeholder="Type d’ampoules">
      <input id="conteneurs" placeholder="Conteneurs">
      <textarea id="notes" placeholder="Notes"></textarea>

      <button class="add" onclick="ajouterOuModifier()">💾 Enregistrer</button>
      <button class="delete" onclick="supprimer()">🗑️ Supprimer</button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// 🔥 REMPLACE PAR TA CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};


// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chantiersRef = collection(db, "chantiers");

let currentId = null;
let allChantiers = [];


// 🔄 TEMPS RÉEL
onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });

  afficherListe(allChantiers);
});


// 📋 LISTE
function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  data.forEach(c => {
    liste.innerHTML += `
      <div class="item" onclick="charger('${c.id}')">
        <b>${c.nom || "Sans nom"}</b><br>
        <small>${c.adresse || ""}</small>
      </div>
    `;
  });
}


// 🔍 FILTRE
window.filtrer = function() {
  const val = document.getElementById("search").value.toLowerCase();

  const filtre = allChantiers.filter(c =>
    (c.nom || "").toLowerCase().includes(val)
  );

  afficherListe(filtre);
};


// 📄 CHARGER
window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;

  document.getElementById("nom").value = c.nom || "";
  document.getElementById("adresse").value = c.adresse || "";
  document.getElementById("responsable").value = c.responsable || "";
  document.getElementById("cles").value = c.cles || "";
  document.getElementById("ampoules").value = c.ampoules || "";
  document.getElementById("conteneurs").value = c.conteneurs || "";
  document.getElementById("notes").value = c.notes || "";
};


// 💾 AJOUT / MODIF
window.ajouterOuModifier = async function() {

  const data = {
    nom: document.getElementById("nom").value,
    adresse: document.getElementById("adresse").value,
    responsable: document.getElementById("responsable").value,
    cles: document.getElementById("cles").value,
    ampoules: document.getElementById("ampoules").value,
    conteneurs: document.getElementById("conteneurs").value,
    notes: document.getElementById("notes").value,
  };

  if (currentId) {
    await updateDoc(doc(db, "chantiers", currentId), data);
  } else {
    await addDoc(chantiersRef, data);
  }

  resetForm();
};


// 🗑️ SUPPRIMER
window.supprimer = async function() {
  if (!currentId) return;
  await deleteDoc(doc(db, "chantiers", currentId));
  resetForm();
};


// 🔄 RESET
function resetForm() {
  currentId = null;
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
}

</script>

</body>
</html>
