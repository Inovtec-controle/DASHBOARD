<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>INOVTEC KONTROL – Base chantiers</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- FIREBASE PROPRE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuJodWrx4GLYf8Lw2e2fDk7vEJPGRdPUQ",
  authDomain: "inovtec-3c418.firebaseapp.com",
  projectId: "inovtec-3c418"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<style>
body{
  font-family:Arial;
  padding:20px;
  background:#f1f5f9;
}
button{
  padding:8px 14px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  cursor:pointer;
}
input, textarea{
  width:100%;
  margin-bottom:8px;
  padding:6px;
}
.card{
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📊 Base chantiers</h2>

<button onclick="ajouterChantier()">+ Ajouter</button>
<button onclick="sauvegarderTous()">💾 Sauvegarder</button>

<div id="list"></div>

<hr>

<h3>📄 Détail</h3>

<input id="nom" placeholder="Nom résidence">
<input id="adresse" placeholder="Adresse">
<input id="syndic" placeholder="Syndic">
<textarea id="note" placeholder="Note chantier"></textarea>

<input type="file" id="pdfInput" accept="application/pdf">
<button onclick="ouvrirPDF()">📂 Ouvrir PDF</button>

<button onclick="genererPDF()">📄 Générer fiche PDF</button>

<script>

let CHANTIERS = [];
let indexSelection = null;

// =======================
// AFFICHAGE
// =======================
function render(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  CHANTIERS.forEach((c,i)=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${c.nom}</b><br>
      ${c.adresse}<br>
      <small>${c.syndic}</small><br>
      <button onclick="select(${i})">Modifier</button>
      <button onclick="supprimer(${i})">Supprimer</button>
    `;

    list.appendChild(div);
  });
}

// =======================
// SELECTION
// =======================
function select(i){

  indexSelection = i;
  const c = CHANTIERS[i];

  document.getElementById("nom").value = c.nom || "";
  document.getElementById("adresse").value = c.adresse || "";
  document.getElementById("syndic").value = c.syndic || "";
  document.getElementById("note").value = c.note || "";
}

// =======================
// AJOUT
// =======================
function ajouterChantier(){

  CHANTIERS.push({
    nom:"Nouveau chantier",
    adresse:"",
    syndic:"",
    note:"",
    pdf:null
  });

  render();
}

// =======================
// SUPPRESSION
// =======================
function supprimer(i){
  CHANTIERS.splice(i,1);
  render();
}

// =======================
// SAUVEGARDE
// =======================
function sauvegarderTous(){

  if(indexSelection !== null){

    const c = CHANTIERS[indexSelection];

    c.nom = document.getElementById("nom").value;
    c.adresse = document.getElementById("adresse").value;
    c.syndic = document.getElementById("syndic").value;
    c.note = document.getElementById("note").value;

    // PDF
    const file = document.getElementById("pdfInput").files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        c.pdf = {
          name:file.name,
          data:e.target.result
        };
        envoyerFirebase();
      };
      reader.readAsDataURL(file);
    }else{
      envoyerFirebase();
    }

  }else{
    envoyerFirebase();
  }

  localStorage.setItem("chantiers", JSON.stringify(CHANTIERS));

  alert("Sauvegardé ✅");
}

// =======================
// FIREBASE
// =======================
function envoyerFirebase(){

  CHANTIERS.forEach(c => {

    const id = (c.nom || "chantier")
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/[^\w]/g,"");

    db.collection("chantiers").doc(id).set(c);
  });
}

// =======================
// CHARGEMENT FIREBASE
// =======================
function chargerFirebase(){

  CHANTIERS.length = 0;

  db.collection("chantiers").get()
    .then(snapshot => {

      snapshot.forEach(doc=>{
        CHANTIERS.push(doc.data());
      });

      render();
    });
}

// =======================
// PDF
// =======================
function genererPDF(){

  if(indexSelection === null) return;

  const c = CHANTIERS[indexSelection];

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("FICHE CHANTIER",20,20);
  doc.text("Nom : " + c.nom,20,40);
  doc.text("Adresse : " + c.adresse,20,50);
  doc.text("Syndic : " + c.syndic,20,60);
  doc.text("Note : " + c.note,20,70);

  doc.save("chantier.pdf");
}

// =======================
// OUVRIR PDF
// =======================
function ouvrirPDF(){

  if(indexSelection === null) return;

  const c = CHANTIERS[indexSelection];

  if(c.pdf){
    window.open(c.pdf.data);
  }else{
    alert("Aucun PDF");
  }
}

// =======================
// INIT
// =======================
const local = localStorage.getItem("chantiers");
if(local){
  CHANTIERS = JSON.parse(local);
}

render();
chargerFirebase();

</script>

</body>
</html>
