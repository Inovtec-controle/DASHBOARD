<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVTEC KONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
  transition: all 0.25s ease;
}

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
  color:#111827;
}

/* LAYOUT */
.app {
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
  overflow-y:auto;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}

.logo span {
  color:#22c55e;
}

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}

.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

/* LIST */
.list {
  margin-top:10px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.item:hover {
  border-color:#22c55e;
}

/* RIGHT */
.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

/* CARDS */
.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

/* INPUT */
input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
  font-size:14px;
}

input::placeholder,
textarea::placeholder {
  color:#9ca3af;
}

/* SAVE */
.save {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:700;
  font-size:16px;
}

/* MOBILE */
@media (max-width: 768px) {

  .app {
    flex-direction:column;
  }

  .sidebar {
    width:100%;
    height:auto;
    border-right:none;
    border-bottom:1px solid #d1d5db;
  }

  .detail {
    padding:10px;
  }

  .card {
    padding:12px;
  }

  input, textarea {
    font-size:16px;
  }

}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Nom..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreAgent" placeholder="Agent..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreSyndic" placeholder="Syndic..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreVille" placeholder="Ville..." oninput="appliquerFiltres()">

  <div id="liste" class="list"></div>

</div>

<div class="detail">

  <div class="card">
    <div class="section-title">Informations</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse">
    <input id="syndic" placeholder="Syndic">
    <input id="telephone" placeholder="Téléphone">
    <input id="email" placeholder="Email">
    <input id="presidentCS" placeholder="Président CS">
    <input id="telephoneCS" placeholder="Téléphone CS">
  </div>

  <div class="card">
    <div class="section-title">Agents</div>
    <input id="agents" placeholder="Agents">
    <input id="horaires" placeholder="Horaires">
    <input id="jours" placeholder="Jours">
    <textarea id="consignesAgents" placeholder="Consignes"></textarea>
  </div>

  <div class="card">
    <div class="section-title">Matériel</div>
    <input id="materiel" placeholder="Matériel">
    <input id="produits" placeholder="Produits">
    <input id="ampoules" placeholder="Ampoules">
    <input id="cles" placeholder="Numéro de clé">
  </div>

  <div class="card">
    <div class="section-title">Gestion</div>
    <input id="sortieOM" placeholder="Sortie OM">
    <input id="sortieTRI" placeholder="Sortie TRI">
    <input id="franges" placeholder="Franges">
    <textarea id="notes" placeholder="Notes"></textarea>
  </div>

  <button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
  authDomain: "inovtec-chantiers.firebaseapp.com",
  projectId: "inovtec-chantiers",
  storageBucket: "inovtec-chantiers.firebasestorage.app",
  messagingSenderId: "313162345276",
  appId: "1:313162345276:web:1a270f797dd736a4060c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chantiersRef = collection(db, "chantiers");

let currentId = null;
let allChantiers = [];

onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });
  afficherListe(allChantiers);
});

function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  data.forEach(c => {
    liste.innerHTML += `
      <div class="item" onclick="charger('${c.id}')">
        <b>${c.nom || ""}</b><br>
        🔑 ${c.cles || ""}
      </div>
    `;
  });
}

window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;

  Object.keys(c).forEach(key => {
    if (document.getElementById(key)) {
      document.getElementById(key).value = c[key];
    }
  });
};

window.ajouterOuModifier = async function() {

  const data = {
    nom: val("nom"),
    adresse: val("adresse"),
    syndic: val("syndic"),
    telephone: val("telephone"),
    email: val("email"),
    presidentCS: val("presidentCS"),
    telephoneCS: val("telephoneCS"),
    agents: val("agents"),
    horaires: val("horaires"),
    jours: val("jours"),
    consignesAgents: val("consignesAgents"),
    materiel: val("materiel"),
    produits: val("produits"),
    ampoules: val("ampoules"),
    cles: val("cles"),
    sortieOM: val("sortieOM"),
    sortieTRI: val("sortieTRI"),
    franges: val("franges"),
    notes: val("notes"),
    lastUpdate: new Date()
  };

  if (currentId) {
    await updateDoc(doc(db, "chantiers", currentId), data);
  } else {
    const docRef = await addDoc(chantiersRef, data);
    currentId = docRef.id;
  }

};

window.supprimer = async function() {
  if (!currentId) return;
  await deleteDoc(doc(db, "chantiers", currentId));
  nouveau();
};

window.nouveau = function() {
  currentId = null;
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
};

function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
