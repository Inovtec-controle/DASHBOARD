<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers PRO</title>

<style>
body { margin:0; font-family:Arial; background:#f3f4f6; }
.app { display:flex; height:100vh; }

.sidebar {
  width:30%;
  background:white;
  border-right:2px solid #ddd;
  padding:10px;
  overflow-y:auto;
}

.top-actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.new { background:#16a34a; color:white; }
.delete { background:red; color:white; }

.filter {
  width:100%;
  margin-bottom:6px;
  padding:8px;
}

.item {
  padding:10px;
  background:#f9fafb;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
}

.detail {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.card {
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
}

.section-title {
  font-weight:bold;
  margin-bottom:10px;
  color:#16a34a;
}

input, textarea {
  width:100%;
  margin-bottom:8px;
  padding:8px;
}

input::placeholder,
textarea::placeholder {
  color:#9ca3af;
}

button.save {
  width:100%;
  background:#16a34a;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
}

button.pdf {
  width:100%;
  background:#2563eb;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}

button.view {
  width:100%;
  background:#9333ea;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="app">

<!-- GAUCHE -->
<div class="sidebar">

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">➕ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">🗑️ Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="🔤 Nom du chantier">
  <input class="filter" id="filtreAgent" placeholder="👥 Agent">
  <input class="filter" id="filtreClient" placeholder="📞 Contact">
  <input class="filter" id="filtreVille" placeholder="📍 Ville">

  <div id="liste"></div>

</div>

<!-- DROITE -->
<div class="detail">

  <div class="card">
    <div class="section-title">📞 Contact</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse complète">
    <input id="client" placeholder="Nom du client">
    <input id="telephone" placeholder="Téléphone du client">
    <input id="email" placeholder="Email du client">
  </div>

  <div class="card">
    <div class="section-title">👥 Agents</div>
    <input id="agents" placeholder="Noms des agents">
    <input id="horaires" placeholder="Horaires (ex: 8h-12h)">
    <input id="jours" placeholder="Jours d’intervention">
    <textarea id="consignesAgents" placeholder="Consignes spécifiques agents"></textarea>
  </div>

  <div class="card">
    <div class="section-title">🧰 Matériel</div>
    <input id="materiel" placeholder="Matériel présent sur site">
    <input id="produits" placeholder="Produits utilisés">
    <input id="ampoules" placeholder="Type d’ampoules">
    <input id="cles" placeholder="Nombre de clés">
  </div>

  <div class="card">
    <div class="section-title">⚙️ Gestion</div>
    <input id="conteneurs" placeholder="Gestion des conteneurs">
    <input id="frequence" placeholder="Fréquence de nettoyage">
    <textarea id="notes" placeholder="Notes générales"></textarea>
  </div>

  <div class="card">
    <div class="section-title">📄 Cahier des charges</div>
    <input type="file" id="pdfFile" accept="application/pdf">
    <button class="pdf" onclick="uploadPDF()">📎 Importer PDF</button>
    <button class="view" id="btnVoirPDF" style="display:none;" onclick="ouvrirPDF()">👁️ Voir le PDF</button>
  </div>

  <button class="save" onclick="ajouterOuModifier()">💾 Enregistrer</button>

</div>

</div>

<!-- ⚠️ Garde ton script actuel tel quel ici -->

</body>
</html>
