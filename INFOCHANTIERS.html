<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVTEC KONTROL – Chantiers</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#f1f5f9;
}

.app {
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:320px;
  background:white;
  padding:15px;
  border-right:1px solid #e2e8f0;
  display:flex;
  flex-direction:column;
}

.logo {
  font-weight:800;
  font-size:20px;
  color:#16a34a;
  margin-bottom:15px;
}

.top-actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.new { background:#16a34a; color:white; }
.delete { background:#ef4444; color:white; }

.filter {
  padding:10px;
  border-radius:10px;
  border:1px solid #e2e8f0;
  margin-bottom:8px;
}

/* LISTE */
.list {
  flex:1;
  overflow-y:auto;
}

.item {
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  cursor:pointer;
  transition:0.2s;
}

.item:hover {
  background:#e2e8f0;
}

/* DROITE */
.detail {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.card {
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#16a34a;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e2e8f0;
  margin-bottom:8px;
}

input::placeholder,
textarea::placeholder {
  color:#94a3b8;
}

.save {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<!-- GAUCHE -->
<div class="sidebar">

  <div class="logo">INOVTEC</div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Nom..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreAgent" placeholder="Agent..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreClient" placeholder="Client..." oninput="appliquerFiltres()">
  <input class="filter" id="filtreVille" placeholder="Ville..." oninput="appliquerFiltres()">

  <div id="liste" class="list"></div>

</div>

<!-- DROITE -->
<div class="detail">

  <div class="card">
    <div class="section-title">Contact</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse">
    <input id="client" placeholder="Client">
    <input id="telephone" placeholder="Téléphone">
    <input id="email" placeholder="Email">
  </div>

  <div class="card">
    <div class="section-title">Agents</div>
    <input id="agents" placeholder="Agents">
    <input id="horaires" placeholder="Horaires">
    <input id="jours" placeholder="Jours">
    <textarea id="consignesAgents" placeholder="Consignes"></textarea>
  </div>

  <div class="card">
    <div class="section-title">Matériel</div>
    <input id="materiel" placeholder="Matériel">
    <input id="produits" placeholder="Produits">
    <input id="ampoules" placeholder="Ampoules">
    <input id="cles" placeholder="Clés">
  </div>

  <div class="card">
    <div class="section-title">Gestion</div>
    <input id="conteneurs" placeholder="Conteneurs">
    <input id="frequence" placeholder="Fréquence">
    <textarea id="notes" placeholder="Notes"></textarea>
  </div>

  <button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
  authDomain: "inovtec-chantiers.firebaseapp.com",
  projectId: "inovtec-chantiers",
  storageBucket: "inovtec-chantiers.firebasestorage.app",
  messagingSenderId: "313162345276",
  appId: "1:313162345276:web:1a270f797dd736a4060c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chantiersRef = collection(db, "chantiers");

let currentId = null;
let allChantiers = [];

onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });
  appliquerFiltres();
});

window.appliquerFiltres = function() {

  const fNom = val("filtreNom").toLowerCase();
  const fAgent = val("filtreAgent").toLowerCase();
  const fClient = val("filtreClient").toLowerCase();
  const fVille = val("filtreVille").toLowerCase();

  const result = allChantiers.filter(c => {
    return (!fNom || (c.nom || "").toLowerCase().includes(fNom))
      && (!fAgent || (c.agents || "").toLowerCase().includes(fAgent))
      && (!fClient || (c.client || "").toLowerCase().includes(fClient))
      && (!fVille || (c.adresse || "").toLowerCase().includes(fVille));
  });

  afficherListe(result);
};

function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  data.forEach(c => {
    liste.innerHTML += `
      <div class="item" onclick="charger('${c.id}')">
        <b>${c.nom || "Sans nom"}</b><br>
        <small>${c.adresse || ""}</small>
      </div>
    `;
  });
}

window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;

  for (let key in c) {
    if (document.getElementById(key)) {
      document.getElementById(key).value = c[key];
    }
  }
};

window.ajouterOuModifier = async function() {

  const data = {
    nom: val("nom"),
    adresse: val("adresse"),
    client: val("client"),
    telephone: val("telephone"),
    email: val("email"),
    agents: val("agents"),
    horaires: val("horaires"),
    jours: val("jours"),
    consignesAgents: val("consignesAgents"),
    materiel: val("materiel"),
    produits: val("produits"),
    ampoules: val("ampoules"),
    cles: val("cles"),
    conteneurs: val("conteneurs"),
    frequence: val("frequence"),
    notes: val("notes"),
    lastUpdate: new Date()
  };

  if (currentId) {
    await updateDoc(doc(db, "chantiers", currentId), data);
  } else {
    const docRef = await addDoc(chantiersRef, data);
    currentId = docRef.id;
  }

  alert("Enregistré");
};

window.supprimer = async function() {
  if (!currentId) return;
  await deleteDoc(doc(db, "chantiers", currentId));
  nouveau();
};

window.nouveau = function() {
  currentId = null;
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
};

function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
