<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers PRO</title>

<style>
body { margin:0; font-family:Arial; background:#f3f4f6; }
.app { display:flex; height:100vh; }

.sidebar {
  width:30%;
  background:white;
  border-right:2px solid #ddd;
  padding:10px;
  overflow-y:auto;
}

.top-actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.new { background:#16a34a; color:white; }
.delete { background:red; color:white; }

.filter {
  width:100%;
  margin-bottom:6px;
  padding:8px;
}

.item {
  padding:10px;
  background:#f9fafb;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
}

.detail {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.card {
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
}

.section-title {
  font-weight:bold;
  margin-bottom:10px;
  color:#16a34a;
}

input, textarea {
  width:100%;
  margin-bottom:8px;
  padding:8px;
}

input::placeholder,
textarea::placeholder {
  color:#9ca3af;
}

button.save {
  width:100%;
  background:#16a34a;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
}

button.pdf {
  width:100%;
  background:#2563eb;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}

button.view {
  width:100%;
  background:#9333ea;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">➕ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">🗑️ Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="🔤 Nom du chantier" oninput="appliquerFiltres()">
  <input class="filter" id="filtreAgent" placeholder="👥 Agent" oninput="appliquerFiltres()">
  <input class="filter" id="filtreClient" placeholder="📞 Contact" oninput="appliquerFiltres()">
  <input class="filter" id="filtreVille" placeholder="📍 Ville" oninput="appliquerFiltres()">

  <div id="liste"></div>
</div>

<div class="detail">

  <div class="card">
    <div class="section-title">📞 Contact</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse complète">
    <input id="client" placeholder="Nom du client">
    <input id="telephone" placeholder="Téléphone">
    <input id="email" placeholder="Email">
  </div>

  <div class="card">
    <div class="section-title">👥 Agents</div>
    <input id="agents" placeholder="Noms des agents">
    <input id="horaires" placeholder="Horaires">
    <input id="jours" placeholder="Jours">
    <textarea id="consignesAgents" placeholder="Consignes"></textarea>
  </div>

  <div class="card">
    <div class="section-title">🧰 Matériel</div>
    <input id="materiel" placeholder="Matériel">
    <input id="produits" placeholder="Produits">
    <input id="ampoules" placeholder="Ampoules">
    <input id="cles" placeholder="Clés">
  </div>

  <div class="card">
    <div class="section-title">⚙️ Gestion</div>
    <input id="conteneurs" placeholder="Conteneurs">
    <input id="frequence" placeholder="Fréquence">
    <textarea id="notes" placeholder="Notes"></textarea>
  </div>

  <div class="card">
    <div class="section-title">📄 Cahier des charges</div>
    <input type="file" id="pdfFile" accept="application/pdf">
    <button class="pdf" onclick="uploadPDF()">📎 Importer PDF</button>
    <button class="view" id="btnVoirPDF" style="display:none;" onclick="ouvrirPDF()">👁️ Voir le PDF</button>
  </div>

  <button class="save" onclick="ajouterOuModifier()">💾 Enregistrer</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCd_A1V-CRWGxbEmGFDadNFbGqXLocBDPw",
  authDomain: "inovtec-chantiers.firebaseapp.com",
  projectId: "inovtec-chantiers",
  storageBucket: "inovtec-chantiers.firebasestorage.app",
  messagingSenderId: "313162345276",
  appId: "1:313162345276:web:1a270f797dd736a4060c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const chantiersRef = collection(db, "chantiers");

let currentId = null;
let pdfURL = null;
let allChantiers = [];

onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });
  afficherListe(allChantiers);
});

function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";
  data.forEach(c => {
    liste.innerHTML += `<div class="item" onclick="charger('${c.id}')"><b>${c.nom || ""}</b></div>`;
  });
}

window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;
  for (let key in c) {
    if (document.getElementById(key)) {
      document.getElementById(key).value = c[key];
    }
  }
  pdfURL = c.pdfURL || null;
  document.getElementById("btnVoirPDF").style.display = pdfURL ? "block" : "none";
};

window.ajouterOuModifier = async function() {
  try {
    const data = {
      nom: val("nom"),
      adresse: val("adresse"),
      client: val("client"),
      telephone: val("telephone"),
      email: val("email"),
      agents: val("agents"),
      horaires: val("horaires"),
      jours: val("jours"),
      consignesAgents: val("consignesAgents"),
      materiel: val("materiel"),
      produits: val("produits"),
      ampoules: val("ampoules"),
      cles: val("cles"),
      conteneurs: val("conteneurs"),
      frequence: val("frequence"),
      notes: val("notes"),
      pdfURL: pdfURL || null
    };

    if (currentId) {
      await updateDoc(doc(db, "chantiers", currentId), data);
    } else {
      const docRef = await addDoc(chantiersRef, data);
      currentId = docRef.id;
    }

    alert("✅ Enregistré");

  } catch (e) {
    console.error(e);
    alert("❌ Erreur Firebase (ouvre F12)");
  }
};

window.uploadPDF = async function() {
  const file = document.getElementById("pdfFile").files[0];
  if (!file || !currentId) return alert("Enregistre d'abord");

  const storageRef = ref(storage, "pdfs/" + currentId);
  await uploadBytes(storageRef, file);
  pdfURL = await getDownloadURL(storageRef);

  await updateDoc(doc(db, "chantiers", currentId), { pdfURL });

  document.getElementById("btnVoirPDF").style.display = "block";
};

window.ouvrirPDF = function() {
  if (pdfURL) window.open(pdfURL);
};

window.supprimer = async function() {
  if (!currentId) return;
  await deleteDoc(doc(db, "chantiers", currentId));
  nouveau();
};

window.nouveau = function() {
  currentId = null;
  pdfURL = null;
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
  document.getElementById("btnVoirPDF").style.display = "none";
};

function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
