<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFOS CHANTIERS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}
.logo span { color:#22c55e; }

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}
.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
}

.planning {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.planning textarea{
  height:90px;
  font-size:12px;
}

.save, .pdf {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.save { background:#22c55e; color:white; }
.pdf { background:#111827; color:white; }

@media (max-width:768px){
  .app { flex-direction:column; }
  .sidebar { width:100%; }
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Rechercher un chantier...">

  <div id="liste"></div>
</div>

<div class="detail">

<div class="card">
<div class="section-title">Informations</div>

<input id="nom" placeholder="Nom de la résidence">
<input id="adresse" placeholder="Adresse complète du site">
<input id="cles" placeholder="Numéro de clé / badge d’accès">
<input id="code" placeholder="Code d'accès immeuble / portail">
<input id="nbatiments" placeholder="Nombre de bâtiments sur le site">
<input id="syndic" placeholder="Nom du syndic">
<input id="contactsyndic" placeholder="Nom du contact syndic">
<input id="telephone" placeholder="Téléphone du syndic">
<input id="emailsyndic" placeholder="Email du syndic">
<input id="presidentCS" placeholder="Nom du Président du Conseil Syndical">
<input id="telephoneCS" placeholder="Téléphone Président CS">
<input id="emailCS" placeholder="Email Président CS">

</div>

<div class="card">
<div class="section-title">Agent</div>

<input id="agentNom" placeholder="Nom et prénom de l’agent">
<input id="agentTel" placeholder="Téléphone de l’agent">

<div class="planning">
<textarea id="lundi" placeholder="Horaires / tâches lundi"></textarea>
<textarea id="mardi" placeholder="Horaires / tâches mardi"></textarea>
<textarea id="mercredi" placeholder="Horaires / tâches mercredi"></textarea>
<textarea id="jeudi" placeholder="Horaires / tâches jeudi"></textarea>
<textarea id="vendredi" placeholder="Horaires / tâches vendredi"></textarea>
<textarea id="samedi" placeholder="Horaires / tâches samedi"></textarea>
<textarea id="dimanche" placeholder="Horaires / tâches dimanche"></textarea>
</div>

<textarea id="consignesAgents" placeholder="Consignes spécifiques pour l’agent"></textarea>
</div>

<div class="card">
<div class="section-title">Gestion</div>

<input id="franges" placeholder="Type de franges / matériel spécifique">
<input id="ampoules" placeholder="Type d’ampoules utilisées">

<input id="sortieOM" placeholder="Jour / heure sortie OM">
<input id="rentreeOM" placeholder="Jour / heure rentrée OM">
<input id="sortieTRI" placeholder="Jour / heure sortie TRI">
<input id="rentreeTRI" placeholder="Jour / heure rentrée TRI">

<input id="localnettoyage" placeholder="Emplacement du local nettoyage">
<input id="electricité" placeholder="Emplacement prises électriques">
<input id="Eau" placeholder="Emplacement robinet d’eau">

<textarea id="infopropres" placeholder="Informations complémentaires de gestion"></textarea>
</div>

<button class="pdf" onclick="genererFiche()">📄 Fiche agent</button>
<button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"inovtec-chantiers.firebaseapp.com",
  projectId:"inovtec-chantiers"
});

const db = getFirestore(app);
const ref = collection(db,"chantiers");

let currentId=null;
let allChantiers=[];

onSnapshot(ref,s=>{
  allChantiers=[];
  s.forEach(d=>allChantiers.push({id:d.id,...d.data()}));
  document.getElementById("liste").innerHTML=
  allChantiers.map(c=>`
  <div class="item" onclick="charger('${c.id}')">
  <b>${c.nom||""}</b><br>🔑 ${c.cles||""}
  </div>`).join("");
});

window.charger=id=>{
  const c=allChantiers.find(x=>x.id===id);
  currentId=id;
  Object.keys(c).forEach(k=>{
    if(document.getElementById(k))document.getElementById(k).value=c[k];
  });
};

window.ajouterOuModifier=async()=>{
  const data={};
  document.querySelectorAll("input,textarea").forEach(e=>data[e.id]=e.value);
  if(currentId) await updateDoc(doc(db,"chantiers",currentId),data);
  else{
    const d=await addDoc(ref,data);
    currentId=d.id;
  }
};

window.genererFiche=()=>{

const val=id=>document.getElementById(id)?.value || "";

const jours=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

const planning=jours.map(j=>`
<div style="flex:1;border:1px solid #ddd;padding:6px">
<div style="font-weight:700;font-size:11px">${j.toUpperCase()}</div>
<div style="font-size:11px">${val(j)}</div>
</div>
`).join("");

const element = document.createElement("div");

element.innerHTML = `
<div style="font-family:Inter;padding:20px">

<!-- HEADER -->
<div style="text-align:right;font-weight:800;font-size:20px;margin-bottom:20px">
${val("nom")}
</div>

<!-- INFOS -->
<div style="margin-bottom:15px">
<div><b>Adresse :</b> ${val("adresse")}</div>
<div><b>Clé :</b> ${val("cles")}</div>
<div><b>Code accès :</b> ${val("code")}</div>
<div><b>Bâtiments :</b> ${val("nbatiments")}</div>
</div>

<!-- PLANNING COLONNES -->
<div style="display:flex;gap:4px;margin-bottom:15px">
${planning}
</div>

<!-- INFOS TERRAIN -->
<div>
<div><b>Sortie OM :</b> ${val("sortieOM")}</div>
<div><b>Rentrée OM :</b> ${val("rentreeOM")}</div>
<div><b>Sortie TRI :</b> ${val("sortieTRI")}</div>
<div><b>Rentrée TRI :</b> ${val("rentreeTRI")}</div>
<div><b>Local nettoyage :</b> ${val("localnettoyage")}</div>
<div><b>Prises électriques :</b> ${val("electricité")}</div>
<div><b>Robinet d’eau :</b> ${val("Eau")}</div>
</div>

<!-- INFOS COMPLEMENTAIRES -->
<div style="margin-top:15px">
<div><b>Informations complémentaires :</b> ${val("infopropres")}</div>
</div>

</div>
`;

html2pdf().from(element).set({
  margin:10,
  filename:`fiche_${val("nom")}.pdf`,
  html2canvas:{scale:2},
  jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
}).save();

};

window.supprimer=async()=>{
if(!currentId)return;
await deleteDoc(doc(db,"chantiers",currentId));
nouveau();
};

window.nouveau=()=>{
currentId=null;
document.querySelectorAll("input,textarea").forEach(e=>e.value="");
};

</script>

</body>
</html>
