<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers PRO</title>

<style>
body { margin:0; font-family:Arial; background:#f3f4f6; }
.app { display:flex; height:100vh; }

.sidebar {
  width:30%;
  background:white;
  border-right:2px solid #ddd;
  padding:10px;
  overflow-y:auto;
}

.top-actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.new { background:#16a34a; color:white; }
.delete { background:red; color:white; }

.filter {
  width:100%;
  margin-bottom:8px;
  padding:8px;
}

.item {
  padding:10px;
  background:#f9fafb;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
}

.detail {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.card {
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
}

.section-title {
  font-weight:bold;
  margin-bottom:10px;
  color:#16a34a;
}

input, textarea {
  width:100%;
  margin-bottom:8px;
  padding:8px;
}

button.save {
  width:100%;
  background:#16a34a;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
}

button.pdf {
  width:100%;
  background:#2563eb;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}

button.view {
  width:100%;
  background:#9333ea;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="app">

<!-- GAUCHE -->
<div class="sidebar">
  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">➕ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">🗑️ Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Filtrer..." oninput="appliquerFiltres()">

  <div id="liste"></div>
</div>

<!-- DROITE -->
<div class="detail">

  <!-- PDF -->
  <div class="card">
    <div class="section-title">📄 Cahier des charges</div>

    <input type="file" id="pdfFile" accept="application/pdf">

    <button class="pdf" onclick="uploadPDF()">📎 Importer PDF</button>

    <button class="view" id="btnVoirPDF" style="display:none;" onclick="ouvrirPDF()">👁️ Voir le PDF</button>
  </div>

  <!-- CONTACT -->
  <div class="card">
    <div class="section-title">📞 Contact</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse">
    <input id="client" placeholder="Client">
  </div>

  <button class="save" onclick="ajouterOuModifier()">💾 Enregistrer</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";


const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const chantiersRef = collection(db, "chantiers");

let currentId = null;
let pdfURL = null;
let allChantiers = [];

onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });
  afficherListe(allChantiers);
});

function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  data.forEach(c => {
    liste.innerHTML += `
      <div class="item" onclick="charger('${c.id}')">
        <b>${c.nom || "Sans nom"}</b>
      </div>
    `;
  });
}

window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;

  document.getElementById("nom").value = c.nom || "";
  document.getElementById("adresse").value = c.adresse || "";
  document.getElementById("client").value = c.client || "";

  pdfURL = c.pdfURL || null;

  document.getElementById("btnVoirPDF").style.display = pdfURL ? "block" : "none";
};

window.uploadPDF = async function() {

  if (!currentId) {
    alert("Enregistre le chantier avant");
    return;
  }

  const file = document.getElementById("pdfFile").files[0];
  if (!file) return alert("Choisis un PDF");

  const storageRef = ref(storage, "pdfs/" + currentId);

  await uploadBytes(storageRef, file);

  pdfURL = await getDownloadURL(storageRef);

  await updateDoc(doc(db, "chantiers", currentId), {
    pdfURL: pdfURL
  });

  document.getElementById("btnVoirPDF").style.display = "block";
};

window.ouvrirPDF = function() {
  if (pdfURL) window.open(pdfURL, "_blank");
};

window.ajouterOuModifier = async function() {

  const data = {
    nom: val("nom"),
    adresse: val("adresse"),
    client: val("client"),
    pdfURL: pdfURL || null
  };

  if (currentId) {
    await updateDoc(doc(db, "chantiers", currentId), data);
  } else {
    const docRef = await addDoc(chantiersRef, data);
    currentId = docRef.id;
  }
};

window.supprimer = async function() {
  if (!currentId) return;
  await deleteDoc(doc(db, "chantiers", currentId));
  nouveau();
};

window.nouveau = function() {
  currentId = null;
  pdfURL = null;
  document.querySelectorAll("input").forEach(el => el.value = "");
  document.getElementById("btnVoirPDF").style.display = "none";
};

function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
