<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers PRO</title>

<style>
body { margin:0; font-family:Arial; background:#f3f4f6; }
.app { display:flex; height:100vh; }

/* GAUCHE */
.sidebar {
  width:30%;
  background:white;
  border-right:2px solid #ddd;
  overflow-y:auto;
  padding:10px;
}

.top-actions {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.new { background:#16a34a; color:white; }
.delete { background:red; color:white; }

select {
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

.item {
  padding:10px;
  border-radius:8px;
  background:#f9fafb;
  margin-bottom:8px;
  cursor:pointer;
}
.item:hover { background:#e5e7eb; }

/* DROITE */
.detail {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.card {
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}

.section-title {
  font-weight:bold;
  margin-bottom:10px;
  color:#16a34a;
}

input, textarea {
  width:100%;
  margin-bottom:8px;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

button.save {
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#16a34a;
  color:white;
  width:100%;
}

</style>
</head>

<body>

<div class="app">

<!-- GAUCHE -->
<div class="sidebar">

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">➕ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">🗑️ Supprimer</button>
  </div>

  <!-- TRI -->
  <select id="tri" onchange="changerTri()">
    <option value="nom">🔤 Trier par nom</option>
    <option value="agents">👥 Trier par agents</option>
    <option value="client">📞 Trier par contact</option>
    <option value="adresse">📍 Trier par ville</option>
  </select>

  <input id="search" placeholder="🔍 Rechercher..." oninput="filtrer()">
  <div id="liste"></div>

</div>

<!-- DROITE -->
<div class="detail">

  <div class="card">
    <div class="section-title">📞 Contact</div>
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse">
    <input id="client" placeholder="Nom du client">
    <input id="telephone" placeholder="Téléphone">
    <input id="email" placeholder="Email">
  </div>

  <div class="card">
    <div class="section-title">👥 Agents</div>
    <input id="agents" placeholder="Noms des agents">
    <input id="horaires" placeholder="Horaires">
    <input id="jours" placeholder="Jours d’intervention">
    <textarea id="consignesAgents" placeholder="Consignes spécifiques agents"></textarea>
  </div>

  <div class="card">
    <div class="section-title">🧰 Matériel</div>
    <input id="materiel" placeholder="Matériel sur site">
    <input id="produits" placeholder="Produits utilisés">
    <input id="ampoules" placeholder="Type d’ampoules">
    <input id="cles" placeholder="Nombre de clés">
  </div>

  <div class="card">
    <div class="section-title">⚙️ Gestion</div>
    <input id="conteneurs" placeholder="Gestion conteneurs">
    <input id="frequence" placeholder="Fréquence nettoyage">
    <textarea id="notes" placeholder="Notes générales"></textarea>
  </div>

  <button class="save" onclick="ajouterOuModifier()">💾 Enregistrer</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chantiersRef = collection(db, "chantiers");

let currentId = null;
let allChantiers = [];
let triActuel = "nom";

onSnapshot(chantiersRef, (snapshot) => {
  allChantiers = [];
  snapshot.forEach(docItem => {
    allChantiers.push({ id: docItem.id, ...docItem.data() });
  });
  appliquerTri();
});

function appliquerTri() {
  let data = [...allChantiers];

  data.sort((a, b) => {
    return (a[triActuel] || "").localeCompare(b[triActuel] || "");
  });

  afficherListe(data);
}

window.changerTri = function() {
  triActuel = document.getElementById("tri").value;
  appliquerTri();
};

function afficherListe(data) {
  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  data.forEach(c => {
    liste.innerHTML += `
      <div class="item" onclick="charger('${c.id}')">
        <b>${c.nom || "Sans nom"}</b><br>
        <small>${c.adresse || ""}</small>
      </div>
    `;
  });
}

window.filtrer = function() {
  const val = document.getElementById("search").value.toLowerCase();

  const filtre = allChantiers.filter(c =>
    (c.nom || "").toLowerCase().includes(val)
  );

  afficherListe(filtre);
};

window.charger = function(id) {
  const c = allChantiers.find(x => x.id === id);
  currentId = id;

  for (let key in c) {
    if (document.getElementById(key)) {
      document.getElementById(key).value = c[key];
    }
  }
};

window.nouveau = function() {
  currentId = null;
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
};

window.ajouterOuModifier = async function() {

  const data = {
    nom: val("nom"),
    adresse: val("adresse"),
    client: val("client"),
    telephone: val("telephone"),
    email: val("email"),
    agents: val("agents"),
    horaires: val("horaires"),
    jours: val("jours"),
    consignesAgents: val("consignesAgents"),
    materiel: val("materiel"),
    produits: val("produits"),
    ampoules: val("ampoules"),
    cles: val("cles"),
    conteneurs: val("conteneurs"),
    frequence: val("frequence"),
    notes: val("notes")
  };

  if (currentId) {
    await updateDoc(doc(db, "chantiers", currentId), data);
  } else {
    await addDoc(chantiersRef, data);
  }

  nouveau();
};

window.supprimer = async function() {
  if (!currentId) {
    alert("Sélectionne un chantier");
    return;
  }
  await deleteDoc(doc(db, "chantiers", currentId));
  nouveau();
};

function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
