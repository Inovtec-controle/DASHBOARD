<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVTEC KONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}
.logo span { color:#22c55e; }

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}
.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
}

/* PLANNING */
.planning {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:6px;
}

.planning textarea {
  height:100px;
  font-size:12px;
}

.save, .pdf {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.save { background:#22c55e; color:white; }
.pdf { background:#111827; color:white; }

@media (max-width:768px){
  .app { flex-direction:column; }
  .sidebar { width:100%; }
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Nom...">

  <div id="liste"></div>
</div>

<div class="detail">

  <div class="card">
    <div class="section-title">Informations</div>

    <input id="nom" placeholder="Nom du chantier">
    <input id="cles" placeholder="Numéro de clé">
    <input id="adresse" placeholder="Adresse">
  </div>

  <div class="card">
    <div class="section-title">Agent</div>

    <input id="agentNom" placeholder="Nom de l'agent">

    <div class="planning">
      <textarea id="lundi" placeholder="Lundi"></textarea>
      <textarea id="mardi" placeholder="Mardi"></textarea>
      <textarea id="mercredi" placeholder="Mercredi"></textarea>
      <textarea id="jeudi" placeholder="Jeudi"></textarea>
      <textarea id="vendredi" placeholder="Vendredi"></textarea>
      <textarea id="samedi" placeholder="Samedi"></textarea>
      <textarea id="dimanche" placeholder="Dimanche"></textarea>
    </div>

  </div>

  <div class="card">
    <div class="section-title">Gestion</div>

    <input id="sortieOM" placeholder="Sortie OM">
    <input id="rentreeOM" placeholder="Rentré OM">
    <input id="sortieTRI" placeholder="Sortie TRI">
    <input id="rentreeTRI" placeholder="Rentré TRI">

    <textarea id="notes" placeholder="Notes"></textarea>
  </div>

  <button class="pdf" onclick="genererFiche()">📄 Fiche agent</button>
  <button class="save" onclick="save()">Enregistrer</button>

</div>

</div>

<script>

function val(id){
  return document.getElementById(id)?.value || "";
}

function save(){
  localStorage.setItem("data", JSON.stringify(
    [...document.querySelectorAll("input,textarea")].reduce((acc,el)=>{
      acc[el.id]=el.value;
      return acc;
    },{})
  ));
}

function load(){
  const data = JSON.parse(localStorage.getItem("data")||"{}");
  Object.keys(data).forEach(k=>{
    if(document.getElementById(k)) document.getElementById(k).value=data[k];
  });
}
load();

function genererFiche(){

  const jours = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

  const planningHTML = jours.map(j=>`
    <div class="pcol">
      <div class="plabel">${j.toUpperCase()}</div>
      <div class="pval">${val(j)}</div>
    </div>
  `).join("");

  const html = `
  <html>
  <head>
  <style>
  body { font-family:Inter; padding:20px; }

  .header { font-size:22px; font-weight:700; margin-bottom:20px; }

  .card { border:1px solid #ccc; border-radius:10px; padding:12px; margin-bottom:10px; }

  .label { font-size:14px; font-weight:600; }

  .value { font-size:14px; font-weight:400; }

  .planning {
    display:grid;
    grid-template-columns: repeat(7,1fr);
    gap:6px;
    margin-top:10px;
  }

  .pcol { border:1px solid #ddd; padding:6px; height:200px; }

  .plabel { font-size:11px; font-weight:600; margin-bottom:5px; }

  .pval { font-size:12px; }

  </style>
  </head>

  <body>

  <div class="header">${val("nom")}</div>

  <div class="card">
    <div class="label">Clé</div>
    <div class="value">${val("cles")}</div>
  </div>

  <div class="card">
    <div class="label">Adresse</div>
    <div class="value">${val("adresse")}</div>
  </div>

  <div class="card">
    <div class="label">Planning</div>
    <div class="planning">${planningHTML}</div>
  </div>

  <div class="card">
    <div class="label">OM</div>
    <div class="value">Sortie: ${val("sortieOM")} / Rentrée: ${val("rentreeOM")}</div>
  </div>

  <div class="card">
    <div class="label">TRI</div>
    <div class="value">Sortie: ${val("sortieTRI")} / Rentrée: ${val("rentreeTRI")}</div>
  </div>

  <div class="card">
    <div class="label">Notes</div>
    <div class="value">${val("notes")}</div>
  </div>

  </body></html>`;

  const w = window.open();
  w.document.write(html);
  w.print();
}

</script>

</body>
</html>
