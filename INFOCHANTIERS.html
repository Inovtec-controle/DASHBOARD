<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Chantiers</title>

<style>
body {
  font-family: Arial;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
}

.form {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.form input, .form textarea {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.add {
  background: #16a34a;
  color: white;
  width: 100%;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.actions {
  margin-top: 10px;
}

.delete {
  background: red;
  color: white;
}

</style>
</head>

<body>

<div class="container">
  <h1>📋 Base Chantiers</h1>

  <div class="form">
    <input id="nom" placeholder="Nom du chantier">
    <input id="adresse" placeholder="Adresse">
    <input id="responsable" placeholder="Responsable">
    <input id="cles" placeholder="Nombre de clés">
    <input id="ampoules" placeholder="Type d’ampoules">
    <input id="conteneurs" placeholder="Conteneurs (avec / sans sacs)">
    <textarea id="notes" placeholder="Notes"></textarea>

    <button class="add" onclick="ajouterChantier()">➕ Ajouter chantier</button>
  </div>

  <div id="liste"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// 🔥 REMPLACE PAR TA CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};


// INIT FIREBASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// COLLECTION
const chantiersRef = collection(db, "chantiers");


// ➕ AJOUTER
window.ajouterChantier = async function() {

  const chantier = {
    nom: document.getElementById("nom").value,
    adresse: document.getElementById("adresse").value,
    responsable: document.getElementById("responsable").value,
    cles: document.getElementById("cles").value,
    ampoules: document.getElementById("ampoules").value,
    conteneurs: document.getElementById("conteneurs").value,
    notes: document.getElementById("notes").value,
    date: new Date()
  };

  await addDoc(chantiersRef, chantier);

  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
};


// 🔄 AFFICHAGE TEMPS RÉEL
onSnapshot(chantiersRef, (snapshot) => {

  const liste = document.getElementById("liste");
  liste.innerHTML = "";

  snapshot.forEach((docItem) => {

    const c = docItem.data();

    liste.innerHTML += `
      <div class="card">
        <h3>${c.nom || ""}</h3>
        <p><b>Adresse :</b> ${c.adresse || ""}</p>
        <p><b>Responsable :</b> ${c.responsable || ""}</p>
        <p><b>Clés :</b> ${c.cles || ""}</p>
        <p><b>Ampoules :</b> ${c.ampoules || ""}</p>
        <p><b>Conteneurs :</b> ${c.conteneurs || ""}</p>
        <p><b>Notes :</b> ${c.notes || ""}</p>

        <div class="actions">
          <button class="delete" onclick="supprimerChantier('${docItem.id}')">🗑️ Supprimer</button>
        </div>
      </div>
    `;
  });

});


// 🗑️ SUPPRIMER
window.supprimerChantier = async function(id) {
  await deleteDoc(doc(db, "chantiers", id));
};

</script>

</body>
</html>
