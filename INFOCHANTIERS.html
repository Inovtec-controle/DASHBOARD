<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVTEC KONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}
.logo span { color:#22c55e; }

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}
.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
}

.planning {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.planning textarea{
  height:90px;
  font-size:12px;
}

.save, .pdf {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.save { background:#22c55e; color:white; }
.pdf { background:#111827; color:white; }

@media (max-width:768px){
  .app { flex-direction:column; }
  .sidebar { width:100%; }
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Rechercher un chantier...">

  <div id="liste"></div>
</div>

<div class="detail">

<div class="card">
<div class="section-title">Informations</div>

<input id="nom" placeholder="Nom de la résidence / chantier">
<input id="cles" placeholder="Numéro de clé / badge d’accès">
<input id="adresse" placeholder="Adresse complète du site">
<input id="syndic" placeholder="Nom du syndic">
<input id="telephone" placeholder="Téléphone du site">
<input id="presidentCS" placeholder="Nom du président du conseil syndical">
<input id="telephoneCS" placeholder="Téléphone du président CS">
<input id="email" placeholder="Email du contact principal">
</div>

<div class="card">
<div class="section-title">Agent</div>

<input id="agentNom" placeholder="Nom de l’agent affecté">
<input id="agentTel" placeholder="Téléphone de l’agent">

<div class="planning">
<textarea id="lundi" placeholder="Tâches du lundi"></textarea>
<textarea id="mardi" placeholder="Tâches du mardi"></textarea>
<textarea id="mercredi" placeholder="Tâches du mercredi"></textarea>
<textarea id="jeudi" placeholder="Tâches du jeudi"></textarea>
<textarea id="vendredi" placeholder="Tâches du vendredi"></textarea>
<textarea id="samedi" placeholder="Tâches du samedi"></textarea>
<textarea id="dimanche" placeholder="Tâches du dimanche"></textarea>
</div>

<input id="jours" placeholder="(optionnel) jours d’intervention globaux">
<input id="horaires" placeholder="(optionnel) horaires d’intervention">

<textarea id="consignesAgents" placeholder="Consignes spécifiques pour l’agent"></textarea>
</div>

<div class="card">
<div class="section-title">Gestion</div>

<input id="franges" placeholder="Type de franges utilisées">
<input id="ampoules" placeholder="Type d’ampoules à remplacer">

<input id="sortieOM" placeholder="Jour de sortie des OM">
<input id="rentreeOM" placeholder="Jour de rentrée des OM">

<input id="sortieTRI" placeholder="Jour de sortie du TRI">
<input id="rentreeTRI" placeholder="Jour de rentrée du TRI">

<textarea id="notes" placeholder="Notes de gestion / remarques importantes"></textarea>
</div>

<button class="pdf" onclick="genererFiche()">📄 Fiche agent</button>
<button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"inovtec-chantiers.firebaseapp.com",
  projectId:"inovtec-chantiers"
});

const db = getFirestore(app);
const ref = collection(db,"chantiers");

let currentId=null;
let allChantiers=[];

onSnapshot(ref,s=>{
  allChantiers=[];
  s.forEach(d=>allChantiers.push({id:d.id,...d.data()}));
  document.getElementById("liste").innerHTML=
  allChantiers.map(c=>`
  <div class="item" onclick="charger('${c.id}')">
  <b>${c.nom||""}</b><br>🔑 ${c.cles||""}
  </div>`).join("");
});

window.charger=id=>{
  const c=allChantiers.find(x=>x.id===id);
  currentId=id;
  Object.keys(c).forEach(k=>{
    if(document.getElementById(k))document.getElementById(k).value=c[k];
  });
};

window.ajouterOuModifier=async()=>{
  const data={};
  document.querySelectorAll("input,textarea").forEach(e=>data[e.id]=e.value);
  if(currentId) await updateDoc(doc(db,"chantiers",currentId),data);
  else{
    const d=await addDoc(ref,data);
    currentId=d.id;
  }
};

window.genererFiche=()=>{

const jours=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

const planning=jours.map(j=>`
<div class="pcol">
<div class="plabel">${j.toUpperCase()}</div>
<div class="pval">${val(j)}</div>
</div>`).join("");

const html=`
<html>
<head>
<style>
body{font-family:Inter;padding:25px;}

.header{
font-size:24px;
font-weight:800;
margin-bottom:20px;
}
.header span{color:#22c55e;}

.card{
background:rgba(243,244,246,0.3);
border-radius:12px;
padding:15px;
margin-bottom:10px;
}

.label{
font-size:15px;
font-weight:600;
margin-bottom:5px;
}

.value{
font-size:14px;
font-weight:400;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.planning{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:10px;
}

.pcol{
background:white;
border-radius:8px;
padding:6px;
height:180px;
}

.plabel{
font-size:11px;
font-weight:600;
margin-bottom:4px;
}

.pval{
font-size:12px;
white-space:pre-line;
}

.desc{
font-size:11px;
color:#6b7280;
margin-bottom:4px;
}
</style>
</head>

<body>

<div class="header">${val("nom")}<span>.</span></div>

<div class="card">
<div class="desc">Identification du site</div>
<div class="label">Numéro de clé</div>
<div class="value">${val("cles")}</div>
</div>

<div class="card">
<div class="desc">Localisation du chantier</div>
<div class="label">Adresse</div>
<div class="value">${val("adresse")}</div>
</div>

<div class="card">
<div class="desc">Organisation des tâches hebdomadaires</div>
<div class="label">Planning</div>
<div class="planning">${planning}</div>
</div>

<div class="grid">

<div class="card">
<div class="desc">Gestion des déchets ménagers</div>
<div class="label">Sortie OM</div>
<div class="value">${val("sortieOM")}</div>
</div>

<div class="card">
<div class="desc">Retour des conteneurs OM</div>
<div class="label">Rentré OM</div>
<div class="value">${val("rentreeOM")}</div>
</div>

<div class="card">
<div class="desc">Gestion du tri sélectif</div>
<div class="label">Sortie TRI</div>
<div class="value">${val("sortieTRI")}</div>
</div>

<div class="card">
<div class="desc">Retour des conteneurs TRI</div>
<div class="label">Rentré TRI</div>
<div class="value">${val("rentreeTRI")}</div>
</div>

</div>

<div class="card">
<div class="desc">Informations complémentaires</div>
<div class="label">Notes</div>
<div class="value">${val("notes")}</div>
</div>

</body>
</html>`;

const w=window.open();
w.document.write(html);
w.print();
};

window.supprimer=async()=>{
if(!currentId)return;
await deleteDoc(doc(db,"chantiers",currentId));
nouveau();
};

window.nouveau=()=>{
currentId=null;
document.querySelectorAll("input,textarea").forEach(e=>e.value="");
};

function val(id){return document.getElementById(id).value;}

</script>

</body>
</html>
