<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFOS CHANTIERS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

<!-- LIB PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Inter', sans-serif;
  background:#e5e7eb;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:320px;
  background:#f9fafb;
  padding:15px;
  border-right:1px solid #d1d5db;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}
.logo span { color:#22c55e; }

.top-actions {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
}
.new { background:#22c55e; color:white; }
.delete { background:#e5e7eb; }

.filter {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:6px;
}

.item {
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  background:white;
  border:1px solid #d1d5db;
}

.detail {
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.card {
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.section-title {
  font-weight:700;
  margin-bottom:10px;
  color:#22c55e;
}

input, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-bottom:8px;
}

.planning {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.planning textarea{
  height:90px;
  font-size:12px;
}

.save, .pdf {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.save { background:#22c55e; color:white; }
.pdf { background:#111827; color:white; }

@media (max-width:768px){
  .app { flex-direction:column; }
  .sidebar { width:100%; }
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <div class="logo">inovtec<span>.</span></div>

  <div class="top-actions">
    <button class="btn new" onclick="nouveau()">+ Nouveau</button>
    <button class="btn delete" onclick="supprimer()">Supprimer</button>
  </div>

  <input class="filter" id="filtreNom" placeholder="Rechercher un chantier...">

  <div id="liste"></div>
</div>

<div class="detail">

<div class="card">
<div class="section-title">Informations</div>

<input id="nom" placeholder="Nom de la résidence">
<input id="adresse" placeholder="Adresse de la résidence">
<input id="cles" placeholder="Numéro de clé / badge d’accès">
<input id="code" placeholder="Code d'accès">
<input id="nbatiments" placeholder="Nombre de batîments">
</div>

<div class="card">
<div class="section-title">Agent</div>

<input id="agentNom" placeholder="Nom de l’agent">
<input id="agentTel" placeholder="Téléphone de l’agent">

<div class="planning">
<textarea id="lundi"></textarea>
<textarea id="mardi"></textarea>
<textarea id="mercredi"></textarea>
<textarea id="jeudi"></textarea>
<textarea id="vendredi"></textarea>
<textarea id="samedi"></textarea>
<textarea id="dimanche"></textarea>
</div>
</div>

<div class="card">
<div class="section-title">Gestion</div>

<input id="sortieOM">
<input id="rentreeOM">
<input id="sortieTRI">
<input id="rentreeTRI">
<input id="localnettoyage">
<input id="electricité">
<input id="Eau">
<textarea id="notes"></textarea>

</div>

<button class="pdf" onclick="genererFiche()">📄 Fiche agent</button>
<button class="save" onclick="ajouterOuModifier()">Enregistrer</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"inovtec-chantiers.firebaseapp.com",
  projectId:"inovtec-chantiers"
});

const db = getFirestore(app);
const ref = collection(db,"chantiers");

let currentId=null;
let allChantiers=[];

onSnapshot(ref,s=>{
  allChantiers=[];
  s.forEach(d=>allChantiers.push({id:d.id,...d.data()}));
  document.getElementById("liste").innerHTML=
  allChantiers.map(c=>`
  <div class="item" onclick="charger('${c.id}')">
  <b>${c.nom||""}</b><br>🔑 ${c.cles||""}
  </div>`).join("");
});

window.charger=id=>{
  const c=allChantiers.find(x=>x.id===id);
  currentId=id;
  Object.keys(c).forEach(k=>{
    if(document.getElementById(k))document.getElementById(k).value=c[k];
  });
};

window.ajouterOuModifier=async()=>{
  const data={};
  document.querySelectorAll("input,textarea").forEach(e=>data[e.id]=e.value);
  if(currentId) await updateDoc(doc(db,"chantiers",currentId),data);
  else{
    const d=await addDoc(ref,data);
    currentId=d.id;
  }
};

window.genererFiche=()=>{

const val=id=>document.getElementById(id)?.value || "";

const jours=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

const planning=jours.map(j=>`
<div class="pcol">
<div class="plabel">${j.toUpperCase()}</div>
<div class="pval">${val(j)}</div>
</div>`).join("");

const element = document.createElement("div");

element.innerHTML = `
<style>
body{font-family:Inter;padding:20px;}
.header{font-size:26px;font-weight:700;margin-bottom:10px;}
.section{background:#f3f4f6;border-radius:12px;padding:10px;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.planning{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.pcol{background:white;border:1px solid #ddd;padding:5px;height:120px;}
.plabel{font-size:10px;font-weight:600;}
.pval{font-size:11px;}
</style>

<div class="header">${val("nom")}</div>

<div class="section">Numéro de clé : ${val("cles")}</div>
<div class="section">Adresse : ${val("adresse")}</div>

<div class="grid">
<div class="section">Code : ${val("code")}</div>
<div class="section">Bâtiments : ${val("nbatiments")}</div>
<div class="section">Local nettoyage : ${val("localnettoyage")}</div>
<div class="section">Prises : ${val("electricité")}</div>
<div class="section">Eau : ${val("Eau")}</div>
</div>

<div class="section">
${planning}
</div>

<div class="grid">
<div class="section">Sortie OM : ${val("sortieOM")}</div>
<div class="section">Rentrée OM : ${val("rentreeOM")}</div>
<div class="section">Sortie TRI : ${val("sortieTRI")}</div>
<div class="section">Rentrée TRI : ${val("rentreeTRI")}</div>
</div>

<div class="section">Notes : ${val("notes")}</div>
`;

html2pdf()
.set({
  margin:10,
  filename: "fiche-agent.pdf",
  html2canvas: { scale:2 },
  jsPDF: { unit:"mm", format:"a4", orientation:"portrait" }
})
.from(element)
.save();

};

window.supprimer=async()=>{
if(!currentId)return;
await deleteDoc(doc(db,"chantiers",currentId));
nouveau();
};

window.nouveau=()=>{
currentId=null;
document.querySelectorAll("input,textarea").forEach(e=>e.value="");
};

</script>

</body>
</html>
